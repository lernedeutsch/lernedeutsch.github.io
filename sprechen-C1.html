<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lektion 1 A1 – Deutscher Sprachtrainer</title>
<style>
body{font-family:Arial,sans-serif;background:#15211C;color:#F2EFE2;margin:0}
header{padding:20px;background:#21312A}
main{max-width:900px;margin:auto;padding:20px}
#chat{min-height:500px;border:1px solid #444;padding:10px;background:#21312A}
.bot,.student,.feedback{margin:8px;padding:10px;border-radius:10px}
.bot{background:#ECE6D2;color:#222}
.student{background:#2d4d40}
.feedback{background:#664b2f}
button,input{padding:10px;margin:5px}
</style>
</head>
<body>
<header><h1>Lektion 1 A1 – Guten Tag! — Begrüßung und Vorstellung</h1></header>
<main>
<div id="chat"></div>
<p id="status">Bereit.</p>
<button id="mic">🎤 Mikrofon</button>
<input id="text" placeholder="Antwort eingeben">
<button id="send">Senden</button>
<button id="reset">Neu starten</button>
</main>

<script>
const lesson=[
  // Teil 1: Begrüßung - Dialog nieformalny (1)
  {q:"Hallo! Wie heißt du?",exp:["ich heiße","mein name ist","ich bin"],ok:"Sehr gut!",retry:"Antworte: Ich heiße ..."},
  {q:"Gut! Und wie geht es dir?",exp:["gut","sehr gut","es geht"],ok:"Prima!",retry:"Sage: Gut, danke."},
  {q:"Tschüss!",exp:["tschüss","tschuss"],ok:"Perfekt!",retry:"Sage: Tschüss."},
  
  // Teil 1: Begrüßung - różne grupy według czasu dnia
  {q:"Wie sagt man morgens?",exp:["guten morgen"],ok:"Richtig!",retry:"Sage: Guten Morgen!"},
  {q:"Wie sagt man tagsüber?",exp:["guten tag"],ok:"Winkel gut!",retry:"Sage: Guten Tag!"},
  {q:"Wie sagt man abends?",exp:["guten abend"],ok:"Exzellent!",retry:"Sage: Guten Abend!"},
  
  // Teil 2: Vorstellung - Dialog formalny (2)
  {q:"Guten Tag. Wie heißen Sie?",exp:["mein name ist","ich heiße","ich bin"],ok:"Sehr gut!",retry:"Antworte: Mein Name ist ..."},
  {q:"Und Sie?",exp:["mein name ist","ich heiße"],ok:"Prima!",retry:"Sage: Ich heiße ..."},
  
  // Teil 2: Vorstellung - Dialog nieformalny (1 kontynuacja)
  {q:"Hallo! Ich heiße Lena. Und du?",exp:["ich heiße","mein name ist"],ok:"Perfekt!",retry:"Sage: Ich heiße ..."},
  
  // Teil 3: Alphabet
  {q:"Nenne den Buchstaben A!",exp:["a"],ok:"Richtig!",retry:"Sage: A"},
  {q:"Nenne den Buchstaben B!",exp:["b"],ok:"Gut!",retry:"Sage: B"},
  {q:"Nenne den Buchstaben C!",exp:["c"],ok:"Perfekt!",retry:"Sage: C"},
  {q:"Nenne A, B oder C!",exp:["a","b","c"],ok:"Exzellent!",retry:"Sage A, B oder C"}
];

let i=0, rec;
const chat=document.getElementById("chat");
const status=document.getElementById("status");

function bubble(cls,txt){
 chat.innerHTML+=`<div class="${cls}">${txt}</div>`;
 chat.scrollTop=chat.scrollHeight;
}

function speak(txt){
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(txt);
 u.lang="de-DE";
 u.onend=()=>startListening();
 speechSynthesis.speak(u);
}

function ask(){
 if(i>=lesson.length){
   bubble("feedback","Dialog ist beendt!");
   speak("Dialog ist beendt!");
   return;
 }
 bubble("bot",lesson[i].q);
 speak(lesson[i].q);
}

function normalize(t){
 return t.toLowerCase().replace(/[.,!?]/g,"").trim();
}

function handle(ans){
 bubble("student",ans);
 const a=normalize(ans);
 const step=lesson[i];
 const ok=step.exp.some(e=>a.includes(e));
 if(ok){
   bubble("feedback","✅ "+step.ok);
   i++;
   setTimeout(ask,1200);
 }else{
   bubble("feedback","❌ "+step.retry);
   speak(step.retry);
 }
}

function startListening(){
 if(rec){
   try{rec.start();status.textContent="Ich höre zu...";}catch(e){}
 }
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
 rec=new SR();
 rec.lang="de-DE";
 rec.onresult=e=>handle(e.results[0][0].transcript);
 rec.onend=()=>status.textContent="Bereit";
}

document.getElementById("mic").onclick=()=>startListening();
document.getElementById("send").onclick=()=>{
 const v=document.getElementById("text").value.trim();
 if(v){ document.getElementById("text").value=""; handle(v);}
};
document.getElementById("reset").onclick=()=>{
 chat.innerHTML=""; i=0; ask();
};

ask();
</script>
</body>
</html>
