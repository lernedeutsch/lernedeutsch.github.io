<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Nele 3D</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(39, 104, 180, 0.14), transparent 38%),
        linear-gradient(180deg, #081528 0%, #06111f 100%);
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #info {
      position: absolute;
      top: 18px;
      left: 18px;
      padding: 10px 16px;
      border: 1px solid rgba(118, 177, 255, 0.18);
      border-radius: 12px;
      color: white;
      background: rgba(9, 25, 44, 0.78);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(12px);
      font-size: 16px;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    #info.ready {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="info">Nele 3D wird geladen...</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { VRMLoaderPlugin, VRMUtils } from "https://unpkg.com/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js";

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.42, 2.15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(1.5, 2.5, 3);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x9ec9ff, 1.2);
    fillLight.position.set(-2, 1.4, 2);
    scene.add(fillLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.25);
    scene.add(ambientLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0);
    controls.enablePan = false;
    controls.enableZoom = false;
    controls.enableRotate = false;
    controls.update();

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    let currentVrm = null;
    let mouthValue = 0;
    let emotion = "neutral";
    let nodRequested = false;
    let nodTime = 0;

    const clock = new THREE.Clock();
    let blinkTimer = 0;
    let nextBlinkTime = 2 + Math.random() * 3;

    async function checkSpeakingStatus() {
      try {
        const response = await fetch("https://nele-backend.onrender.com/status");
        const data = await response.json();
        mouthValue = Number(data.mouth || 0);
        emotion = data.emotion || "neutral";
        if (data.nod) {
          nodRequested = true;
          nodTime = 0;
        }
      } catch (error) {
        console.log("Brak połączenia z serwerem Nele.");
      }
    }

    setInterval(checkSpeakingStatus, 300);

    loader.load(
      "../assets/avatars/Nele.vrm",
      (gltf) => {
        const vrm = gltf.userData.vrm;

        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        currentVrm = vrm;

        VRMUtils.rotateVRM0(vrm);

        const leftUpperArm = currentVrm.humanoid?.getNormalizedBoneNode("leftUpperArm");
        const rightUpperArm = currentVrm.humanoid?.getNormalizedBoneNode("rightUpperArm");

        if (leftUpperArm) leftUpperArm.rotation.z = -1.05;
        if (rightUpperArm) rightUpperArm.rotation.z = 1.05;

        vrm.scene.position.set(0, -0.15, 0);
        vrm.scene.scale.set(1.28, 1.28, 1.28);

        scene.add(vrm.scene);

        const info = document.getElementById("info");
        info.innerText = "Nele ist bereit.";

        setTimeout(function () {
          info.classList.add("ready");
        }, 900);
      },
      (progress) => {
        console.log("Ładowanie Nele:", progress);
      },
      (error) => {
        console.error("Błąd ładowania VRM:", error);
        document.getElementById("info").innerText = "Błąd ładowania Nele.";
      }
    );

    function setBlink(value) {
      if (!currentVrm || !currentVrm.expressionManager) return;
      currentVrm.expressionManager.setValue("blink", value);
    }

    function setMouth(value) {
      if (!currentVrm || !currentVrm.expressionManager) return;
      currentVrm.expressionManager.setValue("aa", value);
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.elapsedTime;

      if (currentVrm) {
        currentVrm.update(delta);

        const breath = Math.sin(elapsed * 2) * 0.008;
        currentVrm.scene.position.y = -0.15 + breath;
        currentVrm.scene.rotation.y = Math.sin(elapsed * 0.7) * 0.02;

        setMouth(mouthValue);

        if (emotion === "happy") {
          currentVrm.expressionManager?.setValue("happy", 0.65);
        } else {
          currentVrm.expressionManager?.setValue("happy", 0);
        }

        const head = currentVrm.humanoid?.getNormalizedBoneNode("head");

        if (head && nodRequested) {
          nodTime += delta;
          const nodAngle = Math.sin(nodTime * 5) * 0.22;
          head.rotation.x = nodAngle;

          if (nodTime > 1.6) {
            nodRequested = false;
            nodTime = 0;
            head.rotation.x = 0;
          }
        } else if (head) {
          head.rotation.x *= 0.85;
        }

        blinkTimer += delta;

        if (blinkTimer > nextBlinkTime && blinkTimer < nextBlinkTime + 0.08) {
          setBlink(1);
        } else {
          setBlink(0);
        }

        if (blinkTimer > nextBlinkTime + 0.15) {
          blinkTimer = 0;
          nextBlinkTime = 2 + Math.random() * 4;
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
