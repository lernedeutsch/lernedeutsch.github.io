<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <title>Nele 3D</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(39, 104, 180, 0.22), transparent 38%),
        linear-gradient(180deg, #0b1d33 0%, #071525 100%);
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #info {
      position: absolute;
      top: 18px;
      left: 18px;
      padding: 10px 16px;
      border: 1px solid rgba(118, 177, 255, 0.18);
      border-radius: 12px;
      color: white;
      background: rgba(9, 25, 44, 0.78);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(12px);
      font-size: 16px;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    #info.ready {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <div id="info">Nele 3D wird geladen...</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { VRMLoaderPlugin, VRMUtils } from "https://unpkg.com/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js";

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.42, 2.15);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(1.5, 2.5, 3);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x9ec9ff, 1.2);
    fillLight.position.set(-2, 1.4, 2);
    scene.add(fillLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.25);
    scene.add(ambientLight);

    const warmLight = new THREE.PointLight(0xffc980, 1.1, 8);
    warmLight.position.set(-1.35, 1.15, 1.3);
    scene.add(warmLight);

    const blueAccent = new THREE.PointLight(0x3c86ff, 0.6, 8);
    blueAccent.position.set(1.4, 1.5, 1.8);
    scene.add(blueAccent);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0);
    controls.enablePan = false;
    controls.enableZoom = false;
    controls.enableRotate = false;
    controls.update();

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    let currentVrm = null;
    let mouthValue = 0;
    let emotion = "neutral";
    let nodRequested = false;
    let nodTime = 0;

    const clock = new THREE.Clock();
    let blinkTimer = 0;
    let nextBlinkTime = 2 + Math.random() * 3;

    function makeMesh(geometry, color, roughness = 0.9, metalness = 0.05) {
      return new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
          color,
          roughness,
          metalness
        })
      );
    }

    function makeDesk(width, height, depth, color) {
      return makeMesh(new THREE.BoxGeometry(width, height, depth), color);
    }

    function makeLamp() {
      const group = new THREE.Group();

      const base = makeMesh(new THREE.CylinderGeometry(0.09, 0.11, 0.03, 24), 0x6c4b2e, 0.8);
      base.position.y = 0.015;
      group.add(base);

      const stem = makeMesh(new THREE.CylinderGeometry(0.018, 0.018, 0.38, 16), 0x8c6d4a, 0.7);
      stem.position.y = 0.21;
      group.add(stem);

      const shade = new THREE.Mesh(
        new THREE.ConeGeometry(0.16, 0.24, 24, 1, true),
        new THREE.MeshStandardMaterial({
          color: 0xf1d7a8,
          emissive: 0xffdca0,
          emissiveIntensity: 0.35,
          side: THREE.DoubleSide
        })
      );
      shade.position.y = 0.43;
      shade.rotation.x = Math.PI;
      group.add(shade);

      const bulb = new THREE.PointLight(0xffd38a, 1.7, 2.5);
      bulb.position.set(0, 0.46, 0);
      group.add(bulb);

      return group;
    }

    function makeBookshelf() {
      const group = new THREE.Group();
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x4f3a25, roughness: 0.95 });

      const side1 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.95, 0.28), frameMat);
      side1.position.set(-0.23, 0.48, 0);
      group.add(side1);

      const side2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.95, 0.28), frameMat);
      side2.position.set(0.23, 0.48, 0);
      group.add(side2);

      const top = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.06, 0.28), frameMat);
      top.position.set(0, 0.93, 0);
      group.add(top);

      const bottom = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.06, 0.28), frameMat);
      bottom.position.set(0, 0.03, 0);
      group.add(bottom);

      const shelf1 = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.04, 0.26), frameMat);
      shelf1.position.set(0, 0.33, 0);
      group.add(shelf1);

      const shelf2 = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.04, 0.26), frameMat);
      shelf2.position.set(0, 0.62, 0);
      group.add(shelf2);

      const colors = [0x8b3d3d, 0x355f8f, 0x5b8c4a, 0xc28a2b, 0x7b4fc0, 0x2d6fb2];

      for (let i = 0; i < 8; i++) {
        const book = new THREE.Mesh(
          new THREE.BoxGeometry(0.04, 0.16 + (i % 3) * 0.03, 0.18),
          new THREE.MeshStandardMaterial({ color: colors[i % colors.length] })
        );
        book.position.set(-0.17 + i * 0.05, 0.37 + (i % 2) * 0.02, 0.01);
        group.add(book);
      }

      for (let i = 0; i < 7; i++) {
        const book = new THREE.Mesh(
          new THREE.BoxGeometry(0.04, 0.14 + (i % 2) * 0.04, 0.18),
          new THREE.MeshStandardMaterial({ color: colors[(i + 2) % colors.length] })
        );
        book.position.set(-0.16 + i * 0.05, 0.67 + (i % 2) * 0.02, 0.01);
        group.add(book);
      }

      return group;
    }

    function makePicture() {
      const group = new THREE.Group();

      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(0.78, 0.52, 0.04),
        new THREE.MeshStandardMaterial({ color: 0x2b3e5b, roughness: 0.85 })
      );
      group.add(frame);

      const inner = new THREE.Mesh(
        new THREE.BoxGeometry(0.68, 0.42, 0.02),
        new THREE.MeshStandardMaterial({
          color: 0x6e8fb8,
          emissive: 0x1a3d66,
          emissiveIntensity: 0.2,
          roughness: 0.7
        })
      );
      inner.position.z = 0.02;
      group.add(inner);

      const moon = new THREE.Mesh(
        new THREE.SphereGeometry(0.06, 20, 20),
        new THREE.MeshStandardMaterial({
          color: 0xffe6b3,
          emissive: 0xffd27a,
          emissiveIntensity: 0.35
        })
      );
      moon.position.set(0.18, 0.1, 0.03);
      group.add(moon);

      return group;
    }

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(2.6, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a2436, roughness: 1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.52;
    scene.add(floor);

    const rug = new THREE.Mesh(
      new THREE.CircleGeometry(1.05, 64),
      new THREE.MeshStandardMaterial({ color: 0x2c4b73, roughness: 1 })
    );
    rug.rotation.x = -Math.PI / 2;
    rug.position.set(0, -0.51, 0.25);
    scene.add(rug);

    const rugInner = new THREE.Mesh(
      new THREE.CircleGeometry(0.72, 64),
      new THREE.MeshStandardMaterial({ color: 0x3b6a9e, roughness: 1 })
    );
    rugInner.rotation.x = -Math.PI / 2;
    rugInner.position.set(0, -0.505, 0.25);
    scene.add(rugInner);

    const deskFront = makeDesk(1.25, 0.16, 0.42, 0x3c2c1e);
    deskFront.position.set(0, 0.42, 0.62);
    scene.add(deskFront);

    const deskTop = makeDesk(1.25, 0.05, 0.42, 0x5a4029);
    deskTop.position.set(0, 0.52, 0.62);
    scene.add(deskTop);

    const deskLeftLeg = makeDesk(0.07, 0.75, 0.07, 0x2b2118);
    deskLeftLeg.position.set(-0.54, 0.18, 0.62);
    scene.add(deskLeftLeg);

    const deskRightLeg = makeDesk(0.07, 0.75, 0.07, 0x2b2118);
    deskRightLeg.position.set(0.54, 0.18, 0.62);
    scene.add(deskRightLeg);

    const deskBack = makeDesk(1.25, 0.18, 0.08, 0x2d2218);
    deskBack.position.set(0, 0.35, 0.42);
    scene.add(deskBack);

    const leftLampDesk = makeLamp();
    leftLampDesk.position.set(-1.15, 0.0, -0.9);
    leftLampDesk.scale.set(1.05, 1.05, 1.05);
    scene.add(leftLampDesk);

    const shelf = makeBookshelf();
    shelf.position.set(1.1, 0.48, -1.18);
    shelf.scale.set(1.2, 1.2, 1.2);
    scene.add(shelf);

    const picture = makePicture();
    picture.position.set(-0.15, 1.9, -1.35);
    scene.add(picture);

    async function checkSpeakingStatus() {
      try {
        const response = await fetch("https://nele-backend.onrender.com/status");
        const data = await response.json();

        mouthValue = Number(data.mouth || 0);
        emotion = data.emotion || "neutral";

        if (data.nod) {
          nodRequested = true;
          nodTime = 0;
        }
      } catch (error) {
        console.log("Brak połączenia z serwerem Nele.");
      }
    }

    setInterval(checkSpeakingStatus, 300);

    loader.load(
      "../assets/avatars/Nele.vrm",
      (gltf) => {
        const vrm = gltf.userData.vrm;

        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        currentVrm = vrm;
        VRMUtils.rotateVRM0(vrm);

        const leftUpperArm = currentVrm.humanoid?.getNormalizedBoneNode("leftUpperArm");
        const rightUpperArm = currentVrm.humanoid?.getNormalizedBoneNode("rightUpperArm");

        if (leftUpperArm) leftUpperArm.rotation.z = -1.05;
        if (rightUpperArm) rightUpperArm.rotation.z = 1.05;

        vrm.scene.position.set(0, -0.15, 0);
        vrm.scene.scale.set(1.28, 1.28, 1.28);

        scene.add(vrm.scene);

        const info = document.getElementById("info");
        info.innerText = "Nele ist bereit.";

        setTimeout(function () {
          info.classList.add("ready");
        }, 900);
      },
      (progress) => {
        console.log("Ładowanie Nele:", progress);
      },
      (error) => {
        console.error("Błąd ładowania VRM:", error);
        document.getElementById("info").innerText = "Błąd ładowania Nele.";
      }
    );

    function setBlink(value) {
      if (!currentVrm || !currentVrm.expressionManager) return;
      currentVrm.expressionManager.setValue("blink", value);
    }

    function setMouth(value) {
      if (!currentVrm || !currentVrm.expressionManager) return;
      currentVrm.expressionManager.setValue("aa", value);
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.elapsedTime;

      if (currentVrm) {
        currentVrm.update(delta);

        const breath = Math.sin(elapsed * 2) * 0.008;
        currentVrm.scene.position.y = -0.15 + breath;

        currentVrm.scene.rotation.y = Math.sin(elapsed * 0.7) * 0.02;

        setMouth(mouthValue);

        if (emotion === "happy") {
          currentVrm.expressionManager?.setValue("happy", 0.65);
        } else {
          currentVrm.expressionManager?.setValue("happy", 0);
        }

        const head = currentVrm.humanoid?.getNormalizedBoneNode("head");

        if (head && nodRequested) {
          nodTime += delta;
          const nodAngle = Math.sin(nodTime * 5) * 0.22;
          head.rotation.x = nodAngle;

          if (nodTime > 1.6) {
            nodRequested = false;
            nodTime = 0;
            head.rotation.x = 0;
          }
        } else if (head) {
          head.rotation.x *= 0.85;
        }

        blinkTimer += delta;

        if (blinkTimer > nextBlinkTime && blinkTimer < nextBlinkTime + 0.08) {
          setBlink(1);
        } else {
          setBlink(0);
        }

        if (blinkTimer > nextBlinkTime + 0.15) {
          blinkTimer = 0;
          nextBlinkTime = 2 + Math.random() * 4;
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
