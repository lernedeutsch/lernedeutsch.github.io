<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Nele 3D</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(39, 104, 180, 0.22),
          transparent 40%
        ),
        linear-gradient(
          180deg,
          #0b1d33 0%,
          #071525 100%
        );

      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;

      padding: 8px 12px;

      border:
        1px solid
        rgba(118, 177, 255, 0.18);

      border-radius: 10px;

      color: white;

      background:
        rgba(9, 25, 44, 0.78);

      box-shadow:
        0 8px 24px
        rgba(0, 0, 0, 0.24);

      backdrop-filter: blur(10px);

      font-size: 14px;

      transition:
        opacity 0.4s ease;
    }

    #info.ready {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <div id="info">
    Nele 3D wird geladen...
  </div>

  <script type="module">
    import * as THREE from "three";

    import {
      OrbitControls
    } from "three/addons/controls/OrbitControls.js";

    import {
      GLTFLoader
    } from "three/addons/loaders/GLTFLoader.js";

    import {
      VRMLoaderPlugin,
      VRMUtils
    } from "https://unpkg.com/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js";


    /* =========================================
       SCENA
    ========================================= */

    const scene =
      new THREE.Scene();

    scene.background = null;


    /* =========================================
       KAMERA
    ========================================= */

    const camera =
      new THREE.PerspectiveCamera(
        30,
        window.innerWidth /
          window.innerHeight,
        0.1,
        100
      );

    /*
    Kamera jest odsunięta.
    Dzięki temu Nele i biurko
    nie są zbyt duże.
    */

    camera.position.set(
      0,
      1.34,
      3.15
    );


    /* =========================================
       RENDERER
    ========================================= */

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

    renderer.setClearColor(
      0x000000,
      0
    );

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    document.body.appendChild(
      renderer.domElement
    );


    /* =========================================
       OŚWIETLENIE
    ========================================= */

    const keyLight =
      new THREE.DirectionalLight(
        0xffffff,
        2
      );

    keyLight.position.set(
      1.5,
      2.5,
      3
    );

    scene.add(
      keyLight
    );


    const fillLight =
      new THREE.DirectionalLight(
        0x9ec9ff,
        1
      );

    fillLight.position.set(
      -2,
      1.5,
      2
    );

    scene.add(
      fillLight
    );


    const ambientLight =
      new THREE.AmbientLight(
        0xffffff,
        1.15
      );

    scene.add(
      ambientLight
    );


    /* =========================================
       BIURKO
    ========================================= */

    const deskGroup =
      new THREE.Group();


    const deskTopMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x4a4f57,
        roughness: 0.62,
        metalness: 0.08
      });


    const deskFrontMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x343941,
        roughness: 0.75,
        metalness: 0.03
      });


    const deskLegMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x252a31,
        roughness: 0.8,
        metalness: 0.05
      });


    const deskTop =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          2.25,
          0.10,
          0.72
        ),
        deskTopMaterial
      );

    deskTop.position.set(
      0,
      0.86,
      0.82
    );

    deskGroup.add(
      deskTop
    );


    const deskFront =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          2.25,
          0.48,
          0.08
        ),
        deskFrontMaterial
      );

    deskFront.position.set(
      0,
      0.59,
      1.14
    );

    deskGroup.add(
      deskFront
    );


    const leftDeskLeg =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          0.11,
          0.72,
          0.11
        ),
        deskLegMaterial
      );

    leftDeskLeg.position.set(
      -0.98,
      0.43,
      0.82
    );

    deskGroup.add(
      leftDeskLeg
    );


    const rightDeskLeg =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          0.11,
          0.72,
          0.11
        ),
        deskLegMaterial
      );

    rightDeskLeg.position.set(
      0.98,
      0.43,
      0.82
    );

    deskGroup.add(
      rightDeskLeg
    );


    scene.add(
      deskGroup
    );


    /* =========================================
       USTAWIENIE KAMERY
    ========================================= */

    const controls =
      new OrbitControls(
        camera,
        renderer.domElement
      );

    controls.target.set(
      0,
      1.18,
      0
    );

    controls.enablePan = false;
    controls.enableZoom = false;
    controls.enableRotate = false;

    controls.update();


    /* =========================================
       ŁADOWANIE MODELU
    ========================================= */

    const loader =
      new GLTFLoader();

    loader.register(
      parser =>
        new VRMLoaderPlugin(
          parser
        )
    );


    let currentVrm = null;

    let mouthValue = 0;
    let emotion = "neutral";

    let nodRequested = false;
    let nodTime = 0;


    const clock =
      new THREE.Clock();


    let blinkTimer = 0;

    let nextBlinkTime =
      2 + Math.random() * 3;

       STATUS Z BACKENDU
    ========================================= */

      try {
        const response =
          await fetch(
            "https://nele-backend.onrender.com/status"
          );

        if (!response.ok) {
          throw new Error(
            "HTTP " +
            response.status
