<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Test: Nele VRM Load</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { width:100%; height:100%; margin:0; background:#071426; color:#dfeeff; font-family:Arial, sans-serif; }
    #info { position:absolute; left:12px; top:12px; padding:10px 14px; background:rgba(2,10,20,0.6); border:1px solid rgba(100,160,255,0.12); border-radius:10px; z-index:10; }
    #log { position: absolute; left:12px; bottom:12px; right:12px; max-height:160px; overflow:auto; background:rgba(0,0,0,0.45); padding:10px; border-radius:10px; font-size:13px; }
    canvas { display:block; width:100%; height:100%; }
    .error { color: #ff9b9b; }
    .ok { color: #9bffb7; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">Ładowanie Nele: <span id="status">start</span></div>
  <div id="log"></div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { VRMLoaderPlugin, VRMUtils } from "https://unpkg.com/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js";

    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    function log(msg, cls) {
      const p = document.createElement("div");
      if (cls) p.className = cls;
      p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.appendChild(p);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.4, 3);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1.8);
    light.position.set(1,2,3);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    // Loading manager for better diagnostics
    const manager = new THREE.LoadingManager();
    manager.onStart = (url, itemsLoaded, itemsTotal) => {
      statusEl.textContent = 'started';
      log(`Start loading: ${url} (${itemsLoaded}/${itemsTotal})`);
    };
    manager.onProgress = (url, itemsLoaded, itemsTotal) => {
      statusEl.textContent = `loading ${itemsLoaded}/${itemsTotal}`;
      log(`Progress: ${url} (${itemsLoaded}/${itemsTotal})`);
    };
    manager.onLoad = () => {
      statusEl.textContent = 'all loaded';
      log('All loading finished', 'ok');
    };
    manager.onError = (url) => {
      statusEl.textContent = 'error';
      log(`Manager error loading: ${url}`, 'error');
    };

    const loader = new GLTFLoader(manager);
    loader.register(parser => new VRMLoaderPlugin(parser));

    // Ścieżka, którą pokazuje struktura repo:
    const modelPath = "../assets/avatars/Nele.vrm";

    // Wyraźne sprawdzenie dostępności pliku przez fetch - szybko pokaże 404/CORS
    (async () => {
      try {
        log(`Sprawdzam dostępność pliku: ${modelPath}`);
        const resp = await fetch(modelPath, { method: 'HEAD' });
        if (!resp.ok) {
          statusEl.textContent = 'file not found';
          log(`Plik niedostępny: ${resp.status} ${resp.statusText}`, 'error');
          log('Upewnij się, że plik znajduje się dokładnie w assets/avatars/Nele.vrm oraz że nazwa i wielkość liter są zgodne.');
          return;
        } else {
          log(`Plik dostępny: ${resp.status} ${resp.statusText}`, 'ok');
        }
      } catch (err) {
        statusEl.textContent = 'network error';
        log(`Błąd fetch: ${err.message}`, 'error');
        log('Możliwy problem CORS lub brak połączenia. Sprawdź konsolę sieciową (Network) przeglądarki.');
        return;
      }

      // Jeśli HEAD powiedział OK — próbujemy załadować przez GLTFLoader
      statusEl.textContent = 'loading model';
      loader.load(
        modelPath,
        (gltf) => {
          try {
            const vrm = gltf.userData.vrm;
            if (!vrm) {
              statusEl.textContent = 'no vrm in gltf';
              log('Załadowano plik, ale userData.vrm jest puste — możliwa niekompatybilność VRM/loadera', 'error');
              log('Sprawdź wersję three-vrm i format pliku (VRM0 vs VRM1).');
              return;
            }
            VRMUtils.removeUnnecessaryVertices(gltf.scene);
            VRMUtils.removeUnnecessaryJoints(gltf.scene);

            // opcjonalnie: nie obracamy automatycznie tu - zostawimy naturalne ustawienie
            // VRMUtils.rotateVRM0(vrm);

            scene.add(vrm.scene);
            statusEl.textContent = 'model ready';
            log('VRM załadowany poprawnie', 'ok');

            // Mały obrót, żeby przetestować widok
            vrm.scene.position.set(0, -0.25, 0);
            vrm.scene.scale.set(1.1,1.1,1.1);
          } catch (err) {
            statusEl.textContent = 'post-process error';
            log(`Błąd przetwarzania VRM: ${err.message}`, 'error');
            console.error(err);
          }
        },
        (progress) => {
          if (progress.lengthComputable) {
            const pct = ((progress.loaded / progress.total) * 100).toFixed(1);
            statusEl.textContent = `loading ${pct}%`;
            log(`Model loading: ${pct}%`);
          } else {
            log(`Model loading: ${progress.loaded} bytes`);
          }
        },
        (error) => {
          statusEl.textContent = 'load error';
          log('Błąd loadera (GLTFLoader): ' + (error && error.message ? error.message : JSON.stringify(error)), 'error');
          console.error('GLTFLoader error object:', error);
          // pokaż hinty:
          log('Możliwe przyczyny: 404 (zła ścieżka), CORS (zdalny serwer), niezgodny format pliku, lub błędy parsowania.', 'error');
        }
      );
    })();

    // prosty render loop, nawet bez modelu
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
