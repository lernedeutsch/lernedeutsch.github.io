<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG Portrait</title>
  <style>
    :root{
      --bg1:#f7e8df;
      --bg2:#f0d8cc;
      --skin:#f2c6a8;
      --skin-shadow:#e6ad8b;
      --skin-light:#ffd9bf;
      --hair:#7a4b2e;
      --hair-dark:#5c341f;
      --hair-light:#9a6240;
      --shirt:#f3f5ff;
      --shirt-shadow:#c9d4ff;
      --shirt-accent:#6f7ad8;
      --shirt-accent-soft:#a1b0ff;
      --eye:#4a2f22;
      --lip:#d66b76;
      --lip-dark:#b2505a;
      --blush:#e8a6a0;
      --glasses:#2f2a3a;
      --earring:#f4c64f;
      --necklace:#f4c64f;
      --nail:#d86c7c;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .wrap {
      width: min(420px, 92vw);
      aspect-ratio: 1 / 1.25;
      filter: drop-shadow(0 18px 35px rgba(0,0,0,.12));
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .breathe {
      transform-origin: center;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5s infinite;
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.12); }
      96% { transform: scaleY(1); }
    }

    .hair-sheen {
      opacity: .35;
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" aria-label="Portret kobiety">
      <defs>
        <radialGradient id="faceGrad" cx="45%" cy="30%" r="70%">
          <stop offset="0%" stop-color="var(--skin-light)"/>
          <stop offset="62%" stop-color="var(--skin)"/>
          <stop offset="100%" stop-color="var(--skin-shadow)"/>
        </radialGradient>

        earGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--hair-light)"/>
          <stop offset="45%" stop-color="var(--hair)"/>
          <stop offset="100%" stop-color="var(--hair-dark)"/>
        </linearGradient>

        earGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--shirt)"/>
          <stop offset="100%" stop-color="var(--shirt-shadow)"/>
        </linearGradient>

        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
          <feOffset dy="4" result="offsetblur"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.25"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <rect width="400" height="500" fill="transparent"/>

      <g class="breathe" filter="url(#softShadow)">
        <!-- Hair back -->
        <path d="M96 184
                 C92 118, 138 70, 200 70
                 C266 70, 310 116, 307 186
                 C332 198, 342 223, 337 250
                 C332 281, 312 306, 298 327
                 C286 344, 280 359, 273 387
                 C267 415, 237 426, 200 426
                 C163 426, 133 415, 127 387
                 C120 359, 114 344, 102 327
                 C88 306, 68 281, 63 250
                 C58 223, 68 198, 96 184 Z"
              fill="url(#hairGrad)"/>

        <!-- Arms / shoulders (blouse silhouette) -->
        <path d="M70 500
                 C80 432, 111 382, 156 360
                 C170 353, 183 352, 200 352
                 C217 352, 230 353, 244 360
                 C289 382, 320 432, 330 500 Z"
              fill="url(#shirtGrad)"/>

        <!-- Right arm (our left) -->
        <path d="M78 500
                 C82 452, 96 422, 118 402
                 C130 392, 144 386, 160 383
                 C158 404, 155 426, 151 446
                 C148 460, 142 474, 134 486
                 C126 496, 110 502, 96 500 Z"
              fill="url(#faceGrad)" opacity="0.96"/>

        <!-- Left arm (our right) -->
        <path d="M322 500
                 C318 452, 304 422, 282 402
                 C270 392, 256 386, 240 383
                 C242 404, 245 426, 249 446
                 C252 460, 258 474, 266 486
                 C274 496, 290 502, 304 500 Z"
              fill="url(#faceGrad)" opacity="0.96"/>

        <!-- Hands hints -->
        <path d="M132 478
                 C138 487, 145 493, 154 496"
              stroke="var(--nail)" stroke-width="3" stroke-linecap="round"/>
        <path d="M268 478
                 C262 487, 255 493, 246 496"
              stroke="var(--nail)" stroke-width="3" stroke-linecap="round"/>

        <!-- Shirt (torso) with V cutout -->
        <path d="M110 500
                 C118 430, 146 385, 186 362
                 C190 376, 194 387, 198 395
                 C201 400, 206 405, 212 408
                 C234 386, 252 378, 254 362
                 C294 385, 322 430, 290 500 Z"
              fill="url(#shirtGrad)"/>

        <!-- V-neck opening (cut-out showing skin) -->
        <path d="M158 360
                 C170 390, 182 405, 200 410
                 C218 405, 230 390, 242 360
                 L200 338 Z"
              fill="url(#faceGrad)" opacity="0.9"/>

        <!-- V-neck border -->
        <path d="M158 360
                 C170 390, 182 405, 200 410
                 C218 405, 230 390, 242 360"
              fill="none" stroke="var(--shirt-accent)" stroke-width="4" stroke-linecap="round"/>

        <!-- Decorative stripe on blouse -->
        <path d="M130 412
                 C156 432, 176 440, 200 440
                 C224 440, 244 432, 270 412"
              fill="none" stroke="var(--shirt-accent-soft)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

        <!-- Simple blouse pattern (soft dots) -->
        <g fill="var(--shirt-accent-soft)" opacity="0.65">
          ircle cx="155" cy="424" r="2.1"/>
          ircle cx="180" cy="433" r="2.1"/>
          ircle cx="205" cy="429" r="2.1"/>
          ircle cx="230" cy="436" r="2.1"/>
          ircle cx="250" cy="421" r="2.1"/>
        </g>

        <!-- Neck (extended to connect) -->
        <path d="M176 288
                 C180 305, 182 318, 182 335
                 C182 347, 188 353, 200 353
                 C212 353, 218 347, 218 335
                 C218 318, 220 305, 224 288 Z"
              fill="url(#faceGrad)"/>

        <!-- Face -->
        <ellipse cx="200" cy="215" rx="78" ry="92" fill="url(#faceGrad)"/>

        <!-- Hair front left -->
        <path d="M128 198
                 C118 164, 131 123, 162 103
                 C172 96, 182 93, 193 92
                 C162 108, 151 138, 154 170
                 C155 189, 150 208, 140 224
                 C136 216, 132 207, 128 198 Z"
              fill="url(#hairGrad)"/>
        <!-- Hair front right -->
        <path d="M272 197
                 C282 163, 270 123, 239 103
                 C229 96, 219 93, 208 92
                 C239 108, 250 138, 247 170
                 C246 189, 251 208, 261 224
                 C265 216, 269 207, 272 197 Z"
              fill="url(#hairGrad)"/>

        <!-- Hair lower waves -->
        <path d="M112 205
                 C90 228, 84 270, 101 303
                 C114 329, 141 349, 155 360
                 C142 326, 140 292, 147 263
                 C153 238, 155 217, 145 197
                 C133 191, 121 194, 112 205 Z"
              fill="url(#hairGrad)"/>
        <path d="M288 205
                 C310 228, 316 270, 299 303
                 C286 329, 259 349, 245 360
                 C258 326, 260 292, 253 263
                 C247 238, 245 217, 255 197
                 C267 191, 279 194, 288 205 Z"
              fill="url(#hairGrad)"/>

        <!-- Sheen -->
        <path class="hair-sheen" d="M143 117
                 C166 100, 187 94, 202 94
                 C179 107, 168 132, 168 158
                 C168 174, 163 190, 154 205
                 C146 186, 141 171, 140 154
                 C138 139, 139 127, 143 117 Z"
              fill="#d79a6c"/>

        <!-- Ears -->
        <ellipse cx="123" cy="223" rx="11" ry="18" fill="url(#faceGrad)"/>
        <ellipse cx="277" cy="223" rx="11" ry="18" fill="url(#faceGrad)"/>

        <!-- Brows (more "happy" curve, still thin) -->
        <path d="M158 179
                 C169 170, 180 168, 192 172"
              stroke="var(--hair-dark)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95"/>
        <path d="M208 172
                 C220 168, 231 170, 242 179"
              stroke="var(--hair-dark)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95"/>

        <!-- Subtle forehead smile-curve -->
        <path d="M164 168
                 C182 160, 218 160, 236 168"
              stroke="rgba(122,75,46,0.18)" stroke-width="3"
              stroke-linecap="round" fill="none"/>

        <!-- Modern glasses -->
        <g>
          <!-- left frame -->
          <path d="M148 198
                   C158 188, 178 188, 188 198
                   C180 206, 174 210, 168 210
                   C160 210, 154 206, 148 198 Z"
                fill="rgba(255,255,255,0.15)"
                stroke="var(--glasses)" stroke-width="3" stroke-linejoin="round"/>
          <!-- right frame -->
          <path d="M212 198
                   C222 188, 242 188, 252 198
                   C244 206, 238 210, 232 210
                   C224 210, 218 206, 212 198 Z"
                fill="rgba(255,255,255,0.15)"
                stroke="var(--glasses)" stroke-width="3" stroke-linejoin="round"/>
          <!-- bridge -->
          <path d="M188 200 C194 196, 206 196, 212 200"
                stroke="var(--glasses)" stroke-width="3" stroke-linecap="round" fill="none"/>
          <!-- temples -->
          <path d="M148 198 C140 194, 134 194, 128 198"
                stroke="var(--glasses)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M252 198 C260 194, 266 194, 272 198"
                stroke="var(--glasses)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </g>

        <!-- Eyes with lashes -->
        <g class="blink">
          <!-- whites -->
          <ellipse cx="176" cy="205" rx="9" ry="6.5" fill="#fff"/>
          <ellipse cx="224" cy="205" rx="9" ry="6.5" fill="#fff"/>
          <!-- iris -->
          ircle cx="176" cy="206" r="4.4" fill="var(--eye)"/>
          ircle cx="224" cy="206" r="4.4" fill="var(--eye)"/>
          <!-- highlights -->
          ircle cx="177.3" cy="204" r="1.1" fill="#fff"/>
          ircle cx="225.3" cy="204" r="1.1" fill="#fff"/>
          <!-- Eyeliner -->
          <path d="M166 202
                   C171 199, 181 199, 186 202"
                stroke="#3b2620" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <path d="M214 202
                   C219 199, 229 199, 234 202"
                stroke="#3b2620" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <!-- Eyelashes left -->
          <path d="M168 199 L163 195" stroke="#3b2620" stroke-width="2" stroke-linecap="round"/>
          <path d="M172 198 L168 193" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M180 198 L181 193" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>
          <!-- Eyelashes right -->
          <path d="M232 199 L237 195" stroke="#3b2620" stroke-width="2" stroke-linecap="round"/>
          <path d="M228 198 L232 193" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M220 198 L219 193" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>
        </g>

        <!-- Nose -->
        <path d="M199 208
                 C196 220, 194 228, 190 234"
              stroke="#cb9478" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M190 236 C195 240, 205 240, 210 236"
              stroke="#cb9478" stroke-width="3" stroke-linecap="round" fill="none"/>

        <!-- Softer, smaller smile (bez zmian – już delikatny) -->
        <path d="M182 259
                 C188 266, 195 269, 200 269
                 C205 269, 212 266, 218 259"
              fill="none" stroke="var(--lip-dark)" stroke-width="2.4"
              stroke-linecap="round"/>
        <path d="M184 258
                 C189 253, 194 251, 200 251
                 C206 251, 211 253, 216 258
                 C212 264, 206 267, 200 267
                 C194 267, 188 264, 184 258 Z"
              fill="var(--lip)"/>
        <!-- gloss -->
        <path d="M189 262
                 C193 263, 197 264, 201 264"
              stroke="#ffd5d9" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>

        <!-- Smile lines on cheeks -->
        <path d="M162 252
                 C158 254, 156 256, 154 259"
              stroke="rgba(203,148,120,0.8)" stroke-width="2"
              stroke-linecap="round" fill="none"/>
        <path d="M238 252
                 C242 254, 244 256, 246 259"
              stroke="rgba(203,148,120,0.8)" stroke-width="2"
              stroke-linecap="round" fill="none"/>

        <!-- Cheek blush -->
        <ellipse cx="152" cy="243" rx="16" ry="10" fill="var(--blush)" opacity=".26"/>
        <ellipse cx="248" cy="243" rx="16" ry="10" fill="var(--blush)" opacity=".26"/>

        <!-- Face highlight -->
        <ellipse cx="184" cy="186" rx="22" ry="31" fill="#fff7ef" opacity=".20"/>

        <!-- Necklace (lower) -->
        <path d="M156 324
                 C172 344, 186 352, 200 352
                 C214 352, 228 344, 244 324"
              stroke="var(--necklace)" stroke-width="4" stroke-linecap="round" fill="none"/>
        ircle cx="200" cy="356" r="7" fill="var(--necklace)" opacity="0.96"/>
        ircle cx="200" cy="356" r="4" fill="#fff9e6" opacity="0.9"/>

        <!-- Earrings with white inner circles -->
        <g>
          <!-- left -->
          ircle cx="123" cy="236" r="3" fill="var(--earring)"/>
          <path d="M123 239
                   C123 246, 123 252, 123 258"
                stroke="var(--earring)" stroke-width="3" stroke-linecap="round"/>
          ircle cx="123" cy="262" r="5.2" fill="var(--earring)"/>
          ircle cx="123" cy="262" r="3" fill="#fff9e6"/>
          <!-- right -->
          ircle cx="277" cy="236" r="3" fill="var(--earring)"/>
          <path d="M277 239
                   C277 246, 277 252, 277 258"
                stroke="var(--earring)" stroke-width="3" stroke-linecap="round"/>
          ircle cx="277" cy="262" r="5.2" fill="var(--earring)"/>
          ircle cx="277" cy="262" r="3" fill="#fff9e6"/>
        </g>
      </g>
    </svg>
  </div>

  <script>
    const svg = document.querySelector('svg');
    svg.addEventListener('mousemove', (e) => {
      const r = svg.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      const group = document.querySelector('.breathe');
      group.style.transform = `translate(${x * 8}px, ${y * 8}px)`;
    });

    svg.addEventListener('mouseleave', () => {
      document.querySelector('.breathe').style.transform = 'translate(0px, 0px)';
    });
  </script>
</body>
</html>
