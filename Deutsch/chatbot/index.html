<div class="chatbot">
  <div id="chat-log"></div>
  <input id="chat-input" type="text" placeholder="Schreibe hier auf Deutsch..." />
  <button id="chat-send">Senden</button>
</div>

<script src="../chatbot/parser.js"></script>
<script src="../chatbot/scorer.js"></script>
<script src="../chatbot/memory.js"></script>
<script src="../chatbot/prompt-builder.js"></script>
<script src="../chatbot/tutor-ai.js"></script>
<script src="../chatbot/lessons-mod.js"></script>
<script src="../chatbot/engine.js"></script>
<script src="../chatbot/prompts/prompts.js"></script>
<script>
  const log = document.getElementById("chat-log");
  const input = document.getElementById("chat-input");
  const send = document.getElementById("chat-send");

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    log.appendChild(div);
  }

  addMessage(getPrompt("greeting"), "bot");

  send.addEventListener("click", () => {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");

    const lessonContext = getLessonContext("A1-1"); // przykład
    const reply = processUserMessage(text, lessonContext);

    addMessage(reply, "bot");
    input.value = "";
  });
</script>
