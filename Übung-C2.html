<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite im Aufbau</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        img {
            max-width: 90%;
            height: auto;
        }

        p {
            margin-top: 20px;
            font-size: 20px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="ARBEIT.png" alt="Seite im Aufbau">
        <p>Diese Seite befindet sich derzeit im Aufbau.</p>
        <p>Bitte schauen Sie später noch einmal vorbei.</p>
    </div>

</body>
</html>
