name: Site and Nele smoke tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check key files and wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f mapa-niemiec.html
          test -f nele.html
          test -f config/app-config.js
          grep -q 'https://lernedeutsch.github.io/nele.html' mapa-niemiec.html
          ! grep -q 'nele2-backend.onrender.com' nele.html
          ! grep -q 'nele2-backend.onrender.com' config/app-config.js
          ! grep -q 'nele-backend-3.onrender.com' nele.html
          ! grep -q 'nele-backend-3.onrender.com' config/app-config.js

      - name: Check public pages
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-delay 10 https://lernedeutsch.github.io/ -o /tmp/index.html
          curl --fail --silent --show-error --location --retry 4 --retry-delay 10 https://lernedeutsch.github.io/mapa-niemiec.html -o /tmp/map.html
          curl --fail --silent --show-error --location --retry 4 --retry-delay 10 https://lernedeutsch.github.io/nele.html -o /tmp/nele.html
          grep -q '<title>Nele</title>' /tmp/nele.html
          ! grep -q 'nele2-backend.onrender.com' /tmp/nele.html
