<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch Lernen Bot</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
        #status { color: #666; margin-bottom: 20px; font-style: italic; }
        .btn { background: #28a745; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 30px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #218838; }
        #output { margin-top: 20px; text-align: left; max-height: 200px; overflow-y: auto; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Deutsch Lernen Bot 🇩🇪</h2>
    <p id="status">Klicke na przycisk i zacznij mówić po niemiecku...</p>
    <button class="btn" id="start-btn">Mikrofon einschalten</button>
    <div id="output"></div>
</div>

<script>
    const startBtn = document.getElementById('start-btn');
    const statusText = document.getElementById('status');
    const outputDiv = document.getElementById('output');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        statusText.innerText = "Twoja przeglądarka nie wspiera rozpoznawania mowy. Użyj Chrome lub Edge.";
        startBtn.disabled = true;
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'de-DE'; // Słuchanie po niemiecku
        recognition.interimResults = false;

        function powiedz(tekst) {
            const tekstDoPowiedzenia = new SpeechSynthesisUtterance(tekst);
            tekstDoPowiedzenia.lang = 'de-DE'; // Mówienie po niemiecku
            window.speechSynthesis.speak(tekstDoPowiedzenia);
            dodajLog("Bot", tekst);
        }

        startBtn.addEventListener('click', () => {
            recognition.start();
            statusText.innerText = "Ich höre zu... (Słucham...)";
            startBtn.disabled = true;
        });

        recognition.onresult = (event) => {
            const wynik = event.results[0][0].transcript;
            dodajLog("Du", wynik);
            odpowiedzBot(wynik.toLowerCase());
        };

        recognition.onend = () => {
            statusText.innerText = "Klicke na przycisk i zacznij mówić...";
            startBtn.disabled = false;
        };

      function odpowiedzBot(wypowiedz) {
    // 1. Powitania
    if (wypowiedz.includes("hallo") || wypowiedz.includes("guten tag") || wypowiedz.includes("hi")) {
        powiedz("Hallo! Es freut mich sehr, dich zu hören. Wie kann ich dir heute beim Deutschlernen helfen? Möchtest du über das Wetter oder deine Hobbys sprechen?");
    } 
    // 2. Samopoczucie
    else if (wypowiedz.includes("wie geht es dir") || wypowiedz.includes("wie geht's")) {
        powiedz("Mir geht es fantastisch, danke der Nachfrage! Ich bin bereit, Deutsch mit dir zu üben. Und wie geht es dir heute? Bist du müde oder hast du gute Laune?");
    } 
    // 3. Tożsamość bota
    else if (wypowiedz.includes("wie heißt du") || wypowiedz.includes("wer bist du")) {
        powiedz("Ich bin dein persönlicher Sprachassistent. Mein Name ist Nele. Ich liebe es, Grammatik und Vokabeln zu üben!");
    } 
    // 4. Pochwały i pozytywne odpowiedzi
    else if (wypowiedz.includes("gut") || wypowiedz.includes("super") || wypowiedz.includes("toll")) {
        powiedz("Das ist wunderbar! Wenn es dir gut geht, lernt es sich viel leichter. Erzähl mir mehr: Was hast du heute Schönes gemacht?");
    } 
    // 5. Temat: Pogoda (Wetter)
    else if (wypowiedz.includes("wetter") || wypowiedz.includes("sonne") || wypowiedz.includes("regen")) {
        powiedz("Das Wetter ist immer ein gutes Thema! Bei mir im Computer scheint immer die Sonne. Wie ist das Wetter heute bei dir? Ist es warm oder regnet es?");
    }
    // 6. Temat: Jedzenie (Essen)
    else if (wypowiedz.includes("essen") || wypowiedz.includes("hunger") || wypowiedz.includes("pizza")) {
        powiedz("Oh, Essen ist ein tolles Thema! Ich kann leider nichts essen, aber ich weiß, dass Pizza und Pommes sehr beliebt sind. Was ist dein Lieblingsessen?");
    }
    // 7. Temat: Hobby i wolny czas
    else if (wypowiedz.includes("hobby") || wypowiedz.includes("musik") || wypowiedz.includes("sport")) {
        powiedz("In meiner Freizeit lese ich gerne das Wörterbuch! Und was machst du in deiner Freizeit? Hörst du gerne Musik oder treibst du Sport?");
    }
    // 8. Gdy użytkownik mówi, że nie rozumie
    else if (wypowiedz.includes("nicht verstehen") || wypowiedz.includes("keine ahnung")) {
        powiedz("Kein Problem! Deutsch ist nicht einfach. Sag einfach 'Hallo' oder 'Wie geht es dir', um das Gespräch noch einmal neu zu starten.");
    }
    // 9. Dłuższa odpowiedź domyślna (awaryjna)
    else {
        powiedz("Das ist interessant, aber ich habe dich nicht ganz verstanden. Kannst du das anders sagen?"); 
            }
}


Odpowiedz
        function dodajLog(kto, tekst) {
            const p = document.createElement('p');
            p.innerHTML = `<strong>${kto}:</strong> ${tekst}`;
            outputDiv.appendChild(p);
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }
    }
</script>

</body>
</html>
