<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG Portrait</title>
  <style>
    :root{
      --bg1:#f7e8df;
      --bg2:#f0d8cc;
      --skin:#e6bb9d;        /* jeszcze jaśniejszy */
      --skin-shadow:#cf997a; /* jeszcze jaśniejszy */
      --skin-light:#f8ece1;  /* jeszcze jaśniejszy */
      --hair:#7a4b2e;
      --hair-dark:#5c341f;
      --hair-light:#9a6240;
      --shirt:#ffffff;
      --shirt-shadow:#e9e9e9;
      --eye:#4a2f22;
      --lip:#d68b7d;
      --outline:rgba(0,0,0,.08);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .wrap {
      width: min(420px, 92vw);
      aspect-ratio: 1 / 1.25;
      filter: drop-shadow(0 18px 35px rgba(0,0,0,.12));
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .breathe {
      transform-origin: center;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5s infinite;
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.12); }
      96% { transform: scaleY(1); }
    }

    .hair-sheen {
      opacity: .35;
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" aria-label="Portret kobiety">
      <defs>
        <radialGradient id="faceGrad" cx="45%" cy="30%" r="70%">
          <stop offset="0%" stop-color="var(--skin-light)"/>
          <stop offset="62%" stop-color="var(--skin)"/>
          <stop offset="100%" stop-color="var(--skin-shadow)"/>
        </radialGradient>

        <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--hair-light)"/>
          <stop offset="45%" stop-color="var(--hair)"/>
          <stop offset="100%" stop-color="var(--hair-dark)"/>
        </linearGradient>

        <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="var(--shirt-shadow)"/>
        </linearGradient>

        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
          <feOffset dy="4" result="offsetblur"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.25"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <rect width="400" height="500" fill="transparent"/>

      <g class="breathe" filter="url(#softShadow)">
        <!-- Hair back -->
        <path d="M96 184
                 C92 118, 138 70, 200 70
                 C266 70, 310 116, 307 186
                 C332 198, 342 223, 337 250
                 C332 281, 312 306, 298 327
                 C286 344, 280 359, 273 387
                 C267 415, 237 426, 200 426
                 C163 426, 133 415, 127 387
                 C120 359, 114 344, 102 327
                 C88 306, 68 281, 63 250
                 C58 223, 68 198, 96 184 Z"
              fill="url(#hairGrad)"/>

        <!-- Neck -->
        <path d="M177 288
                 C181 307, 184 323, 182 337
                 C192 346, 209 346, 219 337
                 C217 323, 220 307, 224 288 Z"
              fill="url(#faceGrad)"/>

        <!-- Shirt -->
        <path d="M110 500
                 C118 430, 146 385, 186 362
                 C192 379, 208 379, 214 362
                 C254 385, 282 430, 290 500 Z"
              fill="url(#shirtGrad)"/>

        <path d="M140 392
                 C158 406, 184 414, 200 414
                 C216 414, 242 406, 260 392"
              fill="none" stroke="#ececec" stroke-width="6" stroke-linecap="round"/>

        <!-- Face (smuklejsza: jeszcze mniejszy rx, jeszcze większy ry) -->
        <ellipse cx="200" cy="215" rx="62" ry="106" fill="url(#faceGrad)"/>

        <!-- Hair front left -->
        <path d="M128 198
                 C118 164, 131 123, 162 103
                 C172 96, 182 93, 193 92
                 C162 108, 151 138, 154 170
                 C155 189, 150 208, 140 224
                 C136 216, 132 207, 128 198 Z"
              fill="url(#hairGrad)"/>
        <!-- Hair front right -->
        <path d="M272 197
                 C282 163, 270 123, 239 103
                 C229 96, 219 93, 208 92
                 C239 108, 250 138, 247 170
                 C246 189, 251 208, 261 224
                 C265 216, 269 207, 272 197 Z"
              fill="url(#hairGrad)"/>

        <!-- Hair lower waves -->
        <path d="M112 205
                 C90 228, 84 270, 101 303
                 C114 329, 141 349, 155 360
                 C142 326, 140 292, 147 263
                 C153 238, 155 217, 145 197
                 C133 191, 121 194, 112 205 Z"
              fill="url(#hairGrad)"/>
        <path d="M288 205
                 C310 228, 316 270, 299 303
                 C286 329, 259 349, 245 360
                 C258 326, 260 292, 253 263
                 C247 238, 245 217, 255 197
                 C267 191, 279 194, 288 205 Z"
              fill="url(#hairGrad)"/>

        <!-- Modna, kobieca grzywka (falowana, sięgająca tuż nad oczy) -->
        <path d="M158 100
                 C162 86, 170 78, 180 76
                 C182 88, 181 98, 178 108
                 C173 110, 168 109, 162 106
                 C160 102, 159 101, 158 100 Z"
              fill="url(#hairGrad)"/>
        <path d="M180 76
                 C190 74, 197 76, 203 80
                 C203 92, 201 100, 198 108
                 C193 108, 188 106, 184 102
                 C182 96, 181 90, 180 76 Z"
              fill="url(#hairGrad)"/>
        <path d="M203 80
                 C210 78, 218 78, 225 80
                 C228 90, 229 98, 228 106
                 C223 108, 218 107, 213 104
                 C210 100, 206 94, 203 80 Z"
              fill="url(#hairGrad)"/>
        <path d="M225 80
                 C232 82, 238 88, 242 94
                 C243 102, 242 108, 240 114
                 C234 114, 230 112, 227 108
                 C225 104, 224 98, 225 80 Z"
              fill="url(#hairGrad)"/>
        <path d="M242 94
                 C248 98, 252 104, 254 110
                 C258 114, 260 116, 262 116
                 C258 118, 253 117, 249 114
                 C246 110, 244 104, 242 94 Z"
              fill="url(#hairGrad)"/>

        <!-- Jasne pasemka w włosach (kilka smug) -->
        <g class="hair-sheen" fill="#d79a6c">
          <path d="M148 120 C156 110, 166 104, 176 102" stroke="#d79a6c" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M200 92 C210 96, 218 102, 224 110" stroke="#d79a6c" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M252 120 C244 130, 236 138, 228 144" stroke="#d79a6c" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M138 150 C146 156, 154 161, 162 165" stroke="#d79a6c" stroke-width="2.0" stroke-linecap="round"/>
          <path d="M260 150 C252 156, 244 161, 236 165" stroke="#d79a6c" stroke-width="2.0" stroke-linecap="round"/>
        </g>

        <!-- Sheen -->
        <path class="hair-sheen" d="M143 117
                 C166 100, 187 94, 202 94
                 C179 107, 168 132, 168 158
                 C168 174, 163 190, 154 205
                 C146 186, 141 171, 140 154
                 C138 139, 139 127, 143 117 Z"
              fill="#d79a6c"/>

        <!-- Ears -->
        <ellipse cx="123" cy="223" rx="11" ry="18" fill="url(#faceGrad)"/>
        <ellipse cx="277" cy="223" rx="11" ry="18" fill="url(#faceGrad)"/>

        <!-- Brows -->
        <path d="M160 180 C171 172, 182 170, 192 173"
              stroke="var(--hair-dark)" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M208 173 C218 170, 229 172, 240 180"
              stroke="var(--hair-dark)" stroke-width="6" stroke-linecap="round" fill="none"/>

        <!-- Eyes with lashes -->
        <g class="blink">
          <!-- whites -->
          <ellipse cx="176" cy="205" rx="11" ry="8" fill="#fff"/>
          <ellipse cx="224" cy="205" rx="11" ry="8" fill="#fff"/>
          <!-- iris -->
          <circle cx="176" cy="206" r="4.7" fill="var(--eye)"/>
          <circle cx="224" cy="206" r="4.7" fill="var(--eye)"/>
          <!-- highlights -->
          <circle cx="177.5" cy="204" r="1.3" fill="#fff"/>
          <circle cx="225.5" cy="204" r="1.3" fill="#fff"/>

          <!-- Eyelashes left -->
          <path d="M168 200 L163 195" stroke="#3b2620" stroke-width="2" stroke-linecap="round"/>
          <path d="M172 199 L168 194" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M180 199 L181 194" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>

          <!-- Eyelashes right -->
          <path d="M232 200 L237 195" stroke="#3b2620" stroke-width="2" stroke-linecap="round"/>
          <path d="M228 199 L232 194" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M220 199 L219 194" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>
        </g>

        <!-- Nose -->
        <path d="M199 208
                 C196 220, 194 228, 190 234"
              stroke="#cb9478" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M190 236 C195 240, 205 240, 210 236"
              stroke="#cb9478" stroke-width="3" stroke-linecap="round" fill="none"/>

        <!-- Lips -->
        <path d="M180 259
                 C188 254, 194 252, 200 252
                 C206 252, 212 254, 220 259
                 C213 266, 207 268, 200 268
                 C193 268, 187 266, 180 259 Z"
              fill="var(--lip)"/>
        <path d="M184 260 C191 262, 195 263, 200 263 C205 263, 209 262, 216 260"
              stroke="#c97c72" stroke-width="2" stroke-linecap="round" fill="none"/>

        <!-- Cheek blush -->
        <ellipse cx="152" cy="243" rx="15" ry="10" fill="#e8a6a0" opacity=".22"/>
        <ellipse cx="248" cy="243" rx="15" ry="10" fill="#e8a6a0" opacity=".22"/>

        <!-- Face highlight -->
        <ellipse cx="184" cy="186" rx="22" ry="31" fill="#fff7ef" opacity=".20"/>
      </g>
    </svg>
  </div>

  <script>
    const svg = document.querySelector('svg');
    svg.addEventListener('mousemove', (e) => {
      const r = svg.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      const hair = document.querySelector('.breathe');
      hair.style.transform = `translate(${x * 8}px, ${y * 8}px)`;
    });

    svg.addEventListener('mouseleave', () => {
      document.querySelector('.breathe').style.transform = 'translate(0px, 0px)';
    });
  </script>
</body>
</html>
