<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG Portrait</title>
  <style>
    :root{
      --bg1:#f7e8df;
      --bg2:#f0d8cc;

      /* kolory skóry bardziej zbliżone do obrazka */
      --skin:#eec2a3;
      --skin-shadow:#d39a78;
      --skin-light:#fff0e4;

      /* włosy jak na obrazku: długie, brązowe, lekko falowane */
      --hair:#6c4228;
      --hair-dark:#4f2f1e;
      --hair-light:#8a5636;

      /* biała koszulka jak na obrazku */
      --shirt:#fbfbfb;
      --shirt-shadow:#e7e7e7;
      --shirt-accent:#d6d6d6;
      --shirt-accent-soft:#ececec;

      --eye:#5a3527;
      --lip:#d97a79;
      --lip-dark:#be6064;
      --blush:#e9a39b;
      --glasses:#2f2a3a;
      --earring:#f4c64f;
      --necklace:#f4c64f;
      --nail:#d86c7c;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .wrap {
      width: min(420px, 92vw);
      aspect-ratio: 1 / 1.25;
      filter: drop-shadow(0 18px 35px rgba(0,0,0,.12));
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .breathe {
      transform-origin: center;
      animation: float 4s ease-in-out infinite;
      transition: transform 0.12s ease-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5s infinite;
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.12); }
      96% { transform: scaleY(1); }
    }

    .hair-sheen {
      opacity: .35;
      mix-blend-mode: screen;
    }

    .hair-group {
      transform-box: fill-box;
      transform-origin: center;
      animation: hairWind 5s ease-in-out infinite;
    }

    .hair-left {
      transform-box: fill-box;
      transform-origin: top center;
      animation: hairLeft 5.2s ease-in-out infinite;
    }

    .hair-right {
      transform-box: fill-box;
      transform-origin: top center;
      animation: hairRight 5.2s ease-in-out infinite;
    }

    @keyframes hairWind {
      0%, 100% { transform: translateX(0px) rotate(0deg); }
      50%      { transform: translateX(-1px) rotate(-0.4deg); }
    }

    @keyframes hairLeft {
      0%, 100% { transform: rotate(0deg) translateX(0px); }
      50%      { transform: rotate(-1.2deg) translateX(-1px); }
    }

    @keyframes hairRight {
      0%, 100% { transform: rotate(0deg) translateX(0px); }
      50%      { transform: rotate(1.2deg) translateX(1px); }
    }

    #character,
    #head,
    #body,
    #hair,
    #pupilLeft,
    #pupilRight {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.12s ease-out;
    }

    #mouth.smile {
      animation: smileAnim 0.45s ease-out forwards;
    }

    @keyframes smileAnim {
      0% {
        d: path("M180 258 C187 254, 193 252, 200 252 C207 252, 213 254, 220 258 C214 263, 207 265, 200 265 C193 265, 186 263, 180 258 Z");
      }
      50% {
        d: path("M178 258 C187 252, 193 250, 200 250 C207 250, 213 252, 222 258 C214 270, 207 274, 200 274 C193 274, 186 270, 178 258 Z");
      }
      100% {
        d: path("M180 258 C187 254, 193 252, 200 252 C207 252, 213 254, 220 258 C214 263, 207 265, 200 265 C193 265, 186 263, 180 258 Z");
      }
    }

    .eyes-click-blink {
      animation: eyesClickBlink 0.3s ease-in-out 1;
    }

    @keyframes eyesClickBlink {
      0%, 100% { transform: scaleY(1); }
      30%, 70% { transform: scaleY(0.12); }
    }

    #head.nod {
      animation: headNod 0.35s ease-out 1;
    }

    @keyframes headNod {
      0%   { transform: translate(0px, 0px) rotate(0deg); }
      40%  { transform: translate(0px, 4px) rotate(3deg); }
      70%  { transform: translate(0px, -1px) rotate(-1deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <svg id="avatar" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" aria-label="Portret kobiety">
      <defs>
        <radialGradient id="faceGrad" cx="45%" cy="30%" r="70%">
          <stop offset="0%" stop-color="var(--skin-light)"/>
          <stop offset="62%" stop-color="var(--skin)"/>
          <stop offset="100%" stop-color="var(--skin-shadow)"/>
        </radialGradient>

        <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--hair-light)"/>
          <stop offset="45%" stop-color="var(--hair)"/>
          <stop offset="100%" stop-color="var(--hair-dark)"/>
        </linearGradient>

        <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--shirt)"/>
          <stop offset="100%" stop-color="var(--shirt-shadow)"/>
        </linearGradient>

        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
          <feOffset id="shadowOffset" in="blur" dx="0" dy="4" result="offsetblur"/>
          <feComponentTransfer in="offsetblur">
            <feFuncA type="linear" slope="0.25"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <radialGradient id="faceHighlightGrad" cx="50%" cy="35%" r="30%">
          <stop offset="0%" stop-color="#fff9f2" stop-opacity="0.9"/>
          <stop offset="60%" stop-color="#fff3e5" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#fff0e0" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect width="400" height="500" fill="transparent"/>

      <g id="character" class="breathe" filter="url(#softShadow)">
        <g id="hair" class="hair-group">
          <path d="M97 182
                   C96 118, 140 70, 200 70
                   C265 70, 310 115, 307 184
                   C334 200, 344 224, 338 251
                   C333 281, 313 305, 300 327
                   C289 346, 281 361, 274 389
                   C267 417, 238 426, 200 426
                   C162 426, 133 417, 126 389
                   C119 361, 111 346, 100 327
                   C87 305, 67 281, 62 251
                   C56 224, 66 200, 97 182 Z"
                fill="url(#hairGrad)"/>
        </g>

        <g id="body">
          <path d="M70 500
                   C80 432, 111 382, 156 360
                   C170 353, 183 352, 200 352
                   C217 352, 230 353, 244 360
                   C289 382, 320 432, 330 500 Z"
                fill="url(#shirtGrad)"/>

          <path d="M78 500
                   C82 452, 96 422, 118 402
                   C130 392, 144 386, 160 383
                   C158 404, 155 426, 151 446
                   C148 460, 142 474, 134 486
                   C126 496, 110 502, 96 500 Z"
                fill="url(#faceGrad)" opacity="0.96"/>

          <path d="M322 500
                   C318 452, 304 422, 282 402
                   C270 392, 256 386, 240 383
                   C242 404, 245 426, 249 446
                   C252 460, 258 474, 266 486
                   C274 496, 290 502, 304 500 Z"
                fill="url(#faceGrad)" opacity="0.96"/>

          <path d="M132 478
                   C138 487, 145 493, 154 496"
                stroke="var(--nail)" stroke-width="3" stroke-linecap="round"/>
          <path d="M268 478
                   C262 487, 255 493, 246 496"
                stroke="var(--nail)" stroke-width="3" stroke-linecap="round"/>

          <path d="M110 500
                   C118 430, 146 385, 186 362
                   C190 376, 194 387, 198 395
                   C201 400, 206 405, 212 408
                   C234 386, 252 378, 254 362
                   C294 385, 322 430, 290 500 Z"
                fill="url(#shirtGrad)"/>

          <path d="M158 360
                   C170 390, 182 405, 200 410
                   C218 405, 230 390, 242 360
                   L200 338 Z"
                fill="url(#faceGrad)" opacity="0.9"/>

          <path d="M158 360
                   C170 390, 182 405, 200 410
                   C218 405, 230 390, 242 360"
                fill="none" stroke="var(--shirt-accent)" stroke-width="4" stroke-linecap="round"/>

          <path d="M130 412
                   C156 432, 176 440, 200 440
                   C224 440, 244 432, 270 412"
                fill="none" stroke="var(--shirt-accent-soft)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

          <g fill="var(--shirt-accent-soft)" opacity="0.65">
            <circle cx="155" cy="424" r="2.1"/>
            <circle cx="180" cy="433" r="2.1"/>
            <circle cx="205" cy="429" r="2.1"/>
            <circle cx="230" cy="436" r="2.1"/>
            <circle cx="250" cy="421" r="2.1"/>
          </g>
        </g>

        <g id="head">
          <path d="M170 282
                   C178 298, 183 312, 186 327
                   C188 338, 193 346, 200 348
                   C207 346, 212 338, 214 327
                   C217 312, 222 298, 230 282
                   C220 286, 210 289, 200 290
                   C190 289, 180 286, 170 282 Z"
                fill="url(#faceGrad)"/>

          <ellipse cx="200" cy="212" rx="54" ry="82" fill="url(#faceGrad)"/>

          <path class="hair-left" d="M130 200
                   C120 165, 132 124, 163 104
                   C174 97, 184 94, 195 93
                   C164 109, 153 138, 156 171
                   C157 189, 151 208, 141 225
                   C137 217, 133 208, 130 200 Z"
                fill="url(#hairGrad)"/>

          <path class="hair-right" d="M270 200
                   C280 165, 268 124, 237 104
                   C226 97, 216 94, 205 93
                   C236 109, 247 138, 244 171
                   C243 189, 249 208, 259 225
                   C263 217, 267 208, 270 200 Z"
                fill="url(#hairGrad)"/>

          <path class="hair-left" d="M112 205
                   C90 228, 84 270, 101 303
                   C114 329, 141 349, 155 360
                   C142 326, 140 292, 147 263
                   C153 238, 155 217, 145 197
                   C133 191, 121 194, 112 205 Z"
                fill="url(#hairGrad)"/>

          <path class="hair-right" d="M288 205
                   C310 228, 316 270, 299 303
                   C286 329, 259 349, 245 360
                   C258 326, 260 292, 253 263
                   C247 238, 245 217, 255 197
                   C267 191, 279 194, 288 205 Z"
                fill="url(#hairGrad)"/>

          <path class="hair-sheen" d="M143 117
                   C166 100, 187 94, 202 94
                   C179 107, 168 132, 168 158
                   C168 174, 163 190, 154 205
                   C146 186, 141 171, 140 154
                   C138 139, 139 127, 143 117 Z"
                fill="#d79a6c"/>

          <path d="M120 223
                   C122 217, 126 213, 130 213
                   C133 213, 135 215, 135 218
                   C135 220, 134 221, 133 222
                   C134 224, 135 226, 135 229
                   C135 232, 133 234, 130 234
                   C127 234, 124 231, 122 227
                   C121 226, 120 225, 120 223 Z"
                fill="url(#faceGrad)"/>

          <path d="M260 223
                   C260 225, 259 226, 258 227
                   C256 231, 253 234, 250 234
                   C247 234, 245 232, 245 229
                   C245 226, 246 224, 247 222
                   C246 221, 245 220, 245 218
                   C245 215, 247 213, 250 213
                   C254 213, 258 217, 260 223 Z"
                fill="url(#faceGrad)"/>

          <path d="M160 180
                   C171 171, 181 169, 192 172"
                stroke="var(--hair-dark)" stroke-width="4.2" stroke-linecap="round" fill="none" opacity="0.95"/>
          <path d="M208 172
                   C219 169, 229 171, 240 180"
                stroke="var(--hair-dark)" stroke-width="4.2" stroke-linecap="round" fill="none" opacity="0.95"/>

          <g>
            <path d="M152 201
                     C160 196, 174 196, 182 201"
                  stroke="var(--glasses)" stroke-width="0" fill="none"/>
          </g>

          <g id="eyesGroup" class="blink">
            <ellipse id="eyeLeft"  cx="176" cy="205" rx="9" ry="6.5" fill="#fff"/>
            <ellipse id="eyeRight" cx="224" cy="205" rx="9" ry="6.5" fill="#fff"/>

            <circle id="pupilLeft"  cx="176" cy="206" r="4.4" fill="var(--eye)"/>
            <circle id="pupilRight" cx="224" cy="206" r="4.4" fill="var(--eye)"/>

            <circle cx="177.3" cy="204" r="1.1" fill="#fff"/>
            <circle cx="225.3" cy="204" r="1.1" fill="#fff"/>

            <path d="M166 202
                     C171 199, 181 199, 186 202"
                  stroke="#3b2620" stroke-width="2.4" stroke-linecap="round" fill="none"/>
            <path d="M214 202
                     C219 199, 229 199, 234 202"
                  stroke="#3b2620" stroke-width="2.4" stroke-linecap="round" fill="none"/>

            <path d="M168 199 L163 195" stroke="#3b2620" stroke-width="2" stroke-linecap="round"/>
            <path d="M172 198 L168 193" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M180 198 L181 193" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>

            <path d="M232 199 L237 195" stroke="#3b2620" stroke-width="2" stroke-linecap="round"/>
            <path d="M228 198 L232 193" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M220 198 L219 193" stroke="#3b2620" stroke-width="1.8" stroke-linecap="round"/>
          </g>

          <path d="M199 208
                   C196 220, 194 228, 190 234"
                stroke="#cb9478" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M190 236 C195 240, 205 240, 210 236"
                stroke="#cb9478" stroke-width="3" stroke-linecap="round" fill="none"/>

          <path id="mouth" d="M180 258
                   C187 254, 193 252, 200 252
                   C207 252, 213 254, 220 258
                   C214 263, 207 265, 200 265
                   C193 265, 186 263, 180 258 Z"
                fill="var(--lip)"/>

          <ellipse cx="152" cy="243" rx="16" ry="10" fill="var(--blush)" opacity=".26"/>
          <ellipse cx="248" cy="243" rx="16" ry="10" fill="var(--blush)" opacity=".26"/>

          <ellipse cx="184" cy="186" rx="22" ry="31" fill="#fff7ef" opacity=".20"/>

          <ellipse id="faceHighlight" cx="200" cy="212" rx="46" ry="70" fill="url(#faceHighlightGrad)" opacity="0"/>
        </g>

        <path d="M172 344
                 C180 354, 190 360, 200 360
                 C210 360, 220 354, 228 344"
              stroke="var(--necklace)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <circle cx="200" cy="370" r="7" fill="var(--necklace)" opacity="0.96"/>
        <circle cx="200" cy="370" r="4" fill="#fff9e6" opacity="0.9"/>

        <g>
          <circle cx="128" cy="232" r="3" fill="var(--earring)"/>
          <path d="M128 235
                   C128 242, 128 248, 128 254"
                stroke="var(--earring)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="128" cy="258" r="5.2" fill="var(--earring)"/>
          <circle cx="128" cy="258" r="3" fill="#fff9e6"/>

          <circle cx="272" cy="232" r="3" fill="var(--earring)"/>
          <path d="M272 235
                   C272 242, 272 248, 272 254"
                stroke="var(--earring)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="272" cy="258" r="5.2" fill="var(--earring)"/>
          <circle cx="272" cy="258" r="3" fill="#fff9e6"/>
        </g>
      </g>
    </svg>
  </div>

  <script>
    const svg = document.getElementById('avatar');
    const character = document.getElementById('character');
    const head = document.getElementById('head');
    const body = document.getElementById('body');
    const hair = document.getElementById('hair');

    const pupilLeft  = document.getElementById('pupilLeft');
    const pupilRight = document.getElementById('pupilRight');
    const eyesGroup  = document.getElementById('eyesGroup');
    const mouth      = document.getElementById('mouth');

    const faceHighlight = document.getElementById('faceHighlight');
    const faceHighlightGrad = document.getElementById('faceHighlightGrad');
    const shadowOffset = document.getElementById('shadowOffset');

    const eyeLeftCenter  = { x: 176, y: 205 };
    const eyeRightCenter = { x: 224, y: 205 };
    const pupilRadiusMax = 3;

    const faceCenter = { x: 200, y: 212 };

    svg.addEventListener('mousemove', (e) => {
      const rect = svg.getBoundingClientRect();
      const relX = (e.clientX - rect.left) / rect.width - 0.5;
      const relY = (e.clientY - rect.top) / rect.height - 0.5;

      const tiltY = relX * 6;
      character.style.transform =
        `translate(${relX * 8}px, ${relY * 6}px) rotate(${tiltY * 0.35}deg)`;

      head.style.transform = `translate(${relX * 4}px, ${relY * 3}px)`;
      hair.style.transform = `translate(${relX * 5}px, ${relY * 4}px)`;
      body.style.transform = `translate(${relX * 2}px, ${relY * 1.5}px)`;

      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      movePupil(pupilLeft,  eyeLeftCenter,  mouseX, mouseY);
      movePupil(pupilRight, eyeRightCenter, mouseX, mouseY);

      const shadowDx = -relX * 10;
      const shadowDy = -relY * 8;
      shadowOffset.setAttribute('dx', shadowDx.toFixed(1));
      shadowOffset.setAttribute('dy', (4 + shadowDy).toFixed(1));

      const svgX = (mouseX / rect.width) * 400;
      const svgY = (mouseY / rect.height) * 500;

      const highlightX = faceCenter.x + (svgX - faceCenter.x) * 0.35;
      const highlightY = faceCenter.y + (svgY - faceCenter.y) * 0.35;

      const cxPercent = (highlightX / 400) * 100;
      const cyPercent = (highlightY / 500) * 100;

      faceHighlightGrad.setAttribute('cx', `${cxPercent}%`);
      faceHighlightGrad.setAttribute('cy', `${cyPercent}%`);

      faceHighlight.setAttribute('opacity', '0.85');
    });

    svg.addEventListener('mouseleave', () => {
      character.style.transform = 'translate(0px, 0px)';
      head.style.transform = 'translate(0px, 0px)';
      hair.style.transform = 'translate(0px, 0px)';
      body.style.transform = 'translate(0px, 0px)';

      pupilLeft.setAttribute('cx', eyeLeftCenter.x);
      pupilLeft.setAttribute('cy', eyeLeftCenter.y + 1);
      pupilRight.setAttribute('cx', eyeRightCenter.x);
      pupilRight.setAttribute('cy', eyeRightCenter.y + 1);

      shadowOffset.setAttribute('dx', '0');
      shadowOffset.setAttribute('dy', '4');
      faceHighlightGrad.setAttribute('cx', '50%');
      faceHighlightGrad.setAttribute('cy', '35%');
      faceHighlight.setAttribute('opacity', '0');
    });

    function movePupil(pupil, center, mouseX, mouseY) {
      const dx = mouseX - center.x;
      const dy = mouseY - center.y;
      const angle = Math.atan2(dy, dx);
      const dist = Math.min(Math.hypot(dx, dy), pupilRadiusMax);

      const offsetX = Math.cos(angle) * dist;
      const offsetY = Math.sin(angle) * dist;

      pupil.setAttribute('cx', center.x + offsetX);
      pupil.setAttribute('cy', center.y + offsetY);
    }

    head.addEventListener('click', () => {
      head.classList.remove('nod');
      void head.offsetWidth;
      head.classList.add('nod');

      mouth.classList.remove('smile');
      void mouth.offsetWidth;
      mouth.classList.add('smile');
    });

    eyesGroup.addEventListener('click', (e) => {
      e.stopPropagation();
      eyesGroup.classList.remove('eyes-click-blink');
      void eyesGroup.offsetWidth;
      eyesGroup.classList.add('eyes-click-blink');
    });
  </script>
</body>
</html>
