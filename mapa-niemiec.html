<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa Niemiec</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    overflow:hidden;
}

/* ===== CAŁA STRONA ===== */

.germany-page{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#111;
}

/* ===== OBSZAR MAPY ===== */

.map-container{
    position:absolute;
    top:0;
    left:240px;

    width:calc(100vw - 480px);
    height:100vh;

    overflow:hidden;
}

.germany-map{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    user-select:none;
    pointer-events:none;
}

/* ===== WSPÓLNY WYGLĄD MENU ===== */

.left-menu,
.right-menu{
    position:absolute;
    top:50%;
    transform:translateY(-50%);

    width:200px;

    display:flex;
    flex-direction:column;
    gap:14px;

    z-index:500;
}

.left-menu{
    left:20px;
}

.right-menu{
    right:20px;
}

.left-menu a,
.right-menu a,
.land{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    min-height:46px;
    padding:10px 18px;

    color:#fff;
    text-decoration:none;
    text-align:center;

    font-size:18px;
    font-weight:bold;

    border:1px solid rgba(255,255,255,.3);
    border-radius:15px;

    background:rgba(0,0,0,.48);
    backdrop-filter:blur(8px);

    box-shadow:0 4px 12px rgba(0,0,0,.5);
    text-shadow:1px 1px 3px #000;

    transition:
        transform .25s,
        background .25s,
        border-color .25s,
        box-shadow .25s;
}

.left-menu a,
.right-menu a{
    width:100%;
}

.left-menu a:hover,
.right-menu a:hover,
.land:hover{
    transform:scale(1.07);

    color:#fff;
    background:rgba(255,206,0,.25);
    border-color:rgba(255,206,0,.75);

    box-shadow:0 0 16px rgba(255,206,0,.55);
}

.left-menu a:active,
.right-menu a:active,
.land:active{
    transform:scale(.97);
}

.left-menu a::before,
.right-menu a::before,
.land::before{
    content:"";

    position:absolute;
    top:0;
    left:0;

    width:7px;
    height:100%;

    border-radius:15px 0 0 15px;

    background:linear-gradient(
        to bottom,
        #000 0 33%,
        #e00000 33% 66%,
        #ffce00 66% 100%
    );
}

/* ===== PRZYCISKI NA MAPIE ===== */

.land{
    position:absolute;
    z-index:100;
    min-width:120px;
}

.c2{
    top:10%;
    left:49%;
}

.c1{
    top:22%;
    left:25%;
}

.b2{
    top:36%;
    left:43%;
}

.b1{
    top:52%;
    left:33%;
}

.a2{
    top:59%;
    left:49%;
}

.a1{
    top:78%;
    left:55%;
}

/* ===== PRZYCISK NELE ===== */

.nele-button{
    position:fixed;
    top:22px;
    right:22px;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:14px 26px;

    color:#fff;
    text-decoration:none;

    font-size:20px;
    font-weight:bold;

    border:2px solid #60a5fa;
    border-radius:15px;

    background:#2d7df6;
    box-shadow:0 5px 15px rgba(0,0,0,.45);

    transition:.25s;
}

.nele-button:hover{
    background:#155ec9;
    transform:translateY(-3px);
}

/* ===== MNIEJSZE EKRANY ===== */

@media(max-width:1100px){

    .map-container{
        left:190px;
        width:calc(100vw - 380px);
    }

    .left-menu,
    .right-menu{
        width:160px;
        gap:11px;
    }

    .left-menu{
        left:10px;
    }

    .right-menu{
        right:10px;
    }

    .left-menu a,
    .right-menu a{
        min-height:42px;
        padding:8px 10px;
        font-size:15px;
    }

    .land{
        min-width:92px;
        padding:8px 11px;
        font-size:14px;
    }
}

/* ===== TELEFON ===== */

@media(max-width:750px){

    body{
        overflow:auto;
    }

    .germany-page{
        min-height:100vh;
        height:auto;
        padding:12px;
        overflow:visible;
    }

    .left-menu,
    .right-menu{
        position:relative;
        top:auto;
        left:auto;
        right:auto;
        transform:none;

        width:100%;
        margin:0 auto 10px;

        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .right-menu{
        margin-bottom:15px;
    }

    .left-menu a,
    .right-menu a{
        min-width:0;
        min-height:40px;
        padding:7px 8px;
        font-size:13px;
    }

    .map-container{
        position:relative;
        top:auto;
        left:auto;

        width:100%;
        height:70vh;
        min-height:520px;

        overflow:hidden;
    }

    .land{
        min-width:66px;
        padding:6px 7px;
        font-size:11px;
        border-radius:10px;
    }

    .land::before{
        width:4px;
        border-radius:10px 0 0 10px;
    }

    .c2{
        top:10%;
        left:48%;
    }

    .c1{
        top:24%;
        left:18%;
    }

    .b2{
        top:39%;
        left:36%;
    }

    .b1{
        top:53%;
        left:22%;
    }

    .a2{
        top:60%;
        left:48%;
    }

    .a1{
        top:78%;
        left:52%;
    }

    .nele-button{
        top:12px;
        right:12px;
        padding:10px 16px;
        font-size:15px;
    }
}
</style>
</head>

<main class="germany-page">

        <a href="lessons/A2/index.html" class="land a2">

    </div>

    <!-- NELE -->

    <a href="nele.html" class="nele-button">
        Nele
    </a>

</main>

</body>
</html>
