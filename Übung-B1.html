<!--
  DOŁĄCZ TO DO LEKCJI 1
-->

<div id="dialog-practice" style="
  max-width:1100px;
  margin:24px auto 40px;
  background:transparent;
  padding:0;
  font-family:Arial, sans-serif;
  font-size:14px;
  box-sizing:border-box;
">
  <h2 style="text-align:center;color:#1d4ed8;margin-bottom:6px;font-size:22px;">
    🗣️ Dialog wiederholen – laut sprechen
  </h2>
  <p style="text-align:center;color:#0f766e;margin-bottom:18px;font-size:14px;">
    Anna spricht → du siehst den Hinweis → sprich laut auf Deutsch
  </p>

  <div style="display:flex;flex-direction:row;align-items:stretch;justify-content:center;gap:16px;flex-wrap:wrap;">

    <!-- LINKES FENSTER -->
    <div style="flex:1 1 340px;min-width:280px;border-radius:16px;padding:14px 16px;background:white;box-shadow:0 4px 14px rgba(0,0,0,0.08);box-sizing:border-box;">
      <div id="dialog-lines" style="margin-bottom:12px;max-height:280px;overflow-y:auto;"></div>

      <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        <button onclick="startDialog()" style="background:#2563eb;color:white;border:none;border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer;">
          ▶ Start
        </button>
        <button onclick="repeatCurrent()" id="repeatBtn" style="background:#16a34a;color:white;border:none;border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer;display:none;">
          🔄 Wiederholen
        </button>
        <button onclick="pauseDialog()" id="pauseBtn" style="background:#6b7280;color:white;border:none;border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer;display:none;">
          ⏸ Stopp
        </button>
        <button onclick="resumeDialog()" id="resumeBtn" style="background:#0ea5e9;color:white;border:none;border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer;display:none;">
          ▶ Weiter
        </button>
        <button onclick="resetDialog()" style="background:#ea580c;color:white;border:none;border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer;">
          ↺ Neustart
        </button>
      </div>

      <div id="result-area" style="text-align:center;font-size:15px;min-height:36px;padding:8px;border-radius:10px;background:#f8fafc;color:#374151;"></div>
    </div>

    <!-- RECHTES FENSTER -->
    <div style="flex:0 1 300px;min-width:220px;border-radius:16px;padding:14px 16px;background:white;box-shadow:0 4px 14px rgba(0,0,0,0.08);box-sizing:border-box;display:flex;flex-direction:column;gap:8px;">
      <h3 style="margin:0;color:#1e3a8a;text-align:center;font-size:16px;font-weight:700;">🎧 Was du sagst</h3>
      <p style="margin:0;font-size:12px;color:#4b5563;text-align:center;">Deine Wörter werden hier live angezeigt.</p>

      <div style="display:flex;align-items:center;justify-content:center;gap:6px;">
        <div id="mic-dot" style="width:10px;height:10px;border-radius:50%;background:#d1d5db;"></div>
        <span id="mic-label" style="font-size:12px;color:#6b7280;">Mikrofon aus</span>
      </div>

      <div id="student-transcript" style="flex:1;text-align:center;font-size:17px;line-height:1.5;padding:12px;border-radius:12px;background:#eef2ff;color:#111827;border:1px dashed #93c5fd;display:flex;align-items:center;justify-content:center;min-height:120px;">
        Klicke auf „Start" und sprich laut.
      </div>

      <div id="retry-hint" style="font-size:12px;color:#6b7280;text-align:center;min-height:16px;"></div>
    </div>

  </div>
</div>

<style>
@keyframes mic-pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
#mic-dot.active { background:#dc2626 !important; animation:mic-pulse 1s infinite; }
</style>

<script>
// ============================================================
// DANE
// ============================================================
var dialogSteps = [
  {
    anna:     "Hallo! Wie heißt du?",
    hint:     "Ich heiße …",
    patterns: ["ich heiße","ich heisse","mein name ist","ich bin"]
  },
  {
    anna:     "Guten Tag! Mein Name ist Anna Müller.",
    hint:     "Mein Name ist …",
    patterns: ["mein name ist","ich heiße","ich heisse"]
  },
  {
    anna:     "Wie heißen Sie?",
    hint:     "Wie heißen Sie?",
    patterns: ["wie heißen sie","wie heissen sie"]
  },
  {
    anna:     "Auf Wiedersehen!",
    hint:     "Auf Wiedersehen!",
    patterns: ["auf wiedersehen","wiedersehen"]
  }
];

// ============================================================
// STAN
// ============================================================
var currentStep       = -1;
var waitingForStudent = false;
var answerAccepted    = false;  // KLUCZ: blokuje scheduleRetry po poprawnej odpowiedzi
var recognition       = null;
var isListening       = false;
var isPaused          = false;
var retryTimer        = null;
var ttsQueue          = [];     // kolejka TTS dla pewności
var voicesReady       = false;

// ============================================================
// DOM
// ============================================================
var linesContainer    = document.getElementById("dialog-lines");
var resultArea        = document.getElementById("result-area");
var repeatBtn         = document.getElementById("repeatBtn");
var pauseBtn          = document.getElementById("pauseBtn");
var resumeBtn         = document.getElementById("resumeBtn");
var studentTranscript = document.getElementById("student-transcript");
var micDot            = document.getElementById("mic-dot");
var micLabel          = document.getElementById("mic-label");
var retryHint         = document.getElementById("retry-hint");

// ============================================================
// TTS – ładowanie głosów z retry, zwraca Promise
// ============================================================
function getDeVoice() {
  var voices = window.speechSynthesis.getVoices();
  return voices.find(function(v){ return v.lang && v.lang.startsWith("de"); }) || null;
}

function speak(text, onDone) {
  // onDone = callback po zakończeniu (zamiast Promise, żeby uniknąć problemów z async)
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang  = "de-DE";
  u.rate  = 0.9;
  u.pitch = 1;
  var v = getDeVoice();
  if (v) u.voice = v;

  var done = false;
  function finish() {
    if (!done) { done = true; if (onDone) onDone(); }
  }

  u.onend   = finish;
  u.onerror = finish;

  // Zabezpieczenie: jeśli speechSynthesis zawiesza (bug Chrome),
  // timeout 6s wymusza przejście dalej
  var fallback = setTimeout(finish, 6000);
  u.onend = function() { clearTimeout(fallback); finish(); };
  u.onerror = function() { clearTimeout(fallback); finish(); };

  window.speechSynthesis.speak(u);
}

// Ładowanie głosów — Chrome wymaga zdarzenia voiceschanged
function ensureVoices(callback) {
  if (window.speechSynthesis.getVoices().length > 0) {
    callback();
  } else {
    window.speechSynthesis.onvoiceschanged = function() {
      window.speechSynthesis.onvoiceschanged = null;
      callback();
    };
    // Fallback: niektóre przeglądarki nie odpalaą zdarzenia
    setTimeout(callback, 500);
  }
}

// ============================================================
// RENDER
// ============================================================
function renderDialog() {
  linesContainer.innerHTML = "";
  dialogSteps.forEach(function(step, idx) {
    // Linia Anny
    var annaRow = document.createElement("div");
    annaRow.style.cssText = "display:flex;gap:8px;align-items:flex-start;padding:8px;margin-bottom:2px;border-radius:8px;border-bottom:1px solid #f0f0f0;font-size:14px;background:" + (idx === currentStep && !waitingForStudent ? "#eff6ff" : "transparent") + ";";
    annaRow.innerHTML = "<span style='min-width:60px;font-weight:700;color:#0f2f57;font-size:13px;'>Anna</span><span style='flex:1;line-height:1.5;color:#111;'>" + step.anna + "</span>";
    linesContainer.appendChild(annaRow);

    // Linia ucznia
    var isActive = (idx === currentStep && waitingForStudent);
    var duRow = document.createElement("div");
    duRow.style.cssText = "display:flex;gap:8px;align-items:flex-start;padding:8px;margin-bottom:6px;border-radius:8px;border-bottom:1px solid #f0f0f0;font-size:14px;" + (isActive ? "background:#fff7d6;border-left:4px solid #f5b301;" : "background:transparent;border-left:none;");
    duRow.innerHTML = "<span style='min-width:60px;font-weight:700;color:#0f2f57;font-size:13px;'>du</span><span style='flex:1;line-height:1.5;color:#0b8043;font-style:italic;'>" + step.hint + "</span>";
    linesContainer.appendChild(duRow);
  });

  var rows = linesContainer.children;
  var activeIdx = currentStep * 2 + (waitingForStudent ? 1 : 0);
  if (rows[activeIdx]) rows[activeIdx].scrollIntoView({block:"nearest", behavior:"smooth"});
}

// ============================================================
// WSKAŹNIK MIKROFONU
// ============================================================
function setMic(active) {
  if (active) {
    micDot.classList.add("active");
    micLabel.textContent = "Mikrofon aktywny";
    micLabel.style.color = "#dc2626";
  } else {
    micDot.classList.remove("active");
    micLabel.textContent = "Mikrofon aus";
    micLabel.style.color = "#6b7280";
  }
}

// ============================================================
// WYNIK
// ============================================================
function setResult(msg, type) {
  resultArea.textContent = msg;
  if      (type === "ok")   { resultArea.style.background="#dcfce7"; resultArea.style.color="#166534"; }
  else if (type === "err")  { resultArea.style.background="#fee2e2"; resultArea.style.color="#dc2626"; }
  else if (type === "info") { resultArea.style.background="#fff7d6"; resultArea.style.color="#92400e"; }
  else                      { resultArea.style.background="#f8fafc"; resultArea.style.color="#374151"; }
}

// ============================================================
// START
// ============================================================
function startDialog() {
  isPaused          = false;
  currentStep       = -1;
  waitingForStudent = false;
  answerAccepted    = false;
  killRecognition();
  clearTimeout(retryTimer);
  retryHint.textContent   = "";
  repeatBtn.style.display = "none";
  pauseBtn.style.display  = "inline-block";
  resumeBtn.style.display = "none";
  setResult("", "");
  studentTranscript.textContent = "Hör gut zu und sprich danach laut.";
  setMic(false);
  renderDialog();

  // Najpierw upewniamy się, że głosy są załadowane
  ensureVoices(function() { nextAnnaLine(); });
}

// ============================================================
// SEKWENCJA: Anna mówi → czekamy na ucznia
// ============================================================
function nextAnnaLine() {
  if (isPaused) return;

  currentStep++;

  if (currentStep >= dialogSteps.length) {
    waitingForStudent = false;
    answerAccepted    = false;
    renderDialog();
    setResult("✓ Perfekt! Der Dialog ist beendet.", "ok");
    repeatBtn.style.display = "none";
    setMic(false);
    speak("Herzlichen Glückwunsch! Der Dialog ist beendet.", null);
    return;
  }

  waitingForStudent = false;
  answerAccepted    = false;
  renderDialog();

  speak(dialogSteps[currentStep].anna, function() {
    if (isPaused) return;
    askStudent();
  });
}

function askStudent() {
  if (isPaused) return;
  waitingForStudent = true;
  answerAccepted    = false;
  renderDialog();
  setResult("🎤 Sprich den Satz laut nach!", "info");
  repeatBtn.style.display = "inline-block";
  studentTranscript.innerHTML = "<em style='color:#6b7280'>Ich höre…</em>";
  startRecognition();
}

// ============================================================
// ROZPOZNAWANIE MOWY
// ============================================================
function startRecognition() {
  if (isListening || isPaused || !waitingForStudent) return;

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setResult("❌ Bitte Chrome oder Edge benutzen.", "err");
    studentTranscript.textContent = "Spracherkennung nicht verfügbar.";
    return;
  }

  recognition = new SR();
  recognition.lang            = "de-DE";
  recognition.continuous      = false;
  recognition.interimResults  = true;
  recognition.maxAlternatives = 3;
  isListening = true;
  setMic(true);

  recognition.onresult = function(event) {
    var interimText = "";
    var finalText   = "";

    for (var i = event.resultIndex; i < event.results.length; i++) {
      var t = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText = t;
      else interimText += t;
    }

    if (interimText) {
      studentTranscript.innerHTML = "<em style='color:#6b7280'>" + interimText + "</em>";
    }

    if (finalText.trim()) {
      studentTranscript.textContent = finalText.trim();
      // Ustawiamy answerAccepted PRZED onend żeby blokada zadziałała
      isListening = false;
      setMic(false);
      checkAnswer(finalText.trim());
    }
  };

  recognition.onerror = function(e) {
    isListening = false;
    setMic(false);
    if (isPaused || answerAccepted) return;
    if (e.error === "no-speech") {
      scheduleRetry();
      return;
    }
    setResult("✗ Nicht erkannt — bitte nochmal sprechen.", "err");
    scheduleRetry();
  };

  recognition.onend = function() {
    isListening = false;
    setMic(false);
    if (isPaused || answerAccepted) return;
    // Tylko retry jeśli nadal czekamy na odpowiedź
    if (waitingForStudent) scheduleRetry();
  };

  try {
    recognition.start();
  } catch(e) {
    isListening = false;
    setMic(false);
    scheduleRetry();
  }
}

function scheduleRetry() {
  if (answerAccepted || !waitingForStudent || isPaused) return;
  clearTimeout(retryTimer);
  retryHint.textContent = "Wird erneut gestartet…";
  retryTimer = setTimeout(function() {
    retryHint.textContent = "";
    if (!isPaused && waitingForStudent && !answerAccepted) {
      studentTranscript.innerHTML = "<em style='color:#6b7280'>Ich höre…</em>";
      startRecognition();
    }
  }, 1800);
}

function killRecognition() {
  clearTimeout(retryTimer);
  retryHint.textContent = "";
  if (recognition) {
    try { recognition.abort(); } catch(e) {}
    recognition = null;
  }
  isListening = false;
  setMic(false);
}

// ============================================================
// SPRAWDZANIE ODPOWIEDZI
// ============================================================
function normalize(text) {
  return text.toLowerCase()
    .replace(/ß/g, "ss")
    .replace(/[.,!?¡¿]/g, "")
    .trim();
}

function checkAnswer(raw) {
  // Natychmiast blokujemy retry
  answerAccepted    = true;
  waitingForStudent = false;
  clearTimeout(retryTimer);
  retryHint.textContent = "";
  killRecognition();

  var answer   = normalize(raw);
  var patterns = dialogSteps[currentStep].patterns;
  var ok       = patterns.some(function(p){ return answer.includes(normalize(p)); });

  if (ok) {
    setResult("✓ Sehr gut! „" + raw + """, "ok");
    repeatBtn.style.display = "none";
    speak("Sehr gut!", function() {
      if (!isPaused) nextAnnaLine();
    });
  } else {
    setResult("✗ Nicht ganz: „" + raw + "". Bitte noch einmal!", "err");
    speak("Bitte versuche es noch einmal.", function() {
      if (!isPaused) {
        // Zresetuj i daj kolejną próbę dla TEGO SAMEGO kroku
        waitingForStudent = true;
        answerAccepted    = false;
        setResult("🎤 Sprich den Satz laut nach!", "info");
        studentTranscript.innerHTML = "<em style='color:#6b7280'>Ich höre…</em>";
        startRecognition();
      }
    });
  }
}

// ============================================================
// WIEDERHOLEN
// ============================================================
function repeatCurrent() {
  if (currentStep < 0 || currentStep >= dialogSteps.length) return;
  var hint = dialogSteps[currentStep].hint.replace("…","").trim();
  speak(hint, null);
}

// ============================================================
// PAUSE / WEITER
// ============================================================
function pauseDialog() {
  isPaused = true;
  window.speechSynthesis.pause();
  killRecognition();
  pauseBtn.style.display  = "none";
  resumeBtn.style.display = "inline-block";
  setResult("⏸ Dialog gestoppt. Klicke auf „Weiter", um fortzusetzen.", "");
}

function resumeDialog() {
  if (!isPaused) return;
  isPaused = false;
  pauseBtn.style.display  = "inline-block";
  resumeBtn.style.display = "none";
  window.speechSynthesis.resume();

  if (waitingForStudent) {
    answerAccepted = false;
    setResult("🎤 Sprich den Satz laut nach!", "info");
    studentTranscript.innerHTML = "<em style='color:#6b7280'>Ich höre…</em>";
    startRecognition();
  } else {
    nextAnnaLine();
  }
}

// ============================================================
// NEUSTART
// ============================================================
function resetDialog() {
  window.speechSynthesis.cancel();
  killRecognition();
  isPaused          = false;
  currentStep       = -1;
  waitingForStudent = false;
  answerAccepted    = false;
  repeatBtn.style.display = "none";
  pauseBtn.style.display  = "none";
  resumeBtn.style.display = "none";
  setResult("", "");
  studentTranscript.textContent = "Klicke auf „Start" und sprich laut.";
  renderDialog();
}

// ============================================================
// INIT
// ============================================================
renderDialog();
</script>
