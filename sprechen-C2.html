<!-- 
  DOŁĄCZ TO DO SWOJEJ LEKCJI 1 
  (Wstaw w miejscu, gdzie chcesz mieć dialog po przeczytaniu treści lekcji)
-->

<div id="dialog-practice" style="
  max-width:1200px; 
  margin:30px auto; 
  background:transparent; 
  padding:0;
  font-family: Arial, sans-serif;
">

  <h2 style="text-align:center; color:#1d4ed8; margin-bottom:10px;">
    🗣️ Dialog wiederholen – laut sprechen
  </h2>
  <p style="text-align:center; color:#0f766e; margin-bottom:25px; font-size:16px;">
    Anna spricht → du siehst den Hinweis → sprich laut auf Deutsch
  </p>

  <!-- ZWEI SPALTEN: LINKS = DIALOG, RECHTS = BILDSCHIRM "du" -->
  <div style="
    display:flex;
    flex-direction:row;
    align-items:stretch;
    justify-content:center;
    gap:24px;
  ">

    <!-- LINKES FENSTER: Dialog + Buttons + Ergebnis -->
    <div style="
      flex:0 0 55%;
      max-width:55%;
      border-radius:20px;
      padding:20px 24px;
      background:white;
      box-shadow:0 8px 25px rgba(0,0,0,0.12);
      box-sizing:border-box;
    ">

      <!-- Dialog-Zeilen -->
      <div id="dialog-lines" style="margin-bottom:20px;"></div>

      <!-- Buttons -->
      <div style="display:flex; justify-content:center; gap:15px; flex-wrap:wrap; margin-bottom:15px;">
        <button onclick="startDialog()" style="
          background:#2563eb; color:white; border:none; 
          border-radius:12px; padding:14px 28px; font-size:17px; cursor:pointer;
        ">
          ▶️ Start
        </button>
        <button onclick="repeatCurrent()" id="repeatBtn" style="
          background:#16a34a; color:white; border:none; 
          border-radius:12px; padding:14px 28px; font-size:17px; cursor:pointer;
          display:none;
        ">
          🔄 <strong style="font-size:18px;">WIEDERHOLEN</strong>
        </button>
        <button onclick="resetDialog()" style="
          background:#ea580c; color:white; border:none; 
          border-radius:12px; padding:14px 28px; font-size:17px; cursor:pointer;
        ">
          ↺ Neustart
        </button>
      </div>

      <!-- Ergebnis -->
      <div id="result-area" style="
        text-align:center; font-size:20px; min-height:50px;
        padding:12px; border-radius:12px; background:#f8fafc;
      "></div>
    </div>

    <!-- RECHTES FENSTER: was du sagst -->
    <div style="
      flex:0 0 45%;
      max-width:45%;
      border-radius:20px;
      padding:20px 24px;
      background:white;
      box-shadow:0 8px 25px rgba(0,0,0,0.12);
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
    ">
      <div style="margin-bottom:10px;">
        <h3 style="margin:0 0 8px; color:#1e3a8a; text-align:center;">
          🎧 Was du sagst
        </h3>
        <p style="margin:0; font-size:14px; color:#4b5563; text-align:center;">
          Deine Wörter werden hier live angezeigt.
        </p>
      </div>
      <div id="student-transcript" style="
        flex:1;
        margin-top:10px; 
        text-align:center; 
        font-size:22px; 
        line-height:1.4;
        padding:18px; 
        border-radius:14px; 
        background:#eef2ff; 
        color:#111827;
        border:2px dashed #93c5fd;
        display:flex;
        align-items:center;
        justify-content:center;
        min-height:160px;
      ">
        Klicke auf „Start“ und sprich laut.
      </div>
    </div>

  </div>
</div>

<script>
// --- DIALOG: Anna + du ---
const dialogSteps = [
  {
    speaker: "Anna",
    text: "Hallo! Wie heißt du?",
    answer: "Ich heiße ...",
    patterns: ["ich heiße", "mein name ist", "ich bin"]
  },
  {
    speaker: "du",
    text: "", 
    hint: "<strong style='font-size:18px;'>WIEDERHOLEN</strong>: Ich heiße ...",
    patterns: ["ich heiße", "mein name ist", "ich bin"]
  },
  {
    speaker: "Anna",
    text: "Guten Tag! Mein Name ist Anna Müller.",
    answer: "Mein Name ist ...",
    patterns: ["mein name ist", "ich heiße"]
  },
  {
    speaker: "du",
    text: "",
    hint: "<strong style='font-size:18px;'>WIEDERHOLEN</strong>: Mein Name ist ...",
    patterns: ["mein name ist", "ich heiße"]
  },
  {
    speaker: "Anna",
    text: "Wie heißen Sie höflich?",
    answer: "Wie heißen Sie?",
    patterns: ["wie heißen sie", "wie heissen sie"]
  },
  {
    speaker: "du",
    text: "",
    hint: "<strong style='font-size:18px;'>WIEDERHOLEN</strong>: Wie heißen Sie?",
    patterns: ["wie heißen sie", "wie heissen sie"]
  },
  {
    speaker: "Anna",
    text: "Auf Wiedersehen!",
    answer: "Auf Wiedersehen!",
    patterns: ["auf wiedersehen", "wiedersehen"]
  },
  {
    speaker: "du",
    text: "",
    hint: "<strong style='font-size:18px;'>WIEDERHOLEN</strong>: Auf Wiedersehen!",
    patterns: ["auf wiedersehen", "wiedersehen"]
  }
];

// tylko linie, gdzie mówi du
const practiceSteps = dialogSteps.filter(step => step.speaker === "du");

let currentStep = 0;
let recognition = null;
let isListening = false;

const linesContainer = document.getElementById("dialog-lines");
const resultArea = document.getElementById("result-area");
const repeatBtn = document.getElementById("repeatBtn");
const studentTranscript = document.getElementById("student-transcript");

// --- Rysowanie dialogu ---
function renderDialog() {
  linesContainer.innerHTML = "";
  
  dialogSteps.forEach((step, idx) => {
    const lineDiv = document.createElement("div");
    lineDiv.style.cssText = `
      display:flex; gap:12px; align-items:flex-start; 
      padding:12px; margin-bottom:8px; border-radius:10px;
      border-bottom:1px solid #eee;
    `;
    
    if (idx === currentStep && step.speaker === "du") {
      lineDiv.style.background = "#fff7d6";
      lineDiv.style.borderLeft = "5px solid #f5b301";
      lineDiv.style.paddingLeft = "15px";
    }

    const nameDiv = document.createElement("div");
    nameDiv.style.cssText = `
      min-width:80px; font-weight:700; color:#0f2f57; font-size:16px;
    `;
    nameDiv.textContent = step.speaker;

    const textDiv = document.createElement("div");
    textDiv.style.cssText = `
      flex:1; font-size:17px; line-height:1.4; color:#111;
    `;
    
    if (step.speaker === "Anna") {
      textDiv.textContent = step.text;
    } else {
      textDiv.innerHTML = step.hint || "";
      textDiv.style.color = "#0b8043";
    }

    lineDiv.appendChild(nameDiv);
    lineDiv.appendChild(textDiv);
    linesContainer.appendChild(lineDiv);
  });
}

// --- Głos: niemiecki ---
function speak(text) {
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "de-DE";
  utterance.rate = 0.92;
  utterance.pitch = 1;

  const voices = window.speechSynthesis.getVoices();
  const deVoice = voices.find(v => 
    v.lang && v.lang.toLowerCase().startsWith("de") && 
    v.name.toLowerCase().includes("de")
  );
  if (deVoice) utterance.voice = deVoice;

  window.speechSynthesis.speak(utterance);
}

// --- Start dialogu ---
function startDialog() {
  currentStep = -1;
  resultArea.textContent = "";
  resultArea.style.background = "#f8fafc";
  repeatBtn.style.display = "none";
  studentTranscript.textContent = "Hör gut zu und sprich danach laut.";
  renderDialog();
  nextAnnaLine();
}

function nextAnnaLine() {
  let nextIdx = currentStep + 1;
  while (nextIdx < dialogSteps.length && dialogSteps[nextIdx].speaker !== "Anna") {
    nextIdx++;
  }

  if (nextIdx >= dialogSteps.length) {
    resultArea.style.background = "#dcfce7";
    resultArea.style.color = "green";
    resultArea.textContent = "✓ Perfekt! Dialog beendet.";
    speak("Herzlichen Glückwunsch! Dialog beendet.");
    repeatBtn.style.display = "none";
    studentTranscript.textContent = "Dialog beendet. Bravo!";
    return;
  }

  currentStep = nextIdx;
  renderDialog();
  
  const annaStep = dialogSteps[currentStep];
  speak(annaStep.text);
  
  setTimeout(() => {
    findAndAskStudent();
  }, 1600);
}

function findAndAskStudent() {
  let studentIdx = currentStep + 1;
  while (studentIdx < dialogSteps.length && dialogSteps[studentIdx].speaker !== "du") {
    studentIdx++;
  }

  if (studentIdx >= dialogSteps.length) {
    nextAnnaLine();
    return;
  }

  currentStep = studentIdx;
  renderDialog();
  
  resultArea.textContent = "🎤 Sprich laut den Satz nach!";
  resultArea.style.background = "#fff7d6";
  repeatBtn.style.display = "inline-block";
  studentTranscript.textContent = "Ich höre...";
  
  startRecognition();
}

// --- Button: WIEDERHOLEN ---
function repeatCurrent() {
  const step = dialogSteps[currentStep];
  if (step && step.hint) {
    const cleanHint = step.hint
      .replace("<strong style='font-size:18px;'>WIEDERHOLEN</strong>:", "")
      .trim();
    speak(cleanHint);
  }
}

// --- Rozpoznawanie mowy z podglądem na żywo ---
function startRecognition() {
  if (isListening) return;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    resultArea.textContent = "❌ Bitte Google Chrome oder Edge für Spracherkennung benutzen.";
    resultArea.style.background = "#fee2e2";
    resultArea.style.color = "#dc2626";
    studentTranscript.textContent = "Dein Browser unterstützt keine Spracherkennung.";
    return;
  }

  recognition = new SR();
  recognition.lang = "de-DE";
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 2;

  isListening = true;

  recognition.onresult = (event) => {
    let transcript = "";
    let finalText = "";
    
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalText = transcript;
      }
    }
    
    studentTranscript.textContent = transcript || "Ich höre...";

    if (finalText.trim()) {
      const step = dialogSteps[currentStep];
      
      if (isCorrect(finalText, step.patterns)) {
        isListening = false;
        resultArea.style.background = "#dcfce7";
        resultArea.style.color = "green";
        resultArea.textContent = `✓ Sehr gut! „${finalText}"`;
        studentTranscript.textContent = "✓ " + finalText;
        speak("Sehr gut!");
        
        setTimeout(() => {
          nextAnnaLine();
        }, 1800);
      } else {
        isListening = false;
        resultArea.style.background = "#fee2e2";
        resultArea.style.color = "#dc2626";
        resultArea.textContent = `✗ Nicht ganz: „${finalText}". Noch einmal!`;
        studentTranscript.textContent = "✗ " + finalText;
        speak("Bitte versuche es noch einmal.");
        
        setTimeout(() => {
          studentTranscript.textContent = "Sprich den Satz noch einmal.";
        }, 1500);
      }
    }
  };

  recognition.onerror = () => {
    isListening = false;
    resultArea.style.background = "#fee2e2";
    resultArea.style.color = "#dc2626";
    resultArea.textContent = "✗ Nicht erkannt. Noch einmal versuchen.";
    studentTranscript.textContent = "Fehler bei der Erkennung. Noch einmal.";
  };

  recognition.onend = () => {
    isListening = false;
    if (!studentTranscript.textContent || studentTranscript.textContent === "Ich höre...") {
      studentTranscript.textContent = "Nicht gehört. Noch einmal sprechen.";
    }
  };

  recognition.start();
}

// --- Sprawdzenie poprawności odpowiedzi ---
function isCorrect(answer, patterns) {
  const normalized = answer.toLowerCase()
    .replace(/[.,!?¡¿]/g, "")
    .trim();

  for (let pattern of patterns) {
    const normalizedPattern = pattern.toLowerCase()
      .replace(/[.,!?¡¿]/g, "")
      .trim();
    
    if (normalized.includes(normalizedPattern)) {
      return true;
    }
  }
  return false;
}

// --- Neustart ---
function resetDialog() {
  window.speechSynthesis.cancel();
  if (recognition) recognition.abort();
  isListening = false;
  studentTranscript.textContent = "Klicke auf „Start“ und sprich laut.";
  startDialog();
}

// --- Inicjalizacja głosu ---
window.speechSynthesis.onvoiceschanged = () => {};
renderDialog();
</script>
