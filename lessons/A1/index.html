body{

/* ===== GÓRNE PRZYCISKI ===== */

.top-bar{
    width:900px;
    max-width:100%;
    margin:0 auto 35px;

    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.top-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:14px 30px;

    border-radius:999px;
    text-decoration:none;

    font-size:22px;
    font-weight:800;

    transition:.25s;
}

/* A-Z */

.aza-btn{
    background:#1d3557;
    color:#ffce00;
    border:3px solid #ffce00;
}

.aza-btn:hover{
    background:#274c77;
    color:white;
    transform:translateY(-3px) scale(1.05);
}

/* Sprich nach */

.sprich-btn{
    background:#2563eb;
    color:white;
    border:3px solid #60a5fa;
}

.sprich-btn:hover{
    background:#1d4ed8;
    transform:translateY(-3px) scale(1.05);
}

/* Aktiv trainieren */

.train-btn{
    background:#16a34a;
    color:white;
    border:3px solid #4ade80;
}

.train-btn:hover{
    background:#15803d;
    transform:translateY(-3px) scale(1.05);
}

/* ===== TYTUŁ ===== */

h1{
    margin-bottom:35px;
    font-size:44px;
}

/* ===== PRZYCISKI LEKCJI ===== */

.lesson-list{

    width:900px;
    max-width:100%;
    margin:0 auto 45px;

    display:grid;
    grid-template-columns:repeat(10,1fr);

    gap:12px;
}

.lesson-link{

    display:flex;
    justify-content:center;
    align-items:center;

    width:64px;
    height:48px;

    margin:auto;

    background:#1f2937;
    color:#34d399;

    border:2px solid #34d399;
    border-radius:14px;

    text-decoration:none;

    font-size:19px;
    font-weight:bold;

    transition:.2s;
}

.lesson-link:hover{

    background:#022c22;
    transform:scale(1.08);
}

/* ===== SPIS TREŚCI ===== */

.info{

    width:900px;
    max-width:100%;

    margin:0 auto;

    padding:28px;

    background:#111827;

    border-radius:18px;

    line-height:1.9;
    font-size:18px;

    text-align:left;
}

.info h2{

    margin-top:0;
    margin-bottom:18px;

    color:#60a5fa;
}

/* ===== DOLNE LINKI ===== */

.back-links{

    margin-top:45px;
    margin-bottom:10px;

    font-size:18px;
}

.back-links a{

    color:#93c5fd;
    text-decoration:none;
    margin:0 10px;
}

.back-links a:hover{

    text-decoration:underline;
}

/* ===== TELEFON ===== */

@media (max-width:950px){

    .lesson-list{
        grid-template-columns:repeat(5,1fr);
    }

}

@media (max-width:600px){

    body{
        padding:25px 10px;
    }

    h1{
        font-size:36px;
    }

    .lesson-list{
        grid-template-columns:repeat(4,1fr);
    }

    .lesson-link{
        width:56px;
        height:44px;
    }

    .top-btn{
        width:100%;
        max-width:320px;
    }

    .info{
        font-size:17px;
    }

}
