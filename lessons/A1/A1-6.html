<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutschkurs A1 — Spis treści i Lektion 12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito+Sans:opsz,wght@6..12,400,600,700,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#20324a;
    --bg-soft:#27405c;
    --paper:#fbf6ec;
    --ink:#23332e;
    --chalk:#1d2b39;
    --chalk-light:#2a3b50;
    --gold:#f4c95d;
    --green:#8bd17c;
    --blue:#72b8ff;
    --pink:#f08bb4;
    --orange:#f29f67;
    --line:rgba(35,51,46,.18);
    --text:#111820;
    --text-light:#2a3b50;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 12% 10%, rgba(255,255,255,.05), transparent 35%),
      radial-gradient(circle at 88% 90%, rgba(255,255,255,.05), transparent 40%);
    color:var(--text);
    font-family:"Nunito Sans",sans-serif;
    line-height:1.6;
    padding:0 0 60px;
  }

  .course-nav{
    max-width:880px;
    margin:40px auto 60px;
    padding:0 20px;
  }

  .course-nav-title{
    font-family:"Kalam",cursive;
    font-size:2.2rem;
    margin:0 0 24px;
    color:#111820;
    text-align:center;
  }

  .course-section{
    background:#f7f9fc;
    border:1px solid #dce3ed;
    border-radius:18px;
    padding:16px 18px 14px;
    margin-bottom:16px;
  }

  .section-title{
    font-family:"JetBrains Mono",monospace;
    font-size:1rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#111820;
    margin:0 0 12px;
  }

  .lesson-list{
    list-style:none;
    padding:0;
    margin:0;
    display:grid;
    gap:8px;
  }

  .lesson-list a{
    display:block;
    color:#111820;
    text-decoration:none;
    padding:10px 12px;
    border-radius:12px;
    background:#ffffff;
    border:1px solid #dce3ed;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }

  .lesson-list a:hover{
    background:#f0f4f8;
    border-color:#f4c95d;
    transform:translateX(4px);
    color:#0a1220;
  }

  section[id^="lektion"]{
    scroll-margin-top:40px;
  }

  .wrap{
    max-width:980px;
    margin:0 auto;
    padding:32px 20px 0;
  }

  header.hero{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:28px;
    padding:24px 0 36px;
    border-bottom:2px dashed rgba(35,51,46,.18);
    margin-bottom:36px;
  }

  .hero-text{flex:1 1 340px;}

  .eyebrow{
    font-family:"JetBrains Mono", monospace;
    letter-spacing:.16em;
    text-transform:uppercase;
    font-size:.78rem;
    color:#f4c95d;
    margin:0 0 10px;
  }

  h1.lesson-title{
    font-family:"Kalam",cursive;
    font-weight:700;
    font-size:2.7rem;
    line-height:1.12;
    margin:0 0 14px;
    color:#111820;
  }

  .hero-text p{
    margin:0;
    color:#2a3b50;
    max-width:52ch;
  }

  .topics{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:18px;
  }

  .topics span{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#f0f4f8;
    border:1px solid #dce3ed;
    border-radius:999px;
    padding:7px 12px;
    font-size:.92rem;
    color:#111820;
  }

  .wheel-box{
    flex:0 1 320px;
    display:grid;
    place-items:center;
  }

  .wheel-box svg{
    width:100%;
    height:auto;
    max-width:320px;
    filter:drop-shadow(0 16px 30px rgba(0,0,0,.18));
  }

  .ring-seg{
    stroke:rgba(255,255,255,.14);
    stroke-width:2;
  }

  .ring-spring{fill:#5ca75b;}
  .ring-summer{fill:#d9b24c;}
  .ring-autumn{fill:#cf6b35;}
  .ring-winter{fill:#4f86b8;}

  .season-label,.month-label,.center-label,.center-sub{
    fill:#111820;
    font-family:"JetBrains Mono", monospace;
    text-anchor:middle;
  }

  .season-label{font-size:14px;font-weight:600;}
  .month-label{font-size:13px;opacity:.95;}
  .month-label.now{font-size:14px;font-weight:700;fill:#f4c95d;}
  .center-label{font-size:18px;font-weight:700;}
  .center-sub{font-size:13px;opacity:.9;}
  .now-marker{fill:#f4c95d;stroke:#20324a;stroke-width:2;}

  .part{margin:34px 0 42px;}
  .part-head{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:12px;
    margin-bottom:14px;
  }

  .part-num{
    font-family:"JetBrains Mono", monospace;
    font-size:.82rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#f4c95d;
  }

  .part-title{
    font-family:"Kalam",cursive;
    font-size:2rem;
    margin:0;
    color:#111820;
  }

  .card{
    background:#f7f9fc;
    border:1px solid #dce3ed;
    border-radius:22px;
    padding:22px 22px 20px;
    box-shadow:0 12px 30px rgba(0,0,0,.06);
    margin-top:14px;
  }

  .lead{font-size:1.04rem;color:#111820;}

  .label{
    display:inline-block;
    font-family:"JetBrains Mono", monospace;
    font-size:.74rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#f4c95d;
    margin-bottom:8px;
  }

  .vocab-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:12px;
    margin-top:16px;
  }

  .hobby-card{
    background:#ffffff;
    border:1px solid #dce3ed;
    border-radius:18px;
    padding:14px;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    min-height:112px;
  }

  .hobby-card:hover{
    transform:translateY(-2px);
    border-color:#f4c95d;
    background:#f9fbff;
  }

  .hobby-card h4{margin:0 0 6px;font-size:1.1rem;color:#111820;}
  .hobby-card p{margin:0;color:#2a3b50;font-size:.95rem;}
  .hobby-card .example{
    margin-top:8px;
    color:#b8860b;
    font-weight:700;
    display:none;
  }

  .hobby-card.show .example{display:block;}

  .grammar-box{
    background:#f9fbff;
    border-left:4px solid #f4c95d;
    border-radius:16px;
    padding:14px 16px;
    margin:16px 0;
  }

  .scale{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:10px;
    margin-top:14px;
  }

  .scale-item{
    background:#ffffff;
    border:1px solid #dce3ed;
    border-radius:14px;
    padding:12px;
  }

  .scale-item b{
    display:block;
    color:#b8860b;
    margin-bottom:4px;
  }

  .qa{
    display:grid;
    gap:10px;
    margin-top:16px;
  }

  .q,.a{
    padding:12px 14px;
    border-radius:14px;
  }

  .q{
    background:#e8f3ff;
    border:1px solid #d0e3ff;
    color:#111820;
  }

  .a{
    background:#e8f9e8;
    border:1px solid #d0e8d0;
    color:#111820;
  }

  .exercise-list{padding-left:18px;}
  .exercise-list li{margin:10px 0;}

  input[type="text"]{
    background:#f9fbff;
    color:#1d2b39;
    border:1px solid #dce3ed;
    border-radius:12px;
    padding:9px 10px;
    font:inherit;
    min-width:180px;
    vertical-align:middle;
  }

  .feedback{
    display:inline-block;
    min-width:22px;
    font-weight:800;
    margin-left:8px;
  }

  .ok{color:#2e7d32;}
  .no{color:#c62828;}

  .check-btn{
    margin-top:12px;
    background:linear-gradient(135deg,#f4c95d,#ffd976);
    color:#1d2b39;
    border:0;
    border-radius:999px;
    padding:11px 18px;
    font-weight:800;
    cursor:pointer;
  }

  .check-btn:hover{filter:brightness(1.03);}
  .exercise-result{margin-top:10px;font-weight:700;color:#111820;}

  .verb-boxes{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:12px;
    margin-top:14px;
  }

  .verb-box{
    background:#ffffff;
    border:1px solid #dce3ed;
    border-radius:16px;
    padding:14px;
  }

  .split-demo{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:14px;
  }

  .demo{
    background:#ffffff;
    border:1px solid #dce3ed;
    border-radius:16px;
    padding:14px;
  }

  .demo h4{margin:0 0 8px;color:#111820;}

  .quiz-q{
    background:#ffffff;
    border:1px solid #dce3ed;
    border-radius:16px;
    padding:14px;
    margin:12px 0;
  }

  .quiz-options{
    display:grid;
    gap:8px;
  }

  .quiz-options label{
    display:block;
    background:#f9fbff;
    border-radius:12px;
    padding:10px 12px;
    border:1px solid #dce3ed;
    color:#111820;
  }

  .quiz-options label.correct{
    border-color:#2e7d32;
    background:#e8f9e8;
  }

  .quiz-options label.incorrect{
    border-color:#c62828;
    background:#f9e8e8;
  }

  .dialog{display:grid;gap:10px;}
  .bubble{
    padding:12px 14px;
    border-radius:18px;
    max-width:86%;
    color:#111820;
  }

  .marta{background:#f0f4f8;}
  .tom{background:#fff8e1;margin-left:auto;}

  .speaker{
    display:block;
    font-family:"JetBrains Mono",monospace;
    font-size:.76rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#b8860b;
    margin-bottom:4px;
  }

  .summary-grid{display:grid;gap:12px;}

  .row{
    display:grid;
    grid-template-columns:180px 1fr;
    gap:14px;
    align-items:start;
    padding:12px 14px;
    background:#ffffff;
    border:1px solid #dce3ed;
    border-radius:14px;
  }

  .key{font-weight:800;color:#b8860b;}

  .lesson-nav{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    border-top:2px dashed rgba(35,51,46,.18);
    padding-top:24px;
    margin-top:10px;
    font-family:"JetBrains Mono", monospace;
    font-size:.9rem;
  }

  .lesson-nav a{
    color:#111820;
    text-decoration:none;
    border:1px solid #dce3ed;
    border-radius:999px;
    padding:8px 16px;
    transition:background .15s ease,border-color .15s ease;
    background:#ffffff;
  }

  .lesson-nav a:hover{
    background:#f0f4f8;
    border-color:#f4c95d;
    color:#0a1220;
  }

  .übung-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(135deg,#72b8ff,#a0d4ff);
    color:#1d3557;
    border:0;
    border-radius:999px;
    padding:14px 28px;
    font-weight:800;
    font-size:1.05rem;
    cursor:pointer;
    margin:24px auto 0;
    text-decoration:none;
    transition:transform .15s ease, filter .15s ease;
  }

  .übung-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.05);
  }

  .back-to-top{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:#ffffff;
    color:#111820;
    border:1px solid #dce3ed;
    border-radius:999px;
    padding:12px 26px;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    margin:20px auto 0;
    text-decoration:none;
    transition:background .15s ease, border-color .15s ease;
  }

  .back-to-top:hover{
    background:#f0f4f8;
    border-color:#f4c95d;
  }

  a:focus-visible,button:focus-visible,input:focus-visible{
    outline:3px solid #f4c95d;
    outline-offset:2px;
  }

  @media (max-width:720px){
    h1.lesson-title{font-size:2.2rem;}
    .part-title{font-size:1.7rem;}
    .row{grid-template-columns:1fr;}
    .split-demo{grid-template-columns:1fr;}
    .bubble{max-width:100%;}
  }
  .top-bar{
    max-width:880px;
    margin:20px auto 0;
    padding:0 20px;
    display:flex;
}

.aza1-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    background:#1d3557;
    color:#ffce00;

    border:3px solid #ffce00;
    border-radius:999px;

    padding:14px 28px;

    font-size:30px;
    font-weight:900;

    text-decoration:none;

    box-shadow:0 8px 20px rgba(0,0,0,.35);

    transition:0.3s;
}

.aza1-btn:hover{
    background:#274c77;
    color:white;
    transform:translateY(-3px) scale(1.05);
}
  /* Specjalny kolor tła dla Lektion 14 */
#lektion14 .wrap{
  background:linear-gradient(135deg,#f0f4f8,#e8f3ff);
  border-radius:22px;
  padding:32px;
  margin:0 auto;
}

#lektion14 .card{
  background:#ffffff;
  border:1px solid #d0e3ff;
}
  /* Specjalny kolor tła dla Lektion 12 */
#lektion12 .wrap{
  background:linear-gradient(135deg,#fffdf6,#fff6df);
  border-radius:22px;
  padding:32px;
  margin:0 auto;
}

#lektion12 .card{
  background:#ffffff;
  border:1px solid #f3e8d4;
}
</style>
</head>
<body>

  <a href="A-Z-A1.html" class="aza1-btn">A-Z</a>
</div>

    <ul class="lesson-list">
      <li><a href="#lektion28">Lektion 28 — Große Wiederholung I</a></li>
      <li><a href="#lektion29">Lektion 29 — Große Wiederholung II</a></li>
      <li><a href="#lektion30">Lektion 30 — Prüfungsvorbereitung</a></li>
    </ul>
  </div>
</nav>
</div>
</section>
