<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deutsch A1 – Lektion 1</title>

<style>

body{

font-family: Arial, sans-serif;

background: linear-gradient(135deg,#dbeafe,#fef9c3);

margin:0;

padding:20px;

}

.container{

max-width:800px;

margin:auto;

background:white;

border-radius:20px;

padding:30px;

box-shadow:0 8px 20px rgba(0,0,0,0.2);

}

h1{

text-align:center;

color:#1d4ed8;

}

.lesson{

text-align:center;

color:#0f766e;

font-size:20px;

margin-bottom:20px;

}

#question{

background:#eff6ff;

padding:20px;

border-radius:15px;

font-size:28px;

text-align:center;

margin:20px 0;

color:#1e3a8a;

}

#result{

font-size:24px;

text-align:center;

min-height:40px;

margin:20px;

}

.correct{

color:green;

}

.wrong{

color:red;

}

#transcript{

background:#f8fafc;

padding:15px;

border-radius:10px;

min-height:30px;

margin-top:20px;

}

.buttons{

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

margin-top:25px;

}

button{

border:none;

border-radius:12px;

padding:15px 25px;

font-size:18px;

cursor:pointer;

}

.listen{

background:#2563eb;

color:white;

}

.speak{

background:#16a34a;

color:white;

}

.restart{

background:#ea580c;

color:white;

}

.progress{

text-align:center;

font-size:18px;

margin-top:20px;

}

</style>

</head>

<body>

<div class="container">

<h1>Deutsch A1</h1>

<div class="lesson">

Lektion 1 – Guten Tag!

</div>

<div class="progress" id="progress"></div>

<div id="question"></div>

<div class="buttons">

<button class="listen" onclick="playQuestion()">

🔊 Frage hören

</button>

<button class="speak" onclick="startRecognition()">

🎤 Antworten

</button>

<button class="restart" onclick="restartLesson()">

↺ Neustart

</button>

</div>

<div id="transcript"></div>

<div id="result"></div>

</div>

<script>

const steps = [

{

question: "Sage: Guten Morgen.",

patterns: [

"guten morgen"

]

},

{

question: "Sage: Hallo.",

patterns: [

"hallo"

]

},

{

question: "Stelle dich vor.",

patterns: [

"ich heiße",

"mein name ist",

"ich bin"

]

},

{

question: "Frage: Wie heißt du?",

patterns: [

"wie heißt du",

"wie heisst du"

]

},

{

question: "Frage höflich: Wie heißen Sie?",

patterns: [

"wie heißen sie",

"wie heissen sie"

]

},

{

question: "Sage das deutsche Alphabet.",

patterns: [

"a b c",

"a, b, c",

"ah beh tse"

]

},

{

question: "Verabschiede dich.",

patterns: [

"tschüss",

"tschüss!",

"auf wiedersehen"

]

}

];

let currentStep = 0;

const questionEl = document.getElementById("question");

const resultEl = document.getElementById("result");

const transcriptEl = document.getElementById("transcript");

const progressEl = document.getElementById("progress");

function updateScreen(){

questionEl.textContent = steps[currentStep].question;

progressEl.textContent =

"Aufgabe " + (currentStep+1) +

" von " + steps.length;

resultEl.textContent = "";

transcriptEl.textContent = "";

}

function speak(text){

const utterance = new SpeechSynthesisUtterance(text);

utterance.lang = "de-DE";

utterance.rate = 0.9;

speechSynthesis.speak(utterance);

}

function playQuestion(){

speak(steps[currentStep].question);

}

function normalize(text){

return text

.toLowerCase()

.replace(/[.,!?]/g,"")

.trim();

}

function isCorrect(answer){

answer = normalize(answer);

for(let pattern of steps[currentStep].patterns){

if(answer.includes(normalize(pattern))){

return true;

}

}

return false;

}

function success(){

resultEl.className = "correct";

resultEl.textContent = "✓ Sehr gut!";

speak("Sehr gut!");

setTimeout(()=>{

currentStep++;

if(currentStep >= steps.length){

questionEl.textContent =

"Herzlichen Glückwunsch! Du hast die Lektion geschafft.";

progressEl.textContent = "";

resultEl.className = "correct";

resultEl.textContent = "Lektion beendet.";

speak("Herzlichen Glückwunsch. Du hast die Lektion geschafft.");

return;

}

updateScreen();

},2000);

}

function fail(){

resultEl.className = "wrong";

resultEl.textContent = "✗ Bitte versuche es noch einmal.";

speak("Bitte versuche es noch einmal.");

}

function startRecognition(){

const SpeechRecognition =

window.SpeechRecognition ||

window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Diese Funktion funktioniert in Google Chrome.");

return;

}

const recognition = new SpeechRecognition();

recognition.lang = "de-DE";

recognition.interimResults = false;

recognition.maxAlternatives = 3;

recognition.start();

recognition.onresult = function(event){

let answer =

event.results[0][0].transcript;

transcriptEl.textContent =

"Du: " + answer;

if(isCorrect(answer)){

success();

}else{

fail();

}

};

recognition.onerror = function(){

fail();

};

}

function restartLesson(){

speechSynthesis.cancel();

currentStep = 0;

updateScreen();

speak("Willkommen zur ersten Lektion.");

}

updateScreen();

speak("Willkommen zur ersten Lektion.");

</script>

</body>

</html>
