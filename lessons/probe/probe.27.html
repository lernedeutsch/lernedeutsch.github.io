<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Informell oder formell?</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
  rel="stylesheet"
>

<style>
:root{
  --background:#16233a;
  --paper:#fff5e6;
  --paper-light:#fffdf7;

  --text:#1c2430;
  --muted:#5e6875;

  --line:#e3d6b8;
  --gold:#cf9f3f;
  --green:#4f7a63;

  --success:#16864b;
  --success-light:#e8f8ef;

  --error:#c53d3d;
  --error-light:#fff0f0;

  --shadow:0 20px 55px rgba(0,0,0,.22);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:145vh;
  margin:0;
  padding:75px 20px 130px;

  color:var(--text);

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(207,159,63,.08),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(79,122,99,.1),
      transparent 40%
    ),
    var(--background);

  font:400 1rem/1.6 "Nunito Sans",sans-serif;
}

button{
  font:inherit;
}


/* ==================================================
   PASEK POSTĘPU
================================================== */

.progress-bar-container{
  position:fixed;
  z-index:1000;
  top:0;
  left:0;

  width:100%;
  height:7px;

  background:rgba(255,255,255,.17);
}

.progress-bar{
  width:0;
  height:100%;

  background:linear-gradient(
    90deg,
    #f4c95d,
    #ffad42
  );

  box-shadow:0 0 12px rgba(244,201,93,.5);

  transition:width .08s linear;
}


/* ==================================================
   GŁÓWNY OBSZAR
================================================== */

.page-wrapper{
  width:min(980px,100%);
  margin:0 auto;
}

.exercise-card{
  padding:34px;

  background:linear-gradient(
    145deg,
    #fff8e9,
    #f5e6c7
  );

  border:1px solid rgba(255,255,255,.4);
  border-radius:26px;

  box-shadow:var(--shadow);
}


/* ==================================================
   PRZYCISK ODCZYTYWANIA
================================================== */

.read-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  min-height:50px;
  margin:0 0 34px;
  padding:10px 22px;

  color:#ffffff;

  background:linear-gradient(
    180deg,
    #5e8d72,
    #3f6c56
  );

  border:1px solid #315b47;
  border-radius:999px;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 8px 17px rgba(49,91,71,.22),
    inset 0 1px 0 rgba(255,255,255,.25);

  transition:
    transform .16s,
    filter .16s,
    box-shadow .16s;
}

.read-button:hover{
  transform:translateY(-2px);
  filter:brightness(1.06);

  box-shadow:
    0 11px 22px rgba(49,91,71,.27),
    inset 0 1px 0 rgba(255,255,255,.3);
}

.read-button.is-speaking{
  background:#315f4c;
}


/* ==================================================
   NAGŁÓWEK
================================================== */

.exercise-title{
  margin:0 0 20px;

  color:var(--text);

  font:700 2rem/1.25 "Fraunces",serif;
}

.exercise-instruction{
  margin:0 0 28px;

  color:#293443;
  font-size:1.25rem;
}


/* ==================================================
   WIERSZE ĆWICZENIA
================================================== */

.matching-list{
  display:grid;
  gap:13px;
}

.match-row{
  display:flex;
  align-items:center;
  gap:18px;

  min-height:88px;
  padding:15px 18px;

  background:rgba(255,255,255,.93);
  border:2px solid var(--line);
  border-radius:20px;

  transition:
    border-color .18s,
    background .18s,
    box-shadow .18s,
    transform .18s;
}

.match-row:hover{
  border-color:#d4bd84;

  box-shadow:0 8px 18px rgba(77,60,30,.08);
}

.match-row.correct-row{
  background:var(--success-light);
  border-color:#78bf95;
}

.match-sentence{
  flex:1 1 auto;

  font-size:1.22rem;
  font-weight:800;
}

.match-buttons{
  display:flex;
  flex:0 0 auto;
  gap:10px;
}

.choice-button{
  min-width:112px;
  min-height:45px;
  padding:8px 16px;

  color:var(--text);

  background:#fbf5e8;
  border:2px solid var(--line);
  border-radius:999px;

  font-weight:800;

  cursor:pointer;

  transition:
    transform .15s,
    background .15s,
    border-color .15s,
    color .15s;
}

.choice-button:hover:not(:disabled){
  background:#fffaf0;
  border-color:var(--gold);
  transform:translateY(-2px);
}

.choice-button.correct{
  color:#0f6838;

  background:var(--success-light);
  border-color:#65b786;
}

.choice-button.wrong{
  color:#9c2929;

  background:var(--error-light);
  border-color:#e79a9a;

  animation:wrongShake .28s ease;
}

.choice-button:disabled{
  cursor:default;
}

@keyframes wrongShake{
  0%,100%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-5px);
  }

  75%{
    transform:translateX(5px);
  }
}


/* ==================================================
   INFORMACJA ZWROTNA
================================================== */

.row-feedback{
  flex-basis:100%;

  min-height:0;
  margin:0;

  font-size:.92rem;
  font-weight:800;
}

.row-feedback.success{
  color:var(--success);
}

.row-feedback.error{
  color:var(--error);
}


/* ==================================================
   WYNIK
================================================== */

.result-area{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:18px;

  margin-top:25px;
  padding:18px 20px;

  background:rgba(255,255,255,.7);
  border:1px solid var(--line);
  border-radius:18px;
}

.score{
  margin:0;

  font:600 1rem "JetBrains Mono",monospace;
}

.score strong{
  font-size:1.18rem;
}

.reset-button{
  min-height:44px;
  padding:9px 18px;

  color:#ffffff;

  background:#20324a;
  border:1px solid #20324a;
  border-radius:999px;

  font-weight:800;

  cursor:pointer;

  transition:
    transform .15s,
    filter .15s;
}

.reset-button:hover{
  transform:translateY(-2px);
  filter:brightness(1.1);
}


/* ==================================================
   KOMUNIKAT KOŃCOWY
================================================== */

.completion-message{
  min-height:30px;
  margin:18px 0 0;

  color:var(--success);
  text-align:center;

  font-size:1.05rem;
  font-weight:800;
}


/* ==================================================
   DOSTĘPNOŚĆ
================================================== */

button:focus-visible{
  outline:3px solid #f4c95d;
  outline-offset:3px;
}


/* ==================================================
   WERSJA MOBILNA
================================================== */

@media (max-width:720px){

  body{
    padding:48px 12px 100px;
  }

  .exercise-card{
    padding:23px 15px;
    border-radius:20px;
  }

  .exercise-title{
    font-size:1.65rem;
  }

  .exercise-instruction{
    font-size:1.05rem;
  }

  .match-row{
    align-items:flex-start;
    flex-direction:column;

    min-height:0;
    padding:16px;
  }

  .match-sentence{
    font-size:1.08rem;
  }

  .match-buttons{
    width:100%;
  }

  .choice-button{
    flex:1 1 0;
    min-width:0;
  }

  .read-button{
    width:100%;
  }

  .result-area{
    align-items:stretch;
    flex-direction:column;
  }

  .reset-button{
    width:100%;
  }

}


@media (max-width:390px){

  .match-buttons{
    display:grid;
    grid-template-columns:1fr;
  }

}


@media (prefers-reduced-motion:reduce){

  html{
    scroll-behavior:auto;
  }

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }

}
</style>
</head>

<body>

<!-- ==================================================
     PASEK POSTĘPU
================================================== -->

<div
  class="progress-bar-container"
  aria-hidden="true"
>
  <div
    class="progress-bar"
    id="pageProgress"
  ></div>
</div>


<main class="page-wrapper">

  <section class="exercise-card">

    <button
      type="button"
      class="read-button"
      id="readSentences"
    >
      <span aria-hidden="true">🔊</span>
      Dialog vorlesen
    </button>


    <h1 class="exercise-title">
      Informell oder formell?
    </h1>

    <p class="exercise-instruction">
      Ordnen Sie die Sätze richtig zu.
    </p>


    <div
      class="matching-list"
      id="matchingList"
    >

      <!-- ZDANIE 1 -->

      <div
        class="match-row"
        data-answer="informell"
        data-sentence="Wie heißt du?"
      >

        <span class="match-sentence">
          Wie heißt du?
        </span>

        <div class="match-buttons">

          <button
            type="button"
            class="choice-button"
            data-choice="informell"
          >
            Informell
          </button>

          <button
            type="button"
            class="choice-button"
            data-choice="formell"
          >
            Formell
          </button>

        </div>

        <p
          class="row-feedback"
          aria-live="polite"
        ></p>

      </div>


      <!-- ZDANIE 2 -->

      <div
        class="match-row"
        data-answer="formell"
        data-sentence="Wie heißen Sie?"
      >

        <span class="match-sentence">
          Wie heißen Sie?
        </span>

        <div class="match-buttons">

          <button
            type="button"
            class="choice-button"
            data-choice="informell"
          >
            Informell
          </button>

          <button
            type="button"
            class="choice-button"
            data-choice="formell"
          >
            Formell
          </button>

        </div>

        <p
          class="row-feedback"
          aria-live="polite"
        ></p>

      </div>


      <!-- ZDANIE 3 -->

      <div
        class="match-row"
        data-answer="formell"
        data-sentence="Mein Name ist Anna Müller."
      >

        <span class="match-sentence">
          Mein Name ist Anna Müller.
        </span>

        <div class="match-buttons">

          <button
            type="button"
            class="choice-button"
            data-choice="informell"
          >
            Informell
          </button>

          <button
            type="button"
            class="choice-button"
            data-choice="formell"
          >
            Formell
          </button>

        </div>

        <p
          class="row-feedback"
          aria-live="polite"
        ></p>

      </div>


      <!-- ZDANIE 4 -->

      <div
        class="match-row"
        data-answer="informell"
        data-sentence="Hallo! Ich bin Max."
      >

        <span class="match-sentence">
          Hallo! Ich bin Max.
        </span>

        <div class="match-buttons">

          <button
            type="button"
            class="choice-button"
            data-choice="informell"
          >
            Informell
          </button>

          <button
            type="button"
            class="choice-button"
            data-choice="formell"
          >
            Formell
          </button>

        </div>

        <p
          class="row-feedback"
          aria-live="polite"
        ></p>

      </div>

    </div>


    <div class="result-area">

      <p class="score">
        Richtig zugeordnet:
        <strong>
          <span id="correctScore">0</span>
          /
          <span id="maximumScore">4</span>
        </strong>
      </p>

      <button
        type="button"
        class="reset-button"
        id="resetExercise"
      >
        Übung wiederholen
      </button>

    </div>


    <p
      class="completion-message"
      id="completionMessage"
      aria-live="polite"
    ></p>

  </section>

</main>


<script>
"use strict";


/* ==================================================
   ELEMENTY
================================================== */

const pageProgress =
  document.getElementById("pageProgress");

const matchingRows = [
  ...document.querySelectorAll(".match-row")
];

const correctScoreElement =
  document.getElementById("correctScore");

const maximumScoreElement =
  document.getElementById("maximumScore");

const completionMessage =
  document.getElementById("completionMessage");

const readSentencesButton =
  document.getElementById("readSentences");

const resetExerciseButton =
  document.getElementById("resetExercise");


let correctScore = 0;
let germanVoice = null;
let speechSessionId = 0;


/* ==================================================
   PASEK POSTĘPU
================================================== */

function updatePageProgress(){

  const scrollableHeight =
    document.documentElement.scrollHeight -
    window.innerHeight;

  if(scrollableHeight <= 0){

    pageProgress.style.width = "100%";
    return;

  }

  const currentScroll =
    window.scrollY ||
    document.documentElement.scrollTop;

  const progress =
    Math.min(
      100,
      Math.max(
        0,
        currentScroll / scrollableHeight * 100
      )
    );

  pageProgress.style.width =
    `${progress}%`;

}


window.addEventListener(
  "scroll",
  updatePageProgress,
  {
    passive:true
  }
);

window.addEventListener(
  "resize",
  updatePageProgress
);

updatePageProgress();


/* ==================================================
   NIEMIECKI GŁOS
================================================== */

function loadGermanVoice(){

  if(!("speechSynthesis" in window)){
    return;
  }

  const voices =
    window.speechSynthesis.getVoices();

  germanVoice =
    voices.find(voice =>
      voice.lang?.toLowerCase() === "de-de" &&
      voice.name?.toLowerCase().includes("google")
    ) ||

    voices.find(voice =>
      voice.lang?.toLowerCase() === "de-de"
    ) ||

    voices.find(voice =>
      voice.lang?.toLowerCase().startsWith("de")
    ) ||

    null;

}


loadGermanVoice();


if("speechSynthesis" in window){

  window.speechSynthesis.addEventListener(
    "voiceschanged",
    loadGermanVoice
  );

}


function stopSpeech(){

  speechSessionId += 1;

  if("speechSynthesis" in window){
    window.speechSynthesis.cancel();
  }

  readSentencesButton.classList.remove(
    "is-speaking"
  );

}


function speakGerman(text, options = {}){

  return new Promise(resolve=>{

    if(
      !text ||
      !("speechSynthesis" in window)
    ){
      resolve(false);
      return;
    }

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "de-DE";
    utterance.rate = options.rate ?? 0.88;
    utterance.pitch = options.pitch ?? 1;
    utterance.volume = 1;

    if(germanVoice){
      utterance.voice = germanVoice;
    }

    utterance.onend = ()=>{
      resolve(true);
    };

    utterance.onerror = event=>{

      if(event.error !== "canceled"){

        console.error(
          "Fehler bei der Sprachausgabe:",
          event.error
        );

      }

      resolve(false);

    };

    window.speechSynthesis.speak(utterance);

  });

}


function wait(milliseconds){

  return new Promise(resolve=>{

    window.setTimeout(
      resolve,
      milliseconds
    );

  });

}


/* ==================================================
   ODCZYTYWANIE WSZYSTKICH ZDAŃ
================================================== */

readSentencesButton.addEventListener(
  "click",
  async()=>{

    stopSpeech();

    const currentSession =
      speechSessionId;

    readSentencesButton.classList.add(
      "is-speaking"
    );

    for(const row of matchingRows){

      if(currentSession !== speechSessionId){
        break;
      }

      row.style.transform =
        "scale(1.015)";

      row.style.borderColor =
        "#cf9f3f";

      await speakGerman(
        row.dataset.sentence,
        {
          rate:.86
        }
      );

      row.style.transform = "";
      row.style.borderColor = "";

      if(currentSession !== speechSessionId){
        break;
      }

      await wait(220);

    }

    readSentencesButton.classList.remove(
      "is-speaking"
    );

  }
);


/* ==================================================
   SPRAWDZANIE ODPOWIEDZI
================================================== */

matchingRows.forEach(row=>{

  const correctAnswer =
    row.dataset.answer;

  const buttons = [
    ...row.querySelectorAll(".choice-button")
  ];

  const feedback =
    row.querySelector(".row-feedback");


  buttons.forEach(button=>{

    button.addEventListener(
      "click",
      async()=>{

        if(row.dataset.solved === "true"){
          return;
        }

        stopSpeech();

        buttons.forEach(item=>{
          item.classList.remove(
            "wrong"
          );
        });

        feedback.classList.remove(
          "success",
          "error"
        );


        const selectedAnswer =
          button.dataset.choice;

        const isCorrect =
          selectedAnswer === correctAnswer;


        if(isCorrect){

          row.dataset.solved = "true";

          row.classList.add(
            "correct-row"
          );

          button.classList.add(
            "correct"
          );

          buttons.forEach(item=>{
            item.disabled = true;
          });

          feedback.textContent =
            "Richtig! Sehr gut.";

          feedback.classList.add(
            "success"
          );

          correctScore += 1;

          correctScoreElement.textContent =
            String(correctScore);

          await speakGerman(
            "Richtig! Sehr gut.",
            {
              rate:.9
            }
          );


          if(
            correctScore ===
            matchingRows.length
          ){

            completionMessage.textContent =
              "Sehr gut! Alle Sätze sind richtig zugeordnet.";

            await wait(180);

            await speakGerman(
              "Sehr gut! Alle Sätze sind richtig zugeordnet.",
              {
                rate:.88
              }
            );

          }

        }else{

          button.classList.add(
            "wrong"
          );

          feedback.textContent =
            "Nicht ganz. Versuchen Sie es noch einmal.";

          feedback.classList.add(
            "error"
          );

          await speakGerman(
            "Nicht ganz. Versuchen Sie es noch einmal.",
            {
              rate:.88
            }
          );

        }

      }
    );

  });

});


/* ==================================================
   RESET ĆWICZENIA
================================================== */

resetExerciseButton.addEventListener(
  "click",
  ()=>{

    stopSpeech();

    correctScore = 0;

    correctScoreElement.textContent = "0";
    completionMessage.textContent = "";

    matchingRows.forEach(row=>{

      delete row.dataset.solved;

      row.classList.remove(
        "correct-row"
      );

      row.style.transform = "";
      row.style.borderColor = "";

      row
        .querySelectorAll(".choice-button")
        .forEach(button=>{

          button.disabled = false;

          button.classList.remove(
            "correct",
            "wrong"
          );

        });

      const feedback =
        row.querySelector(".row-feedback");

      feedback.textContent = "";

      feedback.classList.remove(
        "success",
        "error"
      );

    });

  }
);


/* ==================================================
   ZATRZYMANIE GŁOSU
================================================== */

window.addEventListener(
  "beforeunload",
  stopSpeech
);

</script>

</body>
</html>
