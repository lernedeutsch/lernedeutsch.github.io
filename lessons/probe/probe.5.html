<script>

"use strict";

/* =========================================================
   ELEMENTY STRONY
========================================================= */

const chatLeft = document.getElementById("chatLeft");

const chatRight = document.getElementById("chatRight");

const statusText = document.getElementById("status");

const micButton = document.getElementById("micButton");

const noCorrectionButton =
document.getElementById("noCorrectionButton");

const typedAnswer =
document.getElementById("typedAnswer");

const progressLabel =
document.getElementById("progressLabel");

/* =========================================================
   STAN LEKCJI
========================================================= */

let lessonStep = 0;

let isWaitingForAnswer = false;

let isListening = false;

let lastBotText = "";

let speechRate = 0.95;

let userName = "";

let showCorrections = true;

let chatMode = false;

let availableVoices = [];

/* =========================================================
   PAMIĘĆ IMIENIA
========================================================= */

function loadUserName() {

const saved =
localStorage.getItem("nele_userName");

if (saved && saved.trim() !== "") {

userName = formatName(saved.trim());

} else {

userName = "";

}

updateStatusText();

}

function saveUserName(name) {

userName = formatName(name);

localStorage.setItem(
"nele_userName",
userName
);

updateStatusText();

}

function clearUserName() {

userName = "";

localStorage.removeItem(
"nele_userName"
);

updateStatusText();

}

function formatName(name) {

const clean = name

.replace(/[.,;:!?"'„“”]/g, "")

.trim()

.split(/\s+/)[0];

if (!clean) {

return "";

}

return clean.charAt(0).toUpperCase() +
clean.slice(1).toLowerCase();

}

function updateStatusText() {

if (userName) {

statusText.textContent =
`Status: Bereit – ${userName}`;

} else {

statusText.textContent =
"Status: Bereit";

}

}

loadUserName();

/* =========================================================
   WŁĄCZANIE I WYŁĄCZANIE KOREKT
========================================================= */

function toggleCorrection() {

showCorrections = !showCorrections;

if (showCorrections) {

noCorrectionButton.classList.remove(
"active"
);

noCorrectionButton.textContent =
"✖ Korrekturen ausschalten";

statusText.textContent =
"Status: Korrekturen sind eingeschaltet.";

} else {

noCorrectionButton.classList.add(
"active"
);

noCorrectionButton.textContent =
"✓ Korrekturen einschalten";

statusText.textContent =
"Status: Korrekturen sind ausgeschaltet.";

}

}

/* =========================================================
   PODSTAWOWY KOREKTOR
========================================================= */

function normalize(text) {

return text

.trim()

.replace(/\s+/g, " ")

.toLowerCase();

}

function fixBasicSpelling(text) {

let t = text;

t = t.replace(
/\bich bin aus ([a-zäöüß]+) komme\b/g,
"ich komme aus $1"
);

t = t.replace(
/\bich habe gut\b/g,
"mir geht es gut"
);

t = t.replace(
/\bich gehe zu sport\b/g,
"ich mache Sport"
);

t = t.replace(
/\bich heiße mich\b/g,
"ich heiße"
);

return t;

}

const PREPOSITION_MAP = [

[
/\bich komme von polen\b/g,
"ich komme aus Polen"
],

[
/\bich komme von deutschland\b/g,
"ich komme aus Deutschland"
],

[
/\bich komme von frankreich\b/g,
"ich komme aus Frankreich"
],

[
/\bich komme von italien\b/g,
"ich komme aus Italien"
],

[
/\bich komme von spanien\b/g,
"ich komme aus Spanien"
],

[
/\bvon polen\b/g,
"aus Polen"
],

[
/\bvon deutschland\b/g,
"aus Deutschland"
],

[
/\bvon frankreich\b/g,
"aus Frankreich"
],

[
/\bvon italien\b/g,
"aus Italien"
],

[
/\bvon spanien\b/g,
"aus Spanien"
],

[
/\bin dem polen\b/g,
"in Polen"
],

[
/\bin dem deutschland\b/g,
"in Deutschland"
],

[
/\bin die schule\b/g,
"zur Schule"
],

[
/\bzu haus\b/g,
"zu Hause"
],

[
/\bzu hause\b/g,
"zu Hause"
]

];

function fixPrepositions(text) {

let t = text;

for (const [regex, replacement]
of PREPOSITION_MAP) {

t = t.replace(
regex,
replacement
);

}

return t;

}

function fixWordOrder(text) {

let t = text;

t = t.replace(
/\bich heute arbeite\b/g,
"ich arbeite heute"
);

t = t.replace(
/\bich morgen arbeite\b/g,
"ich arbeite morgen"
);

t = t.replace(
/\bich heute lerne\b/g,
"ich lerne heute"
);

t = t.replace(
/\bich heute koche\b/g,
"ich koche heute"
);

t = t.replace(
/\bich gerne musik höre\b/g,
"ich höre gerne Musik"
);

t = t.replace(
/\bich gerne sport mache\b/g,
"ich mache gerne Sport"
);

t = t.replace(
/\bich oft musik höre\b/g,
"ich höre oft Musik"
);

return t;

}

function fixVerbs(text) {

let t = text;

t = t.replace(
/\bich stehe auf um (\d{1,2})\b/g,
"ich stehe um $1 Uhr auf"
);

t = t.replace(
/\bich stehe auf (\d{1,2})\b/g,
"ich stehe um $1 Uhr auf"
);

t = t.replace(
/\bich mache auf (\d{1,2})\b/g,
"ich stehe um $1 Uhr auf"
);

t = t.replace(
/\bich liebe musik hören\b/g,
"ich höre gerne Musik"
);

t = t.replace(
/\bich bin gern musik\b/g,
"ich höre gerne Musik"
);

t = t.replace(
/\bich gehe in die schule\b/g,
"ich gehe zur Schule"
);

return t;

}

const NOUNS = {

"schule": "Schule",

"buch": "Buch",

"bücher": "Bücher",

"musik": "Musik",

"sport": "Sport",

"polen": "Polen",

"deutschland": "Deutschland",

"frankreich": "Frankreich",

"italien": "Italien",

"spanien": "Spanien",

"deutsch": "Deutsch",

"montag": "Montag",

"dienstag": "Dienstag",

"mittwoch": "Mittwoch",

"donnerstag": "Donnerstag",

"freitag": "Freitag",

"samstag": "Samstag",

"sonntag": "Sonntag"

};

function fixNouns(text) {

let t = text;

for (const [lowercase, correct]
of Object.entries(NOUNS)) {

const regex =
new RegExp(
"\\b" + lowercase + "\\b",
"g"
);

t = t.replace(
regex,
correct
);

}

return t;

}

function fixFinalCleanup(text) {

return text

.replace(/\s+,/g, ",")

.replace(/,\./g, ".")

.replace(/\s+\./g, ".")

.replace(/\s{2,}/g, " ")

.trim();

}

function capitalizeSentence(text) {

if (!text) {

return text;

}

return text.charAt(0).toUpperCase() +
text.slice(1);

}

function correctGermanGrammar(text) {

let t = normalize(text);

t = fixBasicSpelling(t);

t = fixPrepositions(t);

t = fixWordOrder(t);

t = fixVerbs(t);

t = fixNouns(t);

t = fixFinalCleanup(t);

return capitalizeSentence(t);

}

function correctionIsDifferent(
original,
corrected
) {

const normalizedOriginal =
normalize(original);

const normalizedCorrected =
normalize(corrected);

return normalizedOriginal !==
normalizedCorrected;

}

/* =========================================================
   BEZPIECZNE TWORZENIE DYMków
========================================================= */

function createMessage(
className,
labelText,
messageText
) {

const div =
document.createElement("div");

div.className = className;

const label =
document.createElement("b");

label.textContent = labelText;

div.appendChild(label);

div.appendChild(
document.createTextNode(
" " + messageText
)
);

chatLeft.appendChild(div);

chatLeft.scrollTop =
chatLeft.scrollHeight;

return div;

}

function addBot(text) {

isWaitingForAnswer = false;

micButton.classList.remove(
"waiting"
);

lastBotText = text;

createMessage(
"bot",
"🤖 Nele:",
text
);

chatRight.classList.add(
"speaking"
);

chatRight.classList.remove(
"listening"
);

speakGerman(
text,
true
);

}

function addUser(text) {

createMessage(
"user",
"🧑 Du:",
text
);

}

function addCorrection(correctedText) {

if (!showCorrections) {

return;

}

createMessage(
"korrektion",
"Korrektion:",
correctedText
);

}

/* =========================================================
   SYNTEZA MOWY
========================================================= */

function loadVoices() {

if (!("speechSynthesis" in window)) {

availableVoices = [];

return;

}

availableVoices =
window.speechSynthesis.getVoices();

}

if ("speechSynthesis" in window) {

loadVoices();

if (
"onvoiceschanged"
in window.speechSynthesis
) {

window.speechSynthesis.onvoiceschanged =
loadVoices;

}

}

function speakGerman(
text,
waitForAnswerAfterSpeech = false
) {

if (
!("speechSynthesis" in window)
) {

chatRight.classList.remove(
"speaking"
);

if (waitForAnswerAfterSpeech) {

enableAnswer();

}

statusText.textContent =
"Status: Sprachausgabe wird nicht unterstützt.";

return;

}

window.speechSynthesis.cancel();

const utterance =
new SpeechSynthesisUtterance(text);

utterance.lang = "de-DE";

const germanVoice =

availableVoices.find(
voice =>
voice.lang === "de-DE" &&
voice.name.toLowerCase().includes(
"google"
)
)

||

availableVoices.find(
voice =>
voice.lang &&
voice.lang
.toLowerCase()
.startsWith("de")
);

if (germanVoice) {

utterance.voice =
germanVoice;

}

utterance.rate =
speechRate;

utterance.pitch =
1.0;

utterance.volume =
1.0;

utterance.onend = function() {

chatRight.classList.remove(
"speaking"
);

if (waitForAnswerAfterSpeech) {

enableAnswer();

}

};

utterance.onerror = function() {

chatRight.classList.remove(
"speaking"
);

if (waitForAnswerAfterSpeech) {

enableAnswer();

}

};

window.speechSynthesis.speak(
utterance
);

}

function enableAnswer() {

isWaitingForAnswer = true;

micButton.classList.add(
"waiting"
);

statusText.textContent =
"Status: Du kannst jetzt antworten.";

}

function updateRate(value) {

speechRate =
parseFloat(value);

}

function repeatLast() {

if (!lastBotText) {

statusText.textContent =
"Status: Es gibt noch nichts zu wiederholen.";

return;

}

chatRight.classList.add(
"speaking"
);

chatRight.classList.remove(
"listening"
);

speakGerman(
lastBotText,
false
);

}

/* =========================================================
   ROZPOZNAWANIE MOWY
========================================================= */

const SpeechRecognition =

window.SpeechRecognition ||

window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

recognition =
new SpeechRecognition();

recognition.lang =
"de-DE";

recognition.interimResults =
false;

recognition.maxAlternatives =
1;

recognition.onstart =
function() {

isListening = true;

micButton.disabled =
true;

micButton.classList.add(
"listening"
);

statusText.textContent =
"Status: Ich höre zu ...";

chatRight.classList.add(
"listening"
);

chatRight.classList.remove(
"speaking"
);

};

recognition.onresult =
function(event) {

const answer =

event.results[0][0]
.transcript
.trim();

handleAnswer(answer);

};

recognition.onerror =
function(event) {

statusText.textContent =
`Status: Mikrofonfehler – ${event.error}`;

chatRight.classList.remove(
"listening"
);

};

recognition.onend =
function() {

isListening = false;

micButton.disabled =
false;

micButton.classList.remove(
"listening"
);

chatRight.classList.remove(
"listening"
);

};

} else {

micButton.disabled =
true;

statusText.textContent =
"Status: Spracheingabe wird in diesem Browser nicht unterstützt.";

}

function listenAnswer() {

if (!recognition) {

statusText.textContent =
"Status: Spracheingabe wird nicht unterstützt.";

return;

}

if (!isWaitingForAnswer) {

statusText.textContent =
"Status: Nele wartet noch nicht auf deine Antwort.";

return;

}

if (isListening) {

statusText.textContent =
"Status: Das Mikrofon ist bereits aktiv.";

return;

}

try {

recognition.start();

} catch (error) {

statusText.textContent =
"Status: Das Mikrofon ist bereits aktiv.";

}

}

/* =========================================================
   WYSYŁANIE ODPOWIEDZI TEKSTOWEJ
========================================================= */

function sendTypedAnswer() {

const text =
typedAnswer.value.trim();

if (!text) {

return;

}

if (!isWaitingForAnswer) {

statusText.textContent =
"Status: Nele wartet noch nicht auf deine Antwort.";

return;

}

typedAnswer.value = "";

handleAnswer(text);

}

function handleAnswer(answer) {

isWaitingForAnswer =
false;

micButton.classList.remove(
"waiting"
);

chatRight.classList.remove(
"listening"
);

const corrected =
correctGermanGrammar(answer);

if (
correctionIsDifferent(
answer,
corrected
)
) {

if (showCorrections) {

statusText.textContent =
`Status: Antwort erkannt – Korrektion: ${corrected}`;

addCorrection(
corrected
);

} else {

statusText.textContent =
"Status: Antwort erkannt";

}

} else {

statusText.textContent =
"Status: Antwort erkannt";

}

addUser(answer);

evaluate(corrected);

}

/* =========================================================
   RESETOWANIE IMIENIA
========================================================= */

function resetUserName() {

clearUserName();

statusText.textContent =
"Status: Der Name wurde gelöscht.";

setTimeout(
updateStatusText,
1200
);

}

/* =========================================================
   PASEK POSTĘPU
========================================================= */

function updateProgress(step) {

document
.querySelectorAll(
".progress-step"
)
.forEach(function(element) {

const number =
parseInt(
element.getAttribute(
"data-step"
),
10
);

if (number <= step) {

element.classList.add(
"active"
);

} else {

element.classList.remove(
"active"
);

}

});

const labels = [

"",

"Begrüßung",

"Befinden",

"Herkunft",

"Freizeit",

"Abschied",

"Fertig"

];

if (
step >= 1 &&
step <= 6
) {

progressLabel.textContent =
`Schritt ${step} von 6: ${labels[step]}`;

} else {

progressLabel.textContent =
"Bereit zum Start";

}

}

/* =========================================================
   ROZPOCZĘCIE LEKCJI
========================================================= */

function startLesson() {

if (
"speechSynthesis"
in window
) {

window.speechSynthesis.cancel();

}

chatLeft.textContent = "";

chatRight.classList.remove(
"listening",
"speaking"
);

lessonStep = 1;

chatMode = false;

isWaitingForAnswer = false;

isListening = false;

micButton.disabled =
!recognition;

micButton.classList.remove(
"waiting",
"listening"
);

updateProgress(1);

if (userName) {

addBot(
`Guten Tag! Ich heiße Nele. Ich erinnere mich: Du bist ${userName}. Wie geht es dir?`
);

lessonStep = 2;

updateProgress(2);

} else {

addBot(
"Guten Tag! Ich heiße Nele. Wie heißt du?"
);

}

}

/* =========================================================
   OCENA ODPOWIEDZI W LEKCJI
========================================================= */

function evaluate(answer) {

const text =
normalize(answer);

if (chatMode) {

replyInFreeConversation(
text
);

return;

}

/* KROK 1 – IMIĘ */

if (lessonStep === 1) {

let name = "";

if (
text.includes(
"ich heiße"
)
) {

const parts =
text.split(
"ich heiße"
);

if (parts.length > 1) {

name =
parts[1].trim();

}

} else if (
text.includes(
"mein name ist"
)
) {

const parts =
text.split(
"mein name ist"
);

if (parts.length > 1) {

name =
parts[1].trim();

}

} else if (
text.startsWith(
"ich bin "
)
) {

name =
text.replace(
"ich bin ",
""
).trim();

}

name =
formatName(name);

if (name) {

saveUserName(name);

addBot(
`Freut mich, ${name}! Wie geht es dir?`
);

lessonStep = 2;

updateProgress(2);

} else {

addBot(
"Ich habe deinen Namen nicht verstanden. Du kannst sagen: Ich heiße Anna."
);

}

return;

}

/* KROK 2 – SAMOPOCZUCIE */

if (lessonStep === 2) {

const feelingWords = [

"gut",

"sehr gut",

"prima",

"super",

"nicht so gut",

"schlecht",

"müde",

"es geht",

"mir geht es"

];

const understood =
feelingWords.some(
word =>
text.includes(word)
);

if (understood) {

if (
text.includes(
"nicht so gut"
) ||
text.includes(
"schlecht"
) ||
text.includes(
"müde"
)
) {

if (userName) {

addBot(
`Das tut mir leid, ${userName}. Woher kommst du?`
);

} else {

addBot(
"Das tut mir leid. Woher kommst du?"
);

}

} else {

if (userName) {

addBot(
`Schön, ${userName}! Woher kommst du?`
);

} else {

addBot(
"Schön! Woher kommst du?"
);

}

}

lessonStep = 3;

updateProgress(3);

} else {

addBot(
