<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stellen Sie sich vor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap"
  rel="stylesheet"
>

<style>
:root{
  --background:#20324a;
  --paper:#fff3df;
  --paper-dark:#f6e4c4;
  --white:#ffffff;

  --text:#111820;
  --muted:#4f5c69;

  --line:#e2d1af;
  --gold:#c59027;
  --gold-light:#f2c65b;

  --blue:#0875b8;
  --blue-light:#e7f5ff;

  --shadow:0 18px 45px rgba(0,0,0,.2);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:160vh;
  margin:0;
  padding:80px 20px 120px;

  color:var(--text);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(255,255,255,.06),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 85%,
      rgba(255,255,255,.05),
      transparent 40%
    ),
    var(--background);

  font-family:"Nunito Sans",sans-serif;
}


/* ==================================================
   PASEK POSTĘPU NA GÓRZE STRONY
================================================== */

.progress-container{
  position:fixed;
  z-index:1000;
  top:0;
  left:0;

  width:100%;
  height:7px;

  background:rgba(255,255,255,.18);
}

.progress-bar{
  width:0;
  height:100%;

  background:linear-gradient(
    90deg,
    #f3c653,
    #ff9f43
  );

  box-shadow:0 0 12px rgba(255,183,51,.55);

  transition:width .08s linear;
}


/* ==================================================
   GŁÓWNY OBSZAR
================================================== */

.page-wrapper{
  width:min(900px,100%);
  margin:0 auto;
}

.page-title{
  margin:0 0 26px;

  color:#ffffff;
  text-align:center;

  font-size:2.2rem;
  font-weight:800;
}


/* ==================================================
   KARTA „STELLEN SIE SICH VOR”
================================================== */

.personal-introduction{
  padding:32px;

  background:linear-gradient(
    145deg,
    var(--paper),
    var(--paper-dark)
  );

  border:1px solid rgba(255,255,255,.35);
  border-radius:26px;

  box-shadow:var(--shadow);
}

.section-title{
  margin:0 0 14px;

  font-size:2rem;
  line-height:1.2;
  font-weight:800;
}

.instruction{
  margin:0 0 22px;

  color:var(--muted);

  font-size:1.15rem;
  font-weight:600;
}


/* ==================================================
   FORMULARZ
================================================== */

.name-form{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
}

.name-label{
  font-size:1.1rem;
  font-weight:800;
}

.name-input{
  width:100%;
  min-height:58px;
  padding:12px 18px;

  color:var(--text);

  background:#ffffff;
  border:3px solid var(--gold);
  border-radius:17px;

  font-size:1.12rem;

  outline:none;

  box-shadow:
    0 0 0 4px rgba(242,198,91,.18);

  transition:
    border-color .16s,
    box-shadow .16s;
}

.name-input:focus{
  border-color:#1a83c6;

  box-shadow:
    0 0 0 5px rgba(26,131,198,.18);
}

.create-button{
  min-height:58px;
  padding:12px 22px;

  color:#ffffff;

  background:linear-gradient(
    180deg,
    #1688c9,
    #0669a7
  );

  border:0;
  border-radius:17px;

  font-size:1.08rem;
  font-weight:800;

  cursor:pointer;

  box-shadow:0 8px 16px rgba(5,91,145,.25);

  transition:
    transform .16s,
    filter .16s,
    box-shadow .16s;
}

.create-button:hover{
  transform:translateY(-2px);
  filter:brightness(1.06);

  box-shadow:0 11px 20px rgba(5,91,145,.3);
}

.create-button:active{
  transform:translateY(0);
}


/* ==================================================
   PODGLĄD ZDANIA
================================================== */

.introduction-preview{
  min-height:70px;
  margin-top:22px;
  padding:18px 20px;

  display:flex;
  align-items:center;

  background:rgba(255,255,255,.93);
  border:1px solid var(--line);
  border-radius:18px;

  font-size:1.35rem;
  font-weight:800;

  box-shadow:0 7px 18px rgba(71,53,24,.08);
}


/* ==================================================
   PRZYCISK AUDIO
================================================== */

.speak-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  min-height:52px;
  margin-top:18px;
  padding:11px 20px;

  color:#16364b;

  background:var(--blue-light);
  border:1px solid #9ed5f5;
  border-radius:999px;

  font-size:1.08rem;
  font-weight:800;

  cursor:pointer;

  transition:
    transform .16s,
    background .16s,
    box-shadow .16s;
}

.speak-button:hover:not(:disabled){
  background:#d3edff;
  transform:translateY(-2px);

  box-shadow:0 8px 16px rgba(42,132,185,.17);
}

.speak-button:disabled{
  cursor:not-allowed;
  opacity:.5;
}

.speak-button.is-speaking{
  color:#ffffff;
  background:#167fbd;
  border-color:#167fbd;
}


/* ==================================================
   KOMUNIKAT
================================================== */

.message{
  min-height:28px;
  margin:14px 0 0;

  color:#a12d2d;

  font-weight:800;
}


/* ==================================================
   DOSTĘPNOŚĆ
================================================== */

button:focus-visible,
input:focus-visible{
  outline:3px solid var(--gold-light);
  outline-offset:3px;
}


/* ==================================================
   WERSJA MOBILNA
================================================== */

@media (max-width:700px){

  body{
    padding:55px 14px 100px;
  }

  .page-title{
    font-size:1.8rem;
  }

  .personal-introduction{
    padding:23px 18px;
    border-radius:20px;
  }

  .section-title{
    font-size:1.65rem;
  }

  .instruction{
    font-size:1rem;
  }

  .name-form{
    grid-template-columns:1fr;
  }

  .name-label{
    margin-bottom:-4px;
  }

  .create-button{
    width:100%;
  }

  .speak-button{
    width:100%;
  }

}


@media (prefers-reduced-motion:reduce){

  html{
    scroll-behavior:auto;
  }

  *,
  *::before,
  *::after{
    transition-duration:.01ms !important;
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
  }

}
</style>
</head>

<body>

<!-- ==================================================
     PASEK POSTĘPU
================================================== -->

<div
  class="progress-container"
  aria-hidden="true"
>
  <div
    class="progress-bar"
    id="pageProgress"
  ></div>
</div>


<main class="page-wrapper">

  <h1 class="page-title">
    Mein Name ist …
  </h1>


  <!-- ==================================================
       STELLEN SIE SICH VOR
  ================================================== -->

  <section class="personal-introduction">

    <h2 class="section-title">
      Stellen Sie sich vor
    </h2>

    <p class="instruction">
      Schreiben Sie Ihren Namen.
      Danach können Sie Ihren eigenen Satz anhören.
    </p>


    <div class="name-form">

      <label
        for="studentName"
        class="name-label"
      >
        Name
      </label>

      <input
        type="text"
        id="studentName"
        class="name-input"
        placeholder="Ihr Name"
        autocomplete="name"
        maxlength="60"
      >

      <button
        type="button"
        class="create-button"
        id="createIntroduction"
      >
        Satz erstellen
      </button>

    </div>


    <div
      class="introduction-preview"
      id="introductionPreview"
      aria-live="polite"
    >
      Ich heiße …
    </div>


    <button
      type="button"
      class="speak-button"
      id="speakIntroduction"
      disabled
    >
      <span aria-hidden="true">🔊</span>
      Meine Vorstellung anhören
    </button>


    <p
      class="message"
      id="message"
      aria-live="polite"
    ></p>

  </section>

</main>


<script>
"use strict";


/* ==================================================
   ELEMENTY
================================================== */

const pageProgress =
  document.getElementById("pageProgress");

const studentNameInput =
  document.getElementById("studentName");

const createIntroductionButton =
  document.getElementById("createIntroduction");

const introductionPreview =
  document.getElementById("introductionPreview");

const speakIntroductionButton =
  document.getElementById("speakIntroduction");

const message =
  document.getElementById("message");


let personalIntroductionText = "";
let germanVoice = null;


/* ==================================================
   PASEK POSTĘPU STRONY
================================================== */

function updatePageProgress(){

  const scrollableHeight =
    document.documentElement.scrollHeight -
    window.innerHeight;

  if(scrollableHeight <= 0){

    pageProgress.style.width = "100%";
    return;

  }

  const currentScroll =
    window.scrollY ||
    document.documentElement.scrollTop;

  const progress =
    Math.min(
      100,
      Math.max(
        0,
        currentScroll / scrollableHeight * 100
      )
    );

  pageProgress.style.width = `${progress}%`;

}


window.addEventListener(
  "scroll",
  updatePageProgress,
  {
    passive:true
  }
);

window.addEventListener(
  "resize",
  updatePageProgress
);

updatePageProgress();


/* ==================================================
   WYBÓR NIEMIECKIEGO GŁOSU
================================================== */

function loadGermanVoice(){

  if(!("speechSynthesis" in window)){
    return;
  }

  const voices =
    window.speechSynthesis.getVoices();

  germanVoice =
    voices.find(voice =>
      voice.lang?.toLowerCase() === "de-de" &&
      voice.name?.toLowerCase().includes("google")
    ) ||

    voices.find(voice =>
      voice.lang?.toLowerCase() === "de-de"
    ) ||

    voices.find(voice =>
      voice.lang?.toLowerCase().startsWith("de")
    ) ||

    null;

}


loadGermanVoice();


if("speechSynthesis" in window){

  window.speechSynthesis.addEventListener(
    "voiceschanged",
    loadGermanVoice
  );

}


/* ==================================================
   TWORZENIE ZDANIA
================================================== */

function createPersonalIntroduction(){

  const name =
    studentNameInput.value
      .trim()
      .replace(/\s+/g," ");

  if(!name){

    personalIntroductionText = "";

    introductionPreview.textContent =
      "Ich heiße …";

    speakIntroductionButton.disabled = true;

    message.textContent =
      "Bitte schreiben Sie Ihren Namen.";

    studentNameInput.focus();

    return;

  }

  personalIntroductionText =
    `Hallo! Ich heiße ${name}.`;

  introductionPreview.textContent =
    personalIntroductionText;

  speakIntroductionButton.disabled = false;

  message.textContent = "";

  localStorage.setItem(
    "neleStudentName",
    name
  );

}


createIntroductionButton.addEventListener(
  "click",
  createPersonalIntroduction
);


studentNameInput.addEventListener(
  "keydown",
  event=>{

    if(event.key === "Enter"){
      createPersonalIntroduction();
    }

  }
);


/* ==================================================
   ODTWARZANIE ZDANIA
================================================== */

function speakGerman(text){

  if(
    !text ||
    !("speechSynthesis" in window)
  ){

    message.textContent =
      "Die Sprachausgabe wird von diesem Browser nicht unterstützt.";

    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "de-DE";
  utterance.rate = 0.84;
  utterance.pitch = 1;
  utterance.volume = 1;

  if(germanVoice){
    utterance.voice = germanVoice;
  }

  speakIntroductionButton.classList.add(
    "is-speaking"
  );

  utterance.onend = ()=>{

    speakIntroductionButton.classList.remove(
      "is-speaking"
    );

  };

  utterance.onerror = event=>{

    speakIntroductionButton.classList.remove(
      "is-speaking"
    );

    if(event.error !== "canceled"){

      message.textContent =
        "Die Sprachausgabe konnte nicht gestartet werden.";

      console.error(
        "Fehler bei der Sprachausgabe:",
        event.error
      );

    }

  };

  window.speechSynthesis.speak(utterance);

}


speakIntroductionButton.addEventListener(
  "click",
  ()=>{

    if(!personalIntroductionText){
      return;
    }

    message.textContent = "";

    speakGerman(
      personalIntroductionText
    );

  }
);


/* ==================================================
   WCZYTANIE WCZEŚNIEJ ZAPISANEGO IMIENIA
================================================== */

const savedStudentName =
  localStorage.getItem("neleStudentName");

if(savedStudentName){

  studentNameInput.value =
    savedStudentName;

  personalIntroductionText =
    `Hallo! Ich heiße ${savedStudentName}.`;

  introductionPreview.textContent =
    personalIntroductionText;

  speakIntroductionButton.disabled = false;

}


/* ==================================================
   ZATRZYMANIE GŁOSU PRZY OPUSZCZANIU STRONY
================================================== */

window.addEventListener(
  "beforeunload",
  ()=>{

    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
    }

  }
);

</script>

</body>
</html>
