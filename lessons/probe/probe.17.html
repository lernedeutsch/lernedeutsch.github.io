<style>

body{

.vocab-card{

.progress-wrap{

}

.progress-track{

.progress-step{

flex:1;

.progress-step.active{

.chat-card-left{ flex:1.1; }

.chat-card-right::before,

.chat-card-right::after{

.panel-header{

}

#chatLeft{

background-color:#fffdf7;

background-image: repeating-linear-gradient(to bottom, transparent 0 31px, rgba(47,111,43,0.10) 31px 32px);

}

#chatRight{

overflow:hidden;

background: radial-gradient(120% 100% at 50% 0%, #eef5e8 0%, #dcebd3 55%, #cde2c3 100%);

}

.bot, .user{

max-width:85%;

margin:10px 0;

padding:10px 14px;

border-radius:16px;

font-size:.95rem;

animation: fadeIn .25s ease;

}

.bot{

background:#e7f1e4;

}

.user{

background:#fbe9ee;

button:hover{

transform: translateY(-2px);

}

button:focus-visible, input:focus-visible{

outline:3px solid var(--gold);

}

background: linear-gradient(135deg, var(--gold), #e3a93f);

box-shadow:0 6px 16px rgba(201,138,44,0.32);

}

#micButton.waiting{

background: linear-gradient(135deg, #e2334f, var(--berry));

animation: pulse 1s infinite;

box-shadow:0 6px 18px rgba(226,51,79,0.35);

}

@keyframes pulse {

0% { opacity:1; transform:scale(1); }

50% { opacity:0.78; transform:scale(1.03); }

100% { opacity:1; transform:scale(1); }

}

.ghost-btn{

background:#fff;

color: var(--wood-deep);

border:2px solid var(--wood);

}

.ghost-btn:hover{

box-shadow:0 4px 10px rgba(0,0,0,0.08);

}

display:flex;

gap:14px;

align-items:center;

margin-top:4px;

}

display:flex;

align-items:center;

gap:8px;

font-size:.85rem;

color: var(--ink);

background:#fff;

padding:8px 16px;

border-radius:30px;

box-shadow:0 4px 10px rgba(0,0,0,0.07);

}

.rate-control input[type=range]{

accent-color: var(--green);

width:120px;

}

.rate-control-label{ opacity:.7; }

.type-row{

display:flex;

gap:8px;

flex:1;

min-width:240px;

}

.type-row input[type=text]{

flex:1;

padding:10px 16px;

border-radius:30px;

border:2px solid var(--cream-deep);

font-family:'Nunito', sans-serif;

font-size:.95rem;

background:#fff;

}

.type-row input[type=text]:focus{

outline:none;

border-color: var(--green);

}

#status{

font-weight:700;

font-family:'JetBrains Mono', monospace;

font-size:.85rem;

color: var(--wood-deep);

background:#fff;

display:inline-block;

padding:8px 16px;

border-radius:10px;

box-shadow:0 4px 10px rgba(0,0,0,0.06);

}

/* Fale po prawej stronie – UKRYTE */

.waves {

position: absolute;

left: 0;

bottom: 0;

width: 100%;

height: 90px;

opacity: 0;

pointer-events: none;

transition: opacity 0.15s ease;

z-index: 1;

display:none; /* <-- to usuwa je z ekranu */

}

#chatRight.listening .waves,

#chatRight.speaking .waves{

opacity: 1;

}

.wave-group{

transform-origin: center;

animation: wavePulse 1.2s linear infinite;

}

.wave-group.wave2{ animation-duration: 0.9s; }

.wave-group.wave3{ animation-duration: 0.7s; }

@keyframes wavePulse{

0% { transform: translateX(-24px) scaleY(0.85); }

20% { transform: translateX(-10px) scaleY(1.15); }

40% { transform: translateX(10px) scaleY(0.9); }

60% { transform: translateX(24px) scaleY(1.2); }

80% { transform: translateX(10px) scaleY(0.88); }

100% { transform: translateX(-24px) scaleY(0.85); }

}

.wave-line{

fill: none;

stroke-width: 5;

stroke-linecap: round;

stroke-linejoin: round;

filter: drop-shadow(0 0 2px rgba(0,0,0,0.10));

}

.wave1{ stroke: rgba(94,61,32,0.55); }

.wave2{ stroke: rgba(201,138,44,0.65); }

.wave3{ stroke: rgba(47,111,43,0.5); }

@media (max-width: 720px){

.chat-wrapper{ flex-direction:column; }

.chat-card-left, .chat-card-right{ flex:1; }

.chat-panel{ min-height:300px; }

.extra-controls{ flex-direction:column; align-items:stretch; }

.type-row{ min-width:0; }

}

@media (prefers-reduced-motion: reduce){

, ::before, *::after{

animation-duration: 0.001ms !important;

animation-iteration-count: 1 !important;

transition-duration: 0.001ms !important;

}

}

</style>

<body>

<header class="page-header">

<h1></h1>

</header>

<div class="progress-wrap">

<div class="progress-track" id="progressTrack">

<div class="progress-step" data-step="1"></div>

<div class="progress-step" data-step="2"></div>

<div class="progress-step" data-step="3"></div>

<div class="progress-step" data-step="4"></div>

<div class="progress-step" data-step="5"></div>

<div class="progress-step" data-step="6"></div>

</div>

</div>

<div class="chat-wrapper">

<div class="chat-card chat-card-left">

</div>

<div class="chat-card chat-card-right">

</g>

</div>

</div>

</div>

<div class="actions-row">

<button onclick="startLesson()">▶ Lektion starten</button>

<button id="micButton" onclick="listenAnswer()">🎤 Mit dem Mikrofon antworten</button>

<button class="ghost-btn" onclick="repeatLast()">🔁 Wiederholen</button>

</div>

<div class="extra-controls">

<label class="rate-control">

🐢

<input type="range" id="rateSlider" min="0.6" max="1.3" step="0.05" value="0.95" oninput="updateRate(this.value)">

🐇

<span class="rate-control-label">Sprechtempo</span>

</label>

<div class="type-row">

<input type="text" id="typedAnswer" placeholder="...oder hier antworten und Enter drücken" onkeydown="if(event.key==='Enter'){ sendTypedAnswer(); }">

<button class="ghost-btn" onclick="sendTypedAnswer()">Senden</button>

</div>

</div>

<p id="status" aria-live="polite">Status: Bereit</p>

<script>

/* cała logika JS bez zmian – dokładnie jak w Twoim kodzie */

const chatLeft = document.getElementById("chatLeft");

const chatRight = document.getElementById("chatRight");

const statusText = document.getElementById("status");

const micButton = document.getElementById("micButton");

let lessonStep = 0;

let isWaitingForAnswer = false;

let selectedVoice = null;

let lastBotText = "";

let speechRate = 0.95;

const SpeechRecognition =

window.SpeechRecognition ||

window.webkitSpeechRecognition;

let recognition = null;

if(SpeechRecognition){

recognition = new SpeechRecognition();

recognition.lang = "de-DE";

recognition.interimResults = false;

recognition.maxAlternatives = 1;

recognition.onresult = function(event){

const answer =

event.results[0][0].transcript.trim();

statusText.textContent =

"Status: Antwort erkannt";

micButton.classList.remove("waiting");

isWaitingForAnswer = false;

chatRight.classList.remove("listening");

addUser(answer);

evaluate(answer);

};

recognition.onerror = function(){

statusText.textContent =

"Status: Mikrofonfehler";

micButton.classList.remove("waiting");

isWaitingForAnswer = false;

chatRight.classList.remove("listening");

};

}

function addBot(text){

lastBotText = text;

chatLeft.innerHTML +=

`<div class="bot"><b>🤖 Nele:</b> ${text}</div>`;

chatLeft.scrollTop = chatLeft.scrollHeight;

chatRight.classList.add("speaking");

chatRight.classList.remove("listening");

speak(text);

micButton.classList.add("waiting");

isWaitingForAnswer = true;

}

function addUser(text){

chatLeft.innerHTML +=

`<div class="user"><b>🧑 Du:</b> ${text}</div>`;

chatLeft.scrollTop = chatLeft.scrollHeight;

}

function pickGermanFemaleVoice(voices){

const germanVoices = voices.filter(voice =>

voice.lang && voice.lang.toLowerCase().startsWith("de")

);

if(germanVoices.length === 0){

return null;

}

const femaleNameHints = [

"katja", "helene", "anna", "petra", "marlene",

"vicki", "seraphina", "amala", "martha", "ingrid",

"frieda", "greta", "female"

];

const maleNameHints = [

"conrad", "stefan", "klaus", "markus", "bernd",

"yannick", "florian", "ralf", "hans", "male"

];

function scoreVoice(voice){

const name = voice.name.toLowerCase();

let score = 0;

if(name.includes("natural")){ score += 50; }

if(name.includes("neural")){ score += 45; }

if(name.includes("online")){ score += 25; }

if(name.includes("google")){ score += 15; }

if(femaleNameHints.some(hint => name.includes(hint))){

score += 20;

}

if(maleNameHints.some(hint => name.includes(hint))){

score -= 100;

}

if(voice.lang === "de-DE"){ score += 5; }

return score;

}

return germanVoices

.slice()

.sort((a, b) => scoreVoice(b) - scoreVoice(a))[0];

}

function speak(text){

speechSynthesis.cancel();

const utterance =

new SpeechSynthesisUtterance(text);

const voices =

speechSynthesis.getVoices();

selectedVoice = pickGermanFemaleVoice(voices);

if(selectedVoice){

utterance.voice = selectedVoice;

}

utterance.lang = "de-DE";

utterance.rate = speechRate;

utterance.pitch = 1.0;

utterance.volume = 1;

utterance.onend = function(){

chatRight.classList.remove("speaking");

};

speechSynthesis.speak(utterance);

}

function updateRate(val){

speechRate = parseFloat(val);

}

function repeatLast(){

if(!lastBotText){

return;

}

chatRight.classList.add("speaking");

chatRight.classList.remove("listening");

speak(lastBotText);

}

function updateProgress(step){

document.querySelectorAll(".progress-step").forEach(function(el){

const s = parseInt(el.getAttribute("data-step"));

if(s <= step){

el.classList.add("active");

}else{

el.classList.remove("active");

}

});

const labels = ["", "Begrüßung", "Befinden", "Herkunft", "Freizeit", "Abschied", "Fertig"];

const labelEl = document.getElementById("progressLabel");

if(step >= 1 && step <= 6){

labelEl.textContent = "Schritt " + step + " von 6: " + labels[step];

}else{

labelEl.textContent = "Bereit zum Start";

}

}

function startLesson(){

chatLeft.innerHTML = "";

chatRight.classList.remove("listening");

chatRight.classList.remove("speaking");

lessonStep = 1;

isWaitingForAnswer = false;

micButton.classList.remove("waiting");

updateProgress(1);

if(!selectedVoice){

const voices = speechSynthesis.getVoices();

selectedVoice = pickGermanFemaleVoice(voices);

}

addBot(

"Guten Tag! Ich heiße Nele. Wie heißt du?"

);

}

function listenAnswer(){

if(!recognition){

statusText.textContent =

"Status: Spracheingabe wird nicht unterstützt.";

return;

}

if(!isWaitingForAnswer){

statusText.textContent =

"Status: Nele wartet noch nicht auf deine Antwort.";

return;

}

statusText.textContent =

"Status: Ich höre zu ...";

chatRight.classList.add("listening");

recognition.start();

}

function sendTypedAnswer(){

const input = document.getElementById("typedAnswer");

const text = input.value.trim();

if(!text){

return;

}

if(!isWaitingForAnswer){

statusText.textContent =

"Status: Nele wartet noch nicht auf deine Antwort.";

return;

}

statusText.textContent =

"Status: Antwort erkannt";

micButton.classList.remove("waiting");

isWaitingForAnswer = false;

chatRight.classList.remove("listening");

addUser(text);

evaluate(text);

input.value = "";

}

function evaluate(answer){

const text = answer.toLowerCase();

if(lessonStep === 1){

if(

text.includes("ich heiße") ||

text.includes("mein name ist")

){

addBot(

"Freut mich! Wie geht es dir?"

);

lessonStep = 2;

updateProgress(2);

}else{

addBot(

"Ich habe deinen Namen nicht verstanden. Du kannst sagen: Ich heiße Anna. Wie heißt du?"

);

}

return;

}

if(lessonStep === 2){

if(

text.includes("gut") ||

text.includes("sehr gut") ||

text.includes("prima") ||

text.includes("super") ||

text.includes("es geht")

){

addBot(

"Schön! Woher kommst du?"

);

lessonStep = 3;

updateProgress(3);

}else{

addBot(

"Ich habe dich nicht ganz verstanden. Du kannst sagen: Gut, danke. Wie geht es dir?"

);

}

return;

}

if(lessonStep === 3){

if(

text.includes("ich komme aus")

){

addBot(

"Interessant! Was machst du gern in deiner Freizeit?"

);

lessonStep = 4;

updateProgress(4);

}else{

addBot(

"Du kannst zum Beispiel sagen: Ich komme aus Polen. Woher kommst du?"

);

}

return;

}

if(lessonStep === 4){

if(

text.length > 2

){

addBot(

"Das klingt interessant. Ich muss jetzt leider gehen."

);

lessonStep = 5;

updateProgress(5);

}else{

addBot(

"Erzähl mir etwas über deine Freizeit."

);

}

return;

}

if(lessonStep === 5){

if(

text.includes("tschüss") ||

text.includes("auf wiedersehen") ||

text.includes("bis bald") ||

text.includes("bis später")

){

addBot(

"Tschüss! Schön, mit dir Deutsch zu sprechen."

);

lessonStep = 6;

updateProgress(6);

}else{

addBot(

"Ich gehe jetzt. Was sagt man zum Abschied?"

);

}

return;

}

if(lessonStep === 6){

addBot(

"Danke für das Gespräch! Starte die Lektion gern noch einmal."

);

}

}

speechSynthesis.onvoiceschanged = function() {

const voices = speechSynthesis.getVoices();

selectedVoice = pickGermanFemaleVoice(voices);

};

</script>
