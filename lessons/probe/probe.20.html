<!doctype html>

<html lang="pl">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>SVG Portrait</title>

<style>

:root{

--bg1:#f7e8df;

--bg2:#f0d8cc;

/* kolory skóry jak w drugim kodzie */

--skin:#e6bb9d; /* jaśniejsza skóra */

--skin-shadow:#cf997a; /* jaśniejszy cień */

--skin-light:#f8ece1; /* jasny highlight */

--hair:#7a4b2e;

--hair-dark:#5c341f;

--hair-light:#9a6240;

/* kolory koszulki i dodatków z pierwszego kodu */

--shirt:#f3f5ff;

--shirt-shadow:#c9d4ff;

--shirt-accent:#6f7ad8;

--shirt-accent-soft:#a1b0ff;

--eye:#4a2f22;

--lip:#d66b76;

--lip-dark:#b2505a;

--blush:#e8a6a0;

--glasses:#2f2a3a;

--earring:#f4c64f;

--necklace:#f4c64f;

--nail:#d86c7c;

}

html, body {

height: 100%;

margin: 0;

background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2));

display: grid;

place-items: center;

overflow: hidden;

font-family: system-ui, sans-serif;

}

.wrap {

width: min(420px, 92vw);

aspect-ratio: 1 / 1.25;

filter: drop-shadow(0 18px 35px rgba(0,0,0,.12));

}

svg {

width: 100%;

height: 100%;

display: block;

}

.breathe {

transform-origin: center;

animation: float 4s ease-in-out infinite;

transition: transform 0.12s ease-out;

}

@keyframes float {

0%, 100% { transform: translateY(0px); }

50% { transform: translateY(-4px); }

}

.blink {

transform-box: fill-box;

transform-origin: center;

animation: blink 5s infinite;

}

@keyframes blink {

0%, 92%, 100% { transform: scaleY(1); }

94% { transform: scaleY(0.12); }

96% { transform: scaleY(1); }

}

.hair-sheen {

opacity: .35;

mix-blend-mode: screen;

}

/* delikatny ruch włosów (zostaje) */

.hair-group {

transform-box: fill-box;

transform-origin: center;

animation: hairWind 5s ease-in-out infinite;

}

.hair-left {

transform-box: fill-box;

transform-origin: top center;

animation: hairLeft 5.2s ease-in-out infinite;

}

.hair-right {

transform-box: fill-box;

transform-origin: top center;

animation: hairRight 5.2s ease-in-out infinite;

}

@keyframes hairWind {

0%, 100% { transform: translateX(0px) rotate(0deg); }

50% { transform: translateX(-1px) rotate(-0.4deg); }

}

@keyframes hairLeft {

0%, 100% { transform: rotate(0deg) translateX(0px); }

50% { transform: rotate(-1.2deg) translateX(-1px); }

}

@keyframes hairRight {

0%, 100% { transform: rotate(0deg) translateX(0px); }

50% { transform: rotate(1.2deg) translateX(1px); }

}

/* przygotowanie elementów na transformacje zależne od myszy */

#character,

#head,

#body,

#hair,

#pupilLeft,

#pupilRight {

transform-box: fill-box;

transform-origin: center;

transition: transform 0.12s ease-out;

}

/* --- REAKCJE NA KLIK --- */

/* 1. uśmiech – chwilowa zmiana kształtu ust */

#mouth.smile {

animation: smileAnim 0.45s ease-out forwards;

}

@keyframes smileAnim {

0% {

d: path("M180 258 C187 254, 193 252, 200 252 C207 252, 213 254, 220 258 C214 263, 207 265, 200 265 C193 265, 186 263, 180 258 Z");

}

50% {

d: path("M178 258 C187 252, 193 250, 200 250 C207 250, 213 252, 222 258 C214 270, 207 274, 200 274 C193 274, 186 270, 178 258 Z");

}

100% {

d: path("M180 258 C187 254, 193 252, 200 252 C207 252, 213 254, 220 258 C214 263, 207 265, 200 265 C193 265, 186 263, 180 258 Z");

}

}

/* 2. podwójne szybkie mrugnięcie na klik w oczy */

.eyes-click-blink {

animation: eyesClickBlink 0.3s ease-in-out 1;

}

@keyframes eyesClickBlink {

0%, 100% { transform: scaleY(1); }

30%, 70% { transform: scaleY(0.12); }

}

/* 3. przytaknięcie głową */

#head.nod {

animation: headNod 0.35s ease-out 1;

}

@keyframes headNod {

0% { transform: translate(0px, 0px) rotate(0deg); }

40% { transform: translate(0px, 4px) rotate(3deg); }

70% { transform: translate(0px, -1px) rotate(-1deg); }

100% { transform: translate(0px, 0px) rotate(0deg); }

}

</style>

</head>

<script>

const svg = document.getElementById('avatar');

const character = document.getElementById('character');

const head = document.getElementById('head');

const body = document.getElementById('body');

const hair = document.getElementById('hair');

const pupilLeft = document.getElementById('pupilLeft');

const pupilRight = document.getElementById('pupilRight');

const eyesGroup = document.getElementById('eyesGroup');

const mouth = document.getElementById('mouth');

const faceHighlight = document.getElementById('faceHighlight');

const faceHighlightGrad = document.getElementById('faceHighlightGrad');

const shadowOffset = document.getElementById('shadowOffset');

const eyeLeftCenter = { x: 176, y: 205 };

const eyeRightCenter = { x: 224, y: 205 };

const pupilRadiusMax = 3; // maksymalne wychylenie źrenic

const faceCenter = { x: 200, y: 212 }; // środek twarzy w układzie SVG

// --- RUCH ZA MYSZĄ + cień + highlight twarzy ---

svg.addEventListener('mousemove', (e) => {

const rect = svg.getBoundingClientRect();

const relX = (e.clientX - rect.left) / rect.width - 0.5; // -0.5..0.5

const relY = (e.clientY - rect.top) / rect.height - 0.5;

const tiltY = relX * 6;

character.style.transform =

`translate(${relX 8}px, ${relY 6}px) rotate(${tiltY * 0.35}deg)`;

head.style.transform = `translate(${relX 4}px, ${relY 3}px)`;

hair.style.transform = `translate(${relX 5}px, ${relY 4}px)`;

body.style.transform = `translate(${relX 2}px, ${relY 1.5}px)`;

const mouseX = e.clientX - rect.left;

const mouseY = e.clientY - rect.top;

movePupil(pupilLeft, eyeLeftCenter, mouseX, mouseY);

movePupil(pupilRight, eyeRightCenter, mouseX, mouseY);

// cień delikatnie "odjeżdża" w przeciwną stronę

const shadowDx = -relX * 10;

const shadowDy = -relY * 8;

shadowOffset.setAttribute('dx', shadowDx.toFixed(1));

shadowOffset.setAttribute('dy', (4 + shadowDy).toFixed(1));

// podświetlenie twarzy: centrum między twarzą a kursorem

const svgX = (mouseX / rect.width) * 400;

const svgY = (mouseY / rect.height) * 500;

const highlightX = faceCenter.x + (svgX - faceCenter.x) * 0.35;

const highlightY = faceCenter.y + (svgY - faceCenter.y) * 0.35;

const cxPercent = (highlightX / 400) * 100;

const cyPercent = (highlightY / 500) * 100;

faceHighlightGrad.setAttribute('cx', `${cxPercent}%`);

faceHighlightGrad.setAttribute('cy', `${cyPercent}%`);

faceHighlight.setAttribute('opacity', '0.85');

});

svg.addEventListener('mouseleave', () => {

character.style.transform = 'translate(0px, 0px)';

head.style.transform = 'translate(0px, 0px)';

hair.style.transform = 'translate(0px, 0px)';

body.style.transform = 'translate(0px, 0px)';

pupilLeft.setAttribute('cx', eyeLeftCenter.x);

pupilLeft.setAttribute('cy', eyeLeftCenter.y + 1);

pupilRight.setAttribute('cx', eyeRightCenter.x);

pupilRight.setAttribute('cy', eyeRightCenter.y + 1);

// reset cienia i highlightu

shadowOffset.setAttribute('dx', '0');

shadowOffset.setAttribute('dy', '4');

faceHighlightGrad.setAttribute('cx', '50%');

faceHighlightGrad.setAttribute('cy', '35%');

faceHighlight.setAttribute('opacity', '0');

});

function movePupil(pupil, center, mouseX, mouseY) {

const dx = mouseX - center.x;

const dy = mouseY - center.y;

const angle = Math.atan2(dy, dx);

const dist = Math.min(Math.hypot(dx, dy), pupilRadiusMax);

const offsetX = Math.cos(angle) * dist;

const offsetY = Math.sin(angle) * dist;

pupil.setAttribute('cx', center.x + offsetX);

pupil.setAttribute('cy', center.y + offsetY);

}

// --- REAKCJE NA KLIK ---

// 1. klik w twarz (głowę) = przytaknięcie + uśmiech

head.addEventListener('click', () => {

head.classList.remove('nod');

void head.offsetWidth; // wymuszenie restartu animacji

head.classList.add('nod');

mouth.classList.remove('smile');

void mouth.offsetWidth;

mouth.classList.add('smile');

});

// 2. klik w oczy = szybkie podwójne mrugnięcie

eyesGroup.addEventListener('click', (e) => {

e.stopPropagation(); // żeby nie wywołać jednocześnie kliknięcia na head

eyesGroup.classList.remove('eyes-click-blink');

void eyesGroup.offsetWidth;

eyesGroup.classList.add('eyes-click-blink');

});

</script>
