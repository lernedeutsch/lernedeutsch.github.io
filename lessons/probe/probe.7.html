<!--

DOŁĄCZ TO DO LEKCJI 1

(Wstaw w miejscu, gdzie chcesz mieć dialog po przeczytaniu treści lekcji)

-->

<div id="dialog-practice" style="

max-width:1100px;

margin:24px auto 40px;

background:transparent;

padding:0;

font-family: Arial, sans-serif;

font-size:14px;

">

<h2 style="text-align:center; color:#1d4ed8; margin-bottom:6px; font-size:22px;">

🗣️ Dialog wiederholen – laut sprechen

</h2>

<p style="text-align:center; color:#0f766e; margin-bottom:18px; font-size:14px;">

Anna spricht → du siehst den Hinweis → sprich laut auf Deutsch

</p>

<!-- ZWEI SPALTEN: LINKS = DIALOG, RECHTS = BILDSCHIRM "du" -->

<div style="

display:flex;

flex-direction:row;

align-items:stretch;

justify-content:center;

gap:16px;

">

<!-- LINKES FENSTER: Dialog + Buttons + Ergebnis -->

<div style="

flex:0 0 56%;

max-width:56%;

border-radius:16px;

padding:14px 16px;

background:white;

box-shadow:0 4px 14px rgba(0,0,0,0.08);

box-sizing:border-box;

">

<!-- Dialog-Zeilen -->

<div id="dialog-lines" style="margin-bottom:12px; max-height:260px; overflow-y:auto;"></div>

<!-- Buttons -->

<div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;">

<button onclick="startDialog()" style="

background:#2563eb; color:white; border:none;

border-radius:999px; padding:8px 18px; font-size:14px; cursor:pointer;

">

▶ Start

</button>

<button onclick="repeatCurrent()" id="repeatBtn" style="

background:#16a34a; color:white; border:none;

border-radius:999px; padding:8px 18px; font-size:14px; cursor:pointer;

display:none;

">

🔄 <strong style="font-size:16px;">WIEDERHOLEN</strong>

</button>

<button onclick="pauseDialog()" id="pauseBtn" style="

background:#6b7280; color:white; border:none;

border-radius:999px; padding:8px 18px; font-size:14px; cursor:pointer;

">

⏸ Stopp

</button>

<button onclick="resumeDialog()" id="resumeBtn" style="

background:#0ea5e9; color:white; border:none;

border-radius:999px; padding:8px 18px; font-size:14px; cursor:pointer;

">

▶ Weiter

</button>

<button onclick="resetDialog()" style="

background:#ea580c; color:white; border:none;

border-radius:999px; padding:8px 18px; font-size:14px; cursor:pointer;

">

↺ Neustart

</button>

</div>

<!-- Ergebnis -->

<div id="result-area" style="

text-align:center; font-size:16px; min-height:32px;

padding:8px; border-radius:10px; background:#f8fafc;

"></div>

</div>

<!-- RECHTES FENSTER: was du sagst -->

<div style="

flex:0 0 44%;

max-width:44%;

border-radius:16px;

padding:14px 16px;

background:white;

box-shadow:0 4px 14px rgba(0,0,0,0.08);

box-sizing:border-box;

display:flex;

flex-direction:column;

"">

<div style="margin-bottom:6px;">

<h3 style="margin:0 0 4px; color:#1e3a8a; text-align:center; font-size:16px;">

🎧 Was du sagst

</h3>

<p style="margin:0; font-size:12px; color:#4b5563; text-align:center;">

Deine Wörter werden hier live angezeigt.

</p>

</div>

<div id="student-transcript" style="

flex:1;

margin-top:6px;

text-align:center;

font-size:18px;

line-height:1.4;

padding:12px;

border-radius:12px;

background:#eef2ff;

color:#111827;

border:1px dashed #93c5fd;

display:flex;

align-items:center;

justify-content:center;

min-height:130px;

">

Klicke auf „Start“ und sprich laut.

</div>

</div>

</div>

</div>

<script>

// --- DIALOG: Anna (Lehrerin) + du ---

const dialogSteps = [

{

speaker: "Anna",

text: "Hallo! Wie heißt du?",

answer: "Ich heiße [dein Name].",

patterns: ["ich heiße", "mein name ist", "ich bin"]

},

{

speaker: "du",

text: "",

hint: "<strong style='font-size:16px;'>WIEDERHOLEN</strong>: Ich heiße ...",

patterns: ["ich heiße", "mein name ist", "ich bin"]

},

{

speaker: "Anna",

text: "Guten Tag! Mein Name ist Anna Müller.",

answer: "Mein Name ist ...",

patterns: ["mein name ist", "ich heiße"]

},

{

speaker: "du",

text: "",

hint: "<strong style='font-size:16px;'>WIEDERHOLEN</strong>: Mein Name ist ...",

patterns: ["mein name ist", "ich heiße"]

},

{

speaker: "Anna",

text: "Wie heißen Sie höflich?",

answer: "Wie heißen Sie?",

patterns: ["wie heißen sie", "wie heissen sie"]

},

{

speaker: "du",

text: "",

hint: "<strong style='font-size:16px;'>WIEDERHOLEN</strong>: Wie heißen Sie?",

patterns: ["wie heißen sie", "wie heissen sie"]

},

{

speaker: "Anna",

text: "Auf Wiedersehen!",

answer: "Auf Wiedersehen!",

patterns: ["auf wiedersehen", "wiedersehen"]

},

{

speaker: "du",

text: "",

hint: "<strong style='font-size:16px;'>WIEDERHOLEN</strong>: Auf Wiedersehen!",

patterns: ["auf wiedersehen", "wiedersehen"]

}

];

const practiceSteps = dialogSteps.filter(step => step.speaker === "du");

let currentStep = 0;

let recognition = null;

let isListening = false;

let isPaused = false;

let lastFinalTranscript = ""; // zapamiętujemy ostatnią pełną odpowiedź

const linesContainer = document.getElementById("dialog-lines");

const resultArea = document.getElementById("result-area");

const repeatBtn = document.getElementById("repeatBtn");

const studentTranscript = document.getElementById("student-transcript");

// --- Dialog anzeigen ---

function renderDialog() {

linesContainer.innerHTML = "";



dialogSteps.forEach((step, idx) => {

const lineDiv = document.createElement("div");

lineDiv.style.cssText = `

display:flex; gap:8px; align-items:flex-start;

padding:8px; margin-bottom:4px; border-radius:8px;

border-bottom:1px solid #eee;

font-size:14px;

`;



if (idx === currentStep && step.speaker === "du") {

lineDiv.style.background = "#fff7d6";

lineDiv.style.borderLeft = "4px solid #f5b301";

lineDiv.style.paddingLeft = "10px";

}

const nameDiv = document.createElement("div");

nameDiv.style.cssText = `

min-width:70px; font-weight:700; color:#0f2f57; font-size:13px;

`;

nameDiv.textContent = step.speaker;

const textDiv = document.createElement("div");

textDiv.style.cssText = `

flex:1; font-size:14px; line-height:1.4; color:#111;

`;



if (step.speaker === "Anna") {

textDiv.textContent = step.text;

} else {

textDiv.innerHTML = step.hint || "";

textDiv.style.color = "#0b8043";

}

lineDiv.appendChild(nameDiv);

lineDiv.appendChild(textDiv);

linesContainer.appendChild(lineDiv);

});

}

// --- Sprachausgabe (Deutsch) ---

function speak(text) {

window.speechSynthesis.cancel();



const utterance = new SpeechSynthesisUtterance(text);

utterance.lang = "de-DE";

utterance.rate = 0.9;

utterance.pitch = 1;

const voices = window.speechSynthesis.getVoices();

const deVoice = voices.find(v =>

v.lang && v.lang.toLowerCase().startsWith("de") &&

v.name.toLowerCase().includes("de")

);

if (deVoice) utterance.voice = deVoice;

window.speechSynthesis.speak(utterance);

}

// --- Start des Dialogs ---

function startDialog() {

isPaused = false;

currentStep = -1;

resultArea.textContent = "";

resultArea.style.background = "#f8fafc";

repeatBtn.style.display = "none";

studentTranscript.textContent = "Hör gut zu und sprich danach laut.";

lastFinalTranscript = "";

renderDialog();

nextAnnaLine();

}

function nextAnnaLine() {

if (isPaused) return;

let nextIdx = currentStep + 1;

while (nextIdx < dialogSteps.length && dialogSteps[nextIdx].speaker !== "Anna") {

nextIdx++;

}

if (nextIdx >= dialogSteps.length) {

resultArea.style.background = "#dcfce7";

resultArea.style.color = "green";

resultArea.textContent = "✓ Perfekt! Der Dialog ist beendet.";

speak("Herzlichen Glückwunsch! Der Dialog ist beendet.");

repeatBtn.style.display = "none";

studentTranscript.textContent = lastFinalTranscript || "Dialog beendet. Bravo!";

return;

}

currentStep = nextIdx;

renderDialog();



const annaStep = dialogSteps[currentStep];

speak(annaStep.text);



setTimeout(() => {

if (!isPaused) findAndAskStudent();

}, 1400);

}

function findAndAskStudent() {

if (isPaused) return;

let duIdx = currentStep + 1;

while (duIdx < dialogSteps.length && dialogSteps[duIdx].speaker !== "du") {

duIdx++;

}

if (duIdx >= dialogSteps.length) {

nextAnnaLine();

return;

}

currentStep = duIdx;

renderDialog();



resultArea.textContent = "🎤 Sprich den Satz laut nach!";

resultArea.style.background = "#fff7d6";

repeatBtn.style.display = "inline-block";

// nie nadpisujemy tu ostatniej odpowiedzi, jeśli istniała

if (!lastFinalTranscript) {

studentTranscript.textContent = "Ich höre...";

}



startRecognition();

}

// --- Stopp / Pause ---

function pauseDialog() {

isPaused = true;

window.speechSynthesis.pause();

if (recognition) {

try { recognition.abort(); } catch(e) {}

}

isListening = false;

resultArea.textContent = "⏸ Dialog gestoppt. Klicke auf „Weiter“, um fortzusetzen.";

}

// --- Weiter ---

function resumeDialog() {

if (!isPaused) return;

isPaused = false;

window.speechSynthesis.resume();

resultArea.textContent = "";

const step = dialogSteps[currentStep];

if (step && step.speaker === "du") {

resultArea.textContent = "🎤 Sprich den Satz laut nach!";

startRecognition();

} else {

nextAnnaLine();

}

}

// --- Button: WIEDERHOLEN ---

function repeatCurrent() {

const step = dialogSteps[currentStep];

if (step && step.hint) {

const cleanHint = step.hint

.replace("<strong style='font-size:16px;'>WIEDERHOLEN</strong>:", "")

.trim();

speak(cleanHint);

}

}

// --- Spracherkennung mit Live-Text ---

function startRecognition() {

if (isListening || isPaused) return;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SR) {

resultArea.textContent = "❌ Bitte benutze Google Chrome oder Edge (Spracherkennung).";

resultArea.style.background = "#fee2e2";

resultArea.style.color = "#dc2626";

studentTranscript.textContent = "Dein Browser unterstützt keine Spracherkennung.";

return;

}

recognition = new SR();

recognition.lang = "de-DE";

recognition.continuous = false;

recognition.interimResults = true;

recognition.maxAlternatives = 2;

isListening = true;

lastFinalTranscript = ""; // czyścimy tylko na początku nowej próby

recognition.onresult = (event) => {

let transcript = "";

let finalText = "";



for (let i = event.resultIndex; i < event.results.length; i++) {

transcript += event.results[i][0].transcript;

if (event.results[i].isFinal) {

finalText = transcript;

}

}



// pokazujemy tekst na żywo

if (transcript) {

studentTranscript.textContent = transcript;

}

if (finalText.trim()) {

lastFinalTranscript = finalText.trim();

const step = dialogSteps[currentStep];



if (isCorrect(lastFinalTranscript, step.patterns)) {

isListening = false;

resultArea.style.background = "#dcfce7";

resultArea.style.color = "green";

resultArea.textContent = `✓ Sehr gut! „${lastFinalTranscript}"`;

// NIE nadpisujemy już później w onend – odpowiedź zostaje

speak("Sehr gut!");



setTimeout(() => {

if (!isPaused) nextAnnaLine();

}, 1400);

} else {

isListening = false;

resultArea.style.background = "#fee2e2";

resultArea.style.color = "#dc2626";

resultArea.textContent = `✗ Nicht ganz: „${lastFinalTranscript}". Bitte noch einmal!`;

speak("Bitte versuche es noch einmal.");

// odpowiedź ucznia zostaje widoczna

}

}

};

recognition.onerror = () => {

isListening = false;

if (isPaused) return;

resultArea.style.background = "#fee2e2";

resultArea.style.color = "#dc2626";

resultArea.textContent = "✗ Nicht erkannt. Bitte noch einmal sprechen.";

// nie czyścimy studentTranscript, pozostawiamy ostatni tekst jeśli był

};

recognition.onend = () => {

isListening = false;

if (isPaused) return;

// jeśli nic nie zostało nagrane, pokaż komunikat, ale nie kasuj dobrych odpowiedzi

if (!lastFinalTranscript && (!studentTranscript.textContent || studentTranscript.textContent === "Ich höre...")) {

studentTranscript.textContent = "Keine Antwort gehört. Bitte noch einmal.";

}

};

recognition.start();

}

// --- Antwort prüfen ---

function isCorrect(answer, patterns) {

const normalized = answer.toLowerCase()

.replace(/[.,!?¡¿]/g, "")

.trim();

for (let pattern of patterns) {

const normalizedPattern = pattern.toLowerCase()

.replace(/[.,!?¡¿]/g, "")

.trim();



if (normalized.includes(normalizedPattern)) {

return true;

}

}

return false;

}

// --- Neustart ---

function resetDialog() {

window.speechSynthesis.cancel();

if (recognition) {

try { recognition.abort(); } catch(e) {}

}

isListening = false;

isPaused = false;

lastFinalTranscript = "";

studentTranscript.textContent = "Klicke auf „Start“ und sprich laut.";

startDialog();

}

// --- Initialisierung ---

window.speechSynthesis.onvoiceschanged = () => {};

renderDialog();

</script>
