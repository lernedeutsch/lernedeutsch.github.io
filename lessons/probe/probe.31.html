<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Das deutsche Alphabet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#16233a;
  --paper:#fff8ea;
  --card:#fffdf7;
  --box:#fbf6e8;
  --line:#e3d6b8;
  --red:#bd4433;
  --gold:#cf9f3f;
  --text:#1c2430;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:28px 14px 55px;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 8%,rgba(207,159,63,.08),transparent 35%),
    radial-gradient(circle at 90% 92%,rgba(79,122,99,.1),transparent 40%),
    var(--bg);
  font:400 .94rem/1.45 "Nunito Sans",sans-serif;
}

button,input{font:inherit}
button{cursor:pointer}

.wrapper{
  width:min(900px,100%);
  margin:auto;
  padding:24px;
  background:linear-gradient(160deg,#fff8ea,#f3e2bd);
  border-radius:20px;
  box-shadow:0 18px 45px rgba(0,0,0,.22);
}

.part-head{
  display:flex;
  align-items:baseline;
  gap:12px;
  margin-bottom:12px;
}

.part-num{
  color:var(--red);
  font:.76rem "JetBrains Mono",monospace;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.part-title{
  margin:0;
  font:700 1.85rem/1.15 "Fraunces",serif;
}

.card{
  padding:20px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
}

.lead{
  margin:0 0 16px;
  font-size:1rem;
}

.alphabet{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:9px;
  margin:0 0 22px;
}

.alphabet-letter{
  min-width:0;
  padding:10px 5px;
  white-space:nowrap;
  color:var(--text);
  background:var(--box);
  border:1px solid var(--line);
  border-radius:11px;
  font-weight:800;
  transition:.15s;
}

.alphabet-letter:hover{
  background:#eaf3ff;
  border-color:#72b8ff;
  transform:translateY(-2px);
}

.alphabet-letter.active{
  color:#fff;
  background:var(--red);
  border-color:var(--red);
}

.subtitle{
  margin:20px 0 13px;
  font:700 1.28rem "Fraunces",serif;
}

.umlaute{
  grid-template-columns:repeat(4,minmax(90px,130px));
  margin-bottom:24px;
}

.spelling-box{
  padding:17px;
  background:var(--box);
  border:1px solid var(--line);
  border-radius:17px;
}

.spelling-title{
  margin:0 0 9px;
  font:700 1.25rem "Fraunces",serif;
}

.spelling-text{
  margin:0 0 13px;
}

.spelling-form{
  display:flex;
  gap:9px;
}

.name-input{
  flex:1;
  min-width:0;
  padding:9px 13px;
  border:2px solid var(--line);
  border-radius:11px;
  outline:none;
}

.name-input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(207,159,63,.18);
}

.spell-button{
  padding:9px 17px;
  color:#fff;
  white-space:nowrap;
  background:var(--red);
  border:0;
  border-radius:999px;
  font-weight:800;
}

.spell-button:hover{filter:brightness(1.08)}
.spell-button:disabled{cursor:default;opacity:.6}

.spelling-output{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  min-height:38px;
  margin-top:14px;
}

.letter-chip{
  min-width:38px;
  padding:6px 10px;
  text-align:center;
  background:#fff;
  border:2px solid var(--line);
  border-radius:9px;
  font:700 1rem "JetBrains Mono",monospace;
  transition:.18s;
}

.letter-chip.speaking{
  color:#fff;
  background:var(--gold);
  border-color:var(--gold);
  transform:scale(1.08);
}

.message{
  min-height:22px;
  margin:10px 0 0;
  color:var(--red);
  font-weight:700;
}

button:focus-visible,
input:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:2px;
}

@media(max-width:760px){
  body{padding:18px 9px 40px}

  .wrapper{padding:16px 11px}

  .part-title{font-size:1.55rem}

  .card{padding:15px 11px}

  .alphabet{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:7px;
  }

  .umlaute{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .alphabet-letter{
    padding:9px 4px;
    font-size:.9rem;
  }
}

@media(max-width:430px){
  .spelling-form{flex-direction:column}
  .spell-button{width:100%}
}

@media(prefers-reduced-motion:reduce){
  *{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<main class="wrapper">

  <div class="part-head">
    <span class="part-num">Teil 3</span>
    <h1 class="part-title">Das deutsche Alphabet</h1>
  </div>

  <section class="card">

    <p class="lead">
      Klicken Sie auf einen Buchstaben und hören Sie die deutsche Aussprache.
    </p>

    <div class="alphabet" id="alphabet"></div>

    <h2 class="subtitle">Die Umlaute</h2>

    <div class="alphabet umlaute" id="umlaute"></div>

    <div class="spelling-box">

      <h2 class="spelling-title">
        ✏️ Buchstabier deinen Namen
      </h2>

      <p class="spelling-text">
        Gib deinen Namen ein und höre ihn Buchstabe für Buchstabe auf Deutsch.
      </p>

      <div class="spelling-form">

        <input
          type="text"
          id="nameInput"
          class="name-input"
          placeholder="z. B. Anna"
          autocomplete="name"
        >

        <button
          type="button"
          id="spellButton"
          class="spell-button"
        >
          🔊 Buchstabieren
        </button>

      </div>

      <div
        id="spellingOutput"
        class="spelling-output"
        aria-live="polite"
      ></div>

      <p
        id="message"
        class="message"
        aria-live="polite"
      ></p>

    </div>

  </section>

</main>

<script>
"use strict";

const alphabetData = [
  ["A","a","ah"],
  ["B","be","beh"],
  ["C","ce","tseh"],
  ["D","de","deh"],
  ["E","e","eh"],
  ["F","ef","eff"],
  ["G","ge","geh"],
  ["H","ha","hah"],
  ["I","i","ih"],
  ["J","jot","jott"],
  ["K","ka","kah"],
  ["L","el","ell"],
  ["M","em","emm"],
  ["N","en","enn"],
  ["O","o","oh"],
  ["P","pe","peh"],
  ["Q","ku","kuh"],
  ["R","er","err"],
  ["S","es","ess"],
  ["T","te","teh"],
  ["U","u","uh"],
  ["V","vau","fau"],
  ["W","we","weh"],
  ["X","ix","iks"],
  ["Y","Ypsilon","Ypsilon"],
  ["Z","zet","tsett"]
];

const umlautData = [
  ["Ä","ä","Ä"],
  ["Ö","ö","Ö"],
  ["Ü","ü","Ü"],
  ["ß","Eszett","Eszett"]
];

const letterNames = Object.fromEntries(
  [...alphabetData,...umlautData].map(
    ([symbol,,speech])=>[symbol,speech]
  )
);

const alphabetElement =
  document.getElementById("alphabet");

const umlautElement =
  document.getElementById("umlaute");

const nameInput =
  document.getElementById("nameInput");

const spellButton =
  document.getElementById("spellButton");

const spellingOutput =
  document.getElementById("spellingOutput");

const message =
  document.getElementById("message");

let germanVoice = null;
let speechRun = 0;


function loadGermanVoice(){

  if(!("speechSynthesis" in window)){
    return;
  }

  const voices =
    window.speechSynthesis.getVoices();

  germanVoice =
    voices.find(voice =>
      voice.lang?.toLowerCase() === "de-de" &&
      voice.name?.toLowerCase().includes("google")
    ) ||

    voices.find(voice =>
      voice.lang?.toLowerCase() === "de-de"
    ) ||

    voices.find(voice =>
      voice.lang?.toLowerCase().startsWith("de")
    ) ||

    null;

}

loadGermanVoice();

if("speechSynthesis" in window){
  window.speechSynthesis.addEventListener(
    "voiceschanged",
    loadGermanVoice
  );
}


function stopSpeech(){

  speechRun++;

  if("speechSynthesis" in window){
    window.speechSynthesis.cancel();
  }

  document
    .querySelectorAll(".active,.speaking")
    .forEach(element=>
      element.classList.remove("active","speaking")
    );

  spellButton.disabled = false;

}


function speakGerman(text,rate=.74){

  return new Promise(resolve=>{

    if(
      !text ||
      !("speechSynthesis" in window)
    ){
      message.textContent =
        "Die Sprachausgabe wird nicht unterstützt.";

      resolve();
      return;
    }

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "de-DE";
    utterance.rate = rate;
    utterance.pitch = 1;
    utterance.volume = 1;

    if(germanVoice){
      utterance.voice = germanVoice;
    }

    utterance.onend = resolve;
    utterance.onerror = resolve;

    window.speechSynthesis.speak(utterance);

  });

}


function createLetters(target,data){

  target.innerHTML = data.map(
    ([symbol,label,speech])=>`
      <button
        type="button"
        class="alphabet-letter"
        data-speech="${speech}"
        aria-label="${symbol} anhören"
      >
        ${symbol} – ${label}
      </button>
    `
  ).join("");

}

createLetters(alphabetElement,alphabetData);
createLetters(umlautElement,umlautData);


document
  .querySelectorAll(".alphabet-letter")
  .forEach(button=>{

    button.addEventListener("click",async()=>{

      stopSpeech();

      const currentRun = speechRun;

      button.classList.add("active");

      await speakGerman(
        button.dataset.speech,
        .7
      );

      if(currentRun === speechRun){
        button.classList.remove("active");
      }

    });

  });


async function spellName(){

  stopSpeech();

  message.textContent = "";

  const name =
    nameInput.value.trim();

  if(!name){

    message.textContent =
      "Bitte gib deinen Namen ein.";

    nameInput.focus();
    return;

  }

  const letters =
    Array.from(name.toLocaleUpperCase("de-DE"))
      .filter(letter=>letterNames[letter]);

  if(!letters.length){

    message.textContent =
      "Der Name enthält keine unterstützten Buchstaben.";

    return;

  }

  spellingOutput.innerHTML =
    letters.map(
      (letter,index)=>`
        <span
          class="letter-chip"
          id="letter-${index}"
        >
          ${letter}
        </span>
      `
    ).join("");

  spellButton.disabled = true;

  const currentRun = speechRun;

  for(let index=0;index<letters.length;index++){

    if(currentRun !== speechRun){
      break;
    }

    const chip =
      document.getElementById(`letter-${index}`);

    chip.classList.add("speaking");

    await speakGerman(
      letterNames[letters[index]],
      .68
    );

    chip.classList.remove("speaking");

    await new Promise(resolve=>
      setTimeout(resolve,120)
    );

  }

  spellButton.disabled = false;

}


spellButton.addEventListener(
  "click",
  spellName
);

nameInput.addEventListener(
  "keydown",
  event=>{

    if(event.key === "Enter"){
      spellName();
    }

  }
);

window.addEventListener(
  "beforeunload",
  stopSpeech
);

</script>

</body>
</html>
