<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ich stelle mich vor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#16233a;
  --line:#e3d6b8;
  --text:#1c2430;
  --red:#bd4433;
  --green:#315f4c;
  --informell:#58755f;
  --informell-border:#46614e;
  --formell:#a65e4f;
  --formell-border:#8f4c40;
  --bubble-a:#eee9dc;
  --bubble-b:#e8c989;
  --bubble-b-border:#d2a94f
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:25px 18px;
  color:var(--text);
  font-family:"Nunito Sans",sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(207,159,63,.08),transparent 35%),
    radial-gradient(circle at 85% 90%,rgba(79,122,99,.1),transparent 40%),
    var(--bg)
}

.lesson-page{
  width:min(100%,860px);
  margin:auto;
  padding:24px 28px 30px;
  background:linear-gradient(145deg,#fff9ec,#f3e3bf);
  border:1px solid rgba(227,214,184,.8);
  border-radius:20px;
  box-shadow:0 18px 42px rgba(0,0,0,.28)
}

.part-heading{
  display:flex;
  align-items:baseline;
  gap:14px;
  margin:0 0 17px;
  padding-bottom:9px;
  border-bottom:1px solid rgba(28,36,48,.12)
}

.part-number{
  color:var(--red);
  font:600 .72rem "JetBrains Mono",monospace;
  letter-spacing:.18em;
  text-transform:uppercase
}

.part-title{
  margin:0;
  color:#161616;
  font:700 2.15rem/1.15 "Fraunces",serif
}

.card{
  padding:21px 22px 20px;
  background:rgba(255,253,247,.88);
  border:1px solid var(--line);
  border-radius:19px;
  box-shadow:0 10px 24px rgba(0,0,0,.08)
}

.description{
  margin:0 0 14px;
  font-size:1rem;
  line-height:1.45
}

.name-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:17px
}

.name-row label{
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:none;
  font-size:.96rem;
  font-weight:800
}

.pen-icon{
  font-size:1rem;
  line-height:1
}

.name-row input{
  flex:1;
  min-width:0;
  padding:10px 14px;
  color:var(--text);
  background:#fff;
  border:2px solid var(--line);
  border-radius:11px;
  font:400 .96rem "Nunito Sans",sans-serif;
  transition:border-color .18s,box-shadow .18s
}

.name-row input:focus{
  outline:none;
  border-color:#cf9f3f;
  box-shadow:0 0 0 4px rgba(207,159,63,.16)
}

.tab-buttons{
  display:flex;
  align-items:center;
  gap:76px;
  margin-bottom:15px
}

.tab-button{
  min-width:122px;
  padding:9px 20px;
  color:#3b3026;
  background:#f5efe1;
  border:2px solid var(--line);
  border-radius:9px;
  font:800 .92rem "Nunito Sans",sans-serif;
  cursor:pointer;
  transition:.16s
}

.tab-button:hover{
  transform:translateY(-2px);
  border-color:#cf9f3f;
  box-shadow:0 5px 12px rgba(0,0,0,.1)
}

#tab-informell.active{
  color:#fff;
  background:var(--informell);
  border-color:var(--informell-border);
  box-shadow:0 5px 12px rgba(70,97,78,.25)
}

#tab-formell.active{
  color:#fff;
  background:var(--formell);
  border-color:var(--formell-border);
  box-shadow:0 5px 12px rgba(143,76,64,.25)
}

.dialog-box{
  display:grid;
  gap:14px;
  min-height:330px;
  padding:19px 18px;
  background:rgba(255,255,255,.34);
  border:2px solid var(--line);
  border-radius:16px
}

.dialog-box[hidden]{display:none}

.bubble{
  position:relative;
  padding:11px 16px;
  color:#171717;
  border-radius:15px;
  font-family:"Nunito Sans",sans-serif;
  font-size:1rem;
  font-weight:400;
  line-height:1.45;
  box-shadow:0 4px 10px rgba(0,0,0,.045);
  transition:transform .18s,box-shadow .18s,border-color .18s
}

.bubble-a{
  width:72%;
  max-width:580px;
  margin-right:auto;
  background:var(--bubble-a);
  border:1px solid #e2dccd;
  border-bottom-left-radius:7px
}

.bubble-b{
  width:40%;
  min-width:220px;
  max-width:330px;
  margin-left:auto;
  background:linear-gradient(145deg,#f0d89f,var(--bubble-b));
  border:1px solid var(--bubble-b-border);
  border-bottom-right-radius:7px;
  box-shadow:0 6px 13px rgba(153,109,25,.15)
}

.speaker{
  display:block;
  margin-bottom:3px;
  color:var(--red);
  font:600 .65rem "JetBrains Mono",monospace;
  letter-spacing:.12em;
  text-transform:uppercase
}

/* Emotikonka osoby A */

.person-icon{
  position:absolute;
  top:50%;
  right:13px;
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border:1px solid rgba(79,122,99,.32);
  border-radius:10px;
  background:#fffaf0;
  font-size:1.25rem;
  opacity:0;
  pointer-events:none;
  transform:translateY(-50%) scale(.55);
  transition:opacity .2s,transform .2s;
  box-shadow:0 4px 10px rgba(0,0,0,.1)
}

.bubble-a.speaking{
  padding-right:60px;
  border-color:#7a9b83;
  transform:translateY(-1px);
  box-shadow:0 7px 16px rgba(49,95,76,.15)
}

.bubble-a.speaking .person-icon{
  opacity:1;
  transform:translateY(-50%) scale(1)
}

.read-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-top:13px;
  padding:9px 19px;
  color:#fff;
  background:linear-gradient(#3e755e,var(--green));
  border:0;
  border-radius:999px;
  font:800 .9rem "Nunito Sans",sans-serif;
  cursor:pointer;
  box-shadow:0 6px 13px rgba(49,95,76,.24);
  transition:.16s
}

.read-button:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
  box-shadow:0 9px 16px rgba(49,95,76,.3)
}

.read-button:disabled{
  cursor:not-allowed;
  opacity:.65;
  transform:none
}

@media(max-width:720px){
  body{padding:16px 9px}

  .lesson-page{
    padding:20px 13px 24px;
    border-radius:15px
  }

  .part-heading{gap:9px}
  .part-title{font-size:1.78rem}
  .card{padding:18px 13px}

  .name-row{
    align-items:stretch;
    flex-direction:column;
    gap:7px
  }

  .tab-buttons{
    justify-content:flex-start;
    gap:35px
  }

  .tab-button{
    min-width:115px;
    padding:9px 12px
  }

  .dialog-box{
    min-height:0;
    padding:16px 11px;
    gap:13px
  }

  .bubble-a{width:82%}

  .bubble-b{
    width:58%;
    min-width:0
  }
}

@media(max-width:430px){
  .part-heading{display:block}

  .part-number{
    display:block;
    margin-bottom:5px
  }

  .part-title{font-size:1.6rem}
  .description{font-size:.95rem}
  .tab-buttons{gap:18px}

  .tab-button{
    flex:1;
    min-width:0;
    padding:9px 8px
  }

  .bubble{padding:10px 13px}
  .bubble-a{width:90%}
  .bubble-b{width:72%}

  .bubble-a.speaking{
    padding-right:54px
  }

  .person-icon{
    right:10px;
    width:31px;
    height:31px;
    font-size:1.1rem
  }

  .read-button{width:100%}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    transition-duration:.01ms!important
  }
}
</style>
</head>

<body>

<main class="lesson-page">

  <header class="part-heading">
    <span class="part-number">Teil 2</span>
    <h1 class="part-title">Ich stelle mich vor</h1>
  </header>

  <section class="card">

    <p class="description">
      Trag deinen Namen ein — die Dialoge passen sich an!
    </p>

    <div class="name-row">
      <label for="mein-name">
        <span class="pen-icon" aria-hidden="true">✏️</span>
        <span>Dein Name:</span>
      </label>

      <input
        id="mein-name"
        type="text"
        value="Moni"
        placeholder="z. B. Moni"
        autocomplete="given-name"
      >
    </div>

    <div class="tab-buttons" role="tablist" aria-label="Dialogform auswählen">

      <button
        class="tab-button active"
        id="tab-informell"
        type="button"
        data-dialog="informell"
        role="tab"
        aria-selected="true"
        aria-controls="dialog-informell"
      >
        Informell
      </button>

      <button
        class="tab-button"
        id="tab-formell"
        type="button"
        data-dialog="formell"
        role="tab"
        aria-selected="false"
        aria-controls="dialog-formell"
      >
        Formell
      </button>

    </div>

    <!-- Dialog nieformalny -->

    <div
      class="dialog-box"
      id="dialog-informell"
      role="tabpanel"
      aria-labelledby="tab-informell"
    >
      <div class="bubble bubble-a" data-speaker="A">
        <span class="speaker">A</span>
        Hallo!
        <span class="person-icon" aria-hidden="true">🙂</span>
      </div>

      <div class="bubble bubble-b" data-speaker="B">
        <span class="speaker">B</span>
        Wie heißt du?
      </div>

      <div class="bubble bubble-a" data-speaker="A">
        <span class="speaker">A</span>
        Ich heiße <span class="dynamic-name">Moni</span>.
        <span class="person-icon" aria-hidden="true">🙂</span>
      </div>

      <div class="bubble bubble-b" data-speaker="B">
        <span class="speaker">B</span>
        Und du?
      </div>

      <div class="bubble bubble-a" data-speaker="A">
        <span class="speaker">A</span>
        Ich heiße Tom.
        <span class="person-icon" aria-hidden="true">🙂</span>
      </div>
    </div>

    <!-- Dialog formalny -->

    <div
      class="dialog-box"
      id="dialog-formell"
      role="tabpanel"
      aria-labelledby="tab-formell"
      hidden
    >
      <div class="bubble bubble-a" data-speaker="A">
        <span class="speaker">A</span>
        Guten Tag.
        <span class="person-icon" aria-hidden="true">🧑‍💼</span>
      </div>

      <div class="bubble bubble-b" data-speaker="B">
        <span class="speaker">B</span>
        Wie heißen Sie?
      </div>

      <div class="bubble bubble-a" data-speaker="A">
        <span class="speaker">A</span>
        Ich heiße <span class="dynamic-name">Moni</span>.
        <span class="person-icon" aria-hidden="true">🧑‍💼</span>
      </div>

      <div class="bubble bubble-b" data-speaker="B">
        <span class="speaker">B</span>
        Und Sie?
      </div>

      <div class="bubble bubble-a" data-speaker="A">
        <span class="speaker">A</span>
        Ich heiße Julia.
        <span class="person-icon" aria-hidden="true">🧑‍💼</span>
      </div>
    </div>

    <button class="read-button" id="dialog-read-button" type="button">
      <span aria-hidden="true">🔊</span>
      <span>Dialog vorlesen</span>
    </button>

  </section>
</main>

<script>
"use strict";

const synth=window.speechSynthesis;
const nameInput=document.getElementById("mein-name");
const nameElements=document.querySelectorAll(".dynamic-name");
const tabs=document.querySelectorAll(".tab-button");
const readButton=document.getElementById("dialog-read-button");

const dialogs={
  informell:document.getElementById("dialog-informell"),
  formell:document.getElementById("dialog-formell")
};

let activeDialog="informell";
let germanVoice=null;
let reading=false;

function loadVoice(){
  if(!synth)return;

  const voices=synth.getVoices();

  germanVoice=
    voices.find(v=>v.lang?.toLowerCase()==="de-de"&&v.name.toLowerCase().includes("google"))||
    voices.find(v=>v.lang?.toLowerCase()==="de-de")||
    voices.find(v=>v.lang?.toLowerCase().startsWith("de"))||
    null;
}

loadVoice();
synth?.addEventListener("voiceschanged",loadVoice);

function speak(text){
  return new Promise(resolve=>{
    if(!text||!synth){
      resolve();
      return;
    }

    const utterance=new SpeechSynthesisUtterance(text);

    utterance.lang="de-DE";
    utterance.rate=.92;
    utterance.pitch=1;
    utterance.volume=1;

    if(germanVoice)utterance.voice=germanVoice;

    utterance.onend=resolve;

    utterance.onerror=e=>{
      if(e.error!=="canceled"&&e.error!=="interrupted"){
        console.error("Fehler bei der Sprachausgabe:",e.error);
      }
      resolve();
    };

    synth.speak(utterance);
  });
}

function updateName(){
  const name=nameInput.value.trim()||"Moni";
  nameElements.forEach(element=>element.textContent=name);
}

function clearSpeaking(){
  document.querySelectorAll(".bubble.speaking")
    .forEach(bubble=>bubble.classList.remove("speaking"));
}

nameInput.addEventListener("input",updateName);
updateName();

tabs.forEach(button=>{
  button.addEventListener("click",()=>{
    reading=false;
    synth?.cancel();
    clearSpeaking();

    activeDialog=button.dataset.dialog;

    tabs.forEach(tab=>{
      const active=tab===button;
      tab.classList.toggle("active",active);
      tab.setAttribute("aria-selected",String(active));
    });

    Object.entries(dialogs).forEach(([name,dialog])=>{
      dialog.hidden=name!==activeDialog;
    });

    readButton.disabled=false;
    readButton.innerHTML="🔊 <span>Dialog vorlesen</span>";
  });
});

function getSpeechText(bubble){
  const copy=bubble.cloneNode(true);

  copy.querySelector(".speaker")?.remove();
  copy.querySelector(".person-icon")?.remove();

  return copy.textContent.replace(/\s+/g," ").trim();
}

readButton.addEventListener("click",async()=>{
  if(!synth){
    alert("Ihr Browser unterstützt die Sprachausgabe nicht.");
    return;
  }

  synth.cancel();
  clearSpeaking();

  reading=true;
  readButton.disabled=true;
  readButton.innerHTML="🔊 <span>Dialog wird vorgelesen …</span>";

  const bubbles=[...dialogs[activeDialog].querySelectorAll(".bubble")];

  for(const bubble of bubbles){
    if(!reading)break;

    clearSpeaking();

    if(bubble.dataset.speaker==="A"){
      bubble.classList.add("speaking");
    }

    await speak(getSpeechText(bubble));
    bubble.classList.remove("speaking");
  }

  clearSpeaking();
  reading=false;
  readButton.disabled=false;
  readButton.innerHTML="🔊 <span>Dialog vorlesen</span>";
});

window.addEventListener("beforeunload",()=>{
  reading=false;
  synth?.cancel();
  clearSpeaking();
});
</script>

</body>
</html>
