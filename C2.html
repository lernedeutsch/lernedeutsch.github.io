<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Deutsch lernen – Lektion 1</title>

<style>
    body{
        font-family: Arial, sans-serif;
        max-width:800px;
        margin:auto;
        padding:20px;
        line-height:1.6;
    }

    .chat-wrapper{
        display:flex;
        gap:15px;
        margin:20px 0;
    }

    .chat-panel{
        border:1px solid #ccc;
        height:350px;
        overflow-y:auto;
        padding:15px;
        background:#fafafa;
        position:relative;
        overflow:hidden;
    }

    #chatLeft{
        flex:1;
    }

    #chatRight{
        flex:3;
    }

    .bot{
        color:darkblue;
        margin:10px 0;
    }

    .user{
        color:green;
        margin:10px 0;
    }

    button{
        padding:10px 20px;
        font-size:16px;
        cursor:pointer;
        margin-right:10px;
    }

    #micButton{
        background-color: #4CAF50;
        color: white;
    }

    #micButton.waiting{
        background-color: #ff4444;
        color: white;
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.7; }
        100% { opacity: 1; }
    }

    #status{
        font-weight:bold;
    }

    .waves {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 180px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
    }

    #chatRight.listening .waves,
    #chatRight.speaking .waves{
        opacity: 1;
    }

    .wave-group{
        transform-origin: center;
        animation: wavePulse 1.2s linear infinite;
    }

    .wave-group.wave2{ animation-duration: 0.9s; }
    .wave-group.wave3{ animation-duration: 0.7s; }

    @keyframes wavePulse{
        0% { transform: translateX(-24px) scaleY(0.85); }
        20% { transform: translateX(-10px) scaleY(1.15); }
        40% { transform: translateX(10px) scaleY(0.9); }
        60% { transform: translateX(24px) scaleY(1.2); }
        80% { transform: translateX(10px) scaleY(0.88); }
        100% { transform: translateX(-24px) scaleY(0.85); }
    }

    .wave-line{
        fill: none;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 2px rgba(76,175,80,0.25));
    }

    .wave1{
        stroke: rgba(76,175,80,0.9);
    }

    .wave2{
        stroke: rgba(76,175,80,0.65);
    }

    .wave3{
        stroke: rgba(76,175,80,0.38);
    }
</style>
</head>

<body>

<h1>Deutsch lernen von Anfang an</h1>

<h2>Lektion 1 – Guten Tag!</h2>

<p>Thema: Sich kennenlernen und ein kurzes Gespräch führen.</p>

<ul>
<li>Guten Tag</li>
<li>Hallo</li>
<li>Ich heiße ...</li>
<li>Mein Name ist ...</li>
<li>Wie geht es dir?</li>
<li>Gut, danke.</li>
<li>Ich komme aus ...</li>
<li>Tschüss</li>
</ul>

<h2>Nele</h2>

<div class="chat-wrapper">
    <div id="chatLeft" class="chat-panel"></div>
    <div id="chatRight" class="chat-panel">
        <svg class="waves" id="wavesSvg" viewBox="0 0 800 180" preserveAspectRatio="none">
            <g class="wave-group wave1">
                <path class="wave-line wave1" d="M0,90 L30,90 L45,60 L60,120 L75,40 L90,140 L105,30 L120,150 L135,50 L150,110 L165,70 L180,90 L210,90 L225,55 L240,130 L255,35 L270,145 L285,25 L300,155 L315,45 L330,115 L345,75 L360,90 L390,90 L405,58 L420,132 L435,38 L450,148 L465,28 L480,152 L495,48 L510,112 L525,72 L540,90 L570,90 L585,62 L600,126 L615,42 L630,138 L645,32 L660,150 L675,52 L690,108 L705,78 L720,90 L750,90 L765,56 L780,128 L795,44"></path>
            </g>
            <g class="wave-group wave2">
                <path class="wave-line wave2" d="M0,105 L24,105 L36,82 L48,128 L60,54 L72,148 L84,38 L96,156 L108,30 L120,140 L132,68 L144,105 L180,105 L192,80 L204,132 L216,50 L228,146 L240,34 L252,158 L264,26 L276,138 L288,70 L300,105 L336,105 L348,84 L360,130 L372,56 L384,146 L396,40 L408,154 L420,32 L432,140 L444,72 L456,105 L492,105 L504,82 L516,128 L528,54 L540,148 L552,38 L564,156 L576,30 L588,140 L600,68 L612,105 L648,105 L660,80 L672,132 L684,50 L696,146 L708,34 L720,158 L732,26 L744,138 L756,70 L768,105"></path>
            </g>
            <g class="wave-group wave3">
                <path class="wave-line wave3" d="M0,70 L16,70 L24,48 L32,92 L40,30 L48,110 L56,22 L64,118 L72,26 L80,100 L88,56 L96,70 L120,70 L128,46 L136,94 L144,34 L152,112 L160,20 L168,120 L176,28 L184,102 L192,60 L200,70 L224,70 L232,50 L240,90 L248,32 L256,108 L264,24 L272,116 L280,26 L288,98 L296,54 L304,70 L328,70 L336,48 L344,92 L352,30 L360,110 L368,22 L376,118 L384,26 L392,100 L400,56 L408,70 L432,70 L440,46 L448,94 L456,34 L464,112 L472,20 L480,120 L488,28 L496,102 L504,60 L512,70"></path>
            </g>
        </svg>
    </div>
</div>

<button onclick="startLesson()">
▶ Lektion starten
</button>

<button id="micButton" onclick="listenAnswer()">
🎤 Mit dem Mikrofon antworten
</button>

<p id="status">
Status: Bereit
</p>

<script>

const chatLeft = document.getElementById("chatLeft");
const chatRight = document.getElementById("chatRight");
const statusText = document.getElementById("status");
const micButton = document.getElementById("micButton");

let lessonStep = 0;
let isWaitingForAnswer = false;
let selectedVoice = null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if(SpeechRecognition){
    recognition = new SpeechRecognition();

    recognition.lang = "de-DE";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = function(event){

        const answer =
            event.results[0][0].transcript.trim();

        statusText.textContent =
            "Status: Antwort erkannt";

        micButton.classList.remove("waiting");
        isWaitingForAnswer = false;
        chatRight.classList.remove("listening");

        addUser(answer);

        evaluate(answer);
    };

    recognition.onerror = function(){

        statusText.textContent =
            "Status: Mikrofonfehler";

        micButton.classList.remove("waiting");
        isWaitingForAnswer = false;
        chatRight.classList.remove("listening");
    };
}

function addBot(text){

    chatLeft.innerHTML +=
        `<div class="bot"><b>🤖 Nele:</b> ${text}</div>`;

    chatLeft.scrollTop = chatLeft.scrollHeight;

    chatRight.classList.add("speaking");
    chatRight.classList.remove("listening");

    speak(text);

    micButton.classList.add("waiting");
    isWaitingForAnswer = true;
}

function addUser(text){

    chatLeft.innerHTML +=
        `<div class="user"><b>🧑 Du:</b> ${text}</div>`;

    chatLeft.scrollTop = chatLeft.scrollHeight;
}

function speak(text){

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    const voices =
        speechSynthesis.getVoices();

    selectedVoice = voices.find(voice =>
        voice.lang === "de-DE" &&
        voice.name.toLowerCase().includes("google") &&
        voice.name.toLowerCase().includes("female")
    );

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("helene")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("katja")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("google")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice => voice.lang === "de-DE");
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice => voice.lang.startsWith("de"));
    }

    if(selectedVoice){
        utterance.voice = selectedVoice;
    }

    utterance.lang = "de-DE";
    utterance.rate = 0.95;
    utterance.pitch = 1.05;
    utterance.volume = 1;

    utterance.onend = function(){
        chatRight.classList.remove("speaking");
    };

    speechSynthesis.speak(utterance);
}

function startLesson(){

    chatLeft.innerHTML = "";
    chatRight.classList.remove("listening");
    chatRight.classList.remove("speaking");

    lessonStep = 1;
    isWaitingForAnswer = false;
    micButton.classList.remove("waiting");

    if(!selectedVoice){
        const voices = speechSynthesis.getVoices();
        selectedVoice = voices.find(voice => voice.lang === "de-DE");
        if(!selectedVoice){
            selectedVoice = voices.find(voice => voice.lang.startsWith("de"));
        }
    }

    addBot(
        "Guten Tag! Ich heiße Nele. Wie heißt du?"
    );
}

function listenAnswer(){

    if(!recognition){

        statusText.textContent =
            "Status: Spracheingabe wird nicht unterstützt.";

        return;
    }

    if(!isWaitingForAnswer){

        statusText.textContent =
            "Status: Nele wartet noch nicht auf deine Antwort.";

        return;
    }

    statusText.textContent =
        "Status: Ich höre zu ...";

    chatRight.classList.add("listening");
    recognition.start();
}

function evaluate(answer){

    const text = answer.toLowerCase();

    if(lessonStep === 1){

        if(
            text.includes("ich heiße") ||
            text.includes("mein name ist")
        ){

            addBot(
                "Freut mich! Wie geht es dir?"
            );

            lessonStep = 2;

        }else{

            addBot(
                "Ich habe deinen Namen nicht verstanden. Du kannst sagen: Ich heiße Anna. Wie heißt du?"
            );
        }

        return;
    }

    if(lessonStep === 2){

        if(
            text.includes("gut") ||
            text.includes("sehr gut") ||
            text.includes("prima") ||
            text.includes("super") ||
            text.includes("es geht")
        ){

            addBot(
                "Schön! Woher kommst du?"
            );

            lessonStep = 3;

        }else{

            addBot(
                "Ich habe dich nicht ganz verstanden. Du kannst sagen: Gut, danke. Wie geht es dir?"
            );
        }

        return;
    }

    if(lessonStep === 3){

        if(
            text.includes("ich komme aus")
        ){

            addBot(
                "Interessant! Was machst du gern in deiner Freizeit?"
            );

            lessonStep = 4;

        }else{

            addBot(
                "Du kannst zum Beispiel sagen: Ich komme aus Polen. Woher kommst du?"
            );
        }

        return;
    }

    if(lessonStep === 4){

        if(
            text.length > 2
        ){

            addBot(
                "Das klingt interessant. Ich muss jetzt leider gehen."
            );

            lessonStep = 5;

        }else{

            addBot(
                "Erzähl mir etwas über deine Freizeit."
            );
        }

        return;
    }

    if(lessonStep === 5){

        if(
            text.includes("tschüss") ||
            text.includes("auf wiedersehen") ||
            text.includes("bis bald") ||
            text.includes("bis später")
        ){

            addBot(
                "Tschüss! Schön, mit dir Deutsch zu sprechen."
            );

            lessonStep = 6;

        }else{

            addBot(
                "Ich gehe jetzt. Was sagt man zum Abschied?"
            );
        }

        return;
    }

    if(lessonStep === 6){

        addBot(
            "Danke für das Gespräch! Starte die Lektion gern noch einmal."
        );
    }
}

speechSynthesis.onvoiceschanged = function() {
    const voices = speechSynthesis.getVoices();

    selectedVoice = voices.find(voice =>
        voice.lang === "de-DE" &&
        voice.name.toLowerCase().includes("google") &&
        voice.name.toLowerCase().includes("female")
    );

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("helene")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("katja")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("google")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice => voice.lang === "de-DE");
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice => voice.lang.startsWith("de"));
    }
};

</script>

</body>
</html>
