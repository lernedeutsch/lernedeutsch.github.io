<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<title>Deutsch lernen – Lektion 1</title>



<style>

    body{

        font-family: Arial, sans-serif;

        max-width:800px;

        margin:auto;

        padding:20px;

        line-height:1.6;

    }



    .chat-wrapper{

        display:flex;

        gap:15px;

        margin:20px 0;

    }



    .chat-panel{

        border:1px solid #ccc;

        height:350px;

        overflow-y:auto;

        padding:15px;

        background:#fafafa;

        position:relative;

        overflow:hidden;

    }



    #chatLeft{

        flex:1;

    }



    #chatRight{

        flex:3;

    }



    .bot{

        color:darkblue;

        margin:10px 0;

    }



    .user{

        color:green;

        margin:10px 0;

    }



    button{

        padding:10px 20px;

        font-size:16px;

        cursor:pointer;

        margin-right:10px;

    }



    #micButton{

        background-color: #4CAF50;

        color: white;

    }



    #micButton.waiting{

        background-color: #ff4444;

        color: white;

        animation: pulse 1s infinite;

    }



    @keyframes pulse {

        0% { opacity: 1; }

        50% { opacity: 0.7; }

        100% { opacity: 1; }

    }



    #status{

        font-weight:bold;

    }



    .waves {

        position: absolute;

        left: 0;

        bottom: 0;

        width: 100%;

        height: 90px;

        opacity: 0;

        pointer-events: none;

        transition: opacity 0.15s ease;

        z-index: 1;

    }



    #chatRight.listening .waves,

    #chatRight.speaking .waves{

        opacity: 1;

    }



    .wave-group{

        transform-origin: center;

        animation: wavePulse 1.2s linear infinite;

    }



    .wave-group.wave2{ animation-duration: 0.9s; }

    .wave-group.wave3{ animation-duration: 0.7s; }



    @keyframes wavePulse{

        0% { transform: translateX(-24px) scaleY(0.85); }

        20% { transform: translateX(-10px) scaleY(1.15); }

        40% { transform: translateX(10px) scaleY(0.9); }

        60% { transform: translateX(24px) scaleY(1.2); }

        80% { transform: translateX(10px) scaleY(0.88); }

        100% { transform: translateX(-24px) scaleY(0.85); }

    }



    .wave-line{

        fill: none;

        stroke-width: 5;

        stroke-linecap: round;

        stroke-linejoin: round;

        filter: drop-shadow(0 0 2px rgba(0,0,0,0.12));

    }



    .wave1{

        stroke: rgba(0,0,0,0.85);

    }



    .wave2{

        stroke: rgba(120,75,35,0.78);

    }



    .wave3{

        stroke: rgba(120,120,120,0.78);

    }



    .voice-figure{

        position: absolute;

        right: 24px;

        top: 24px;

        width: 190px;

        height: 250px;

        z-index: 2;

        display: flex;

        align-items: center;

        justify-content: center;

        pointer-events: none;

    }



    .voice-figure .head{

        position: absolute;

        top: 0;

        width: 98px;

        height: 112px;

        border-radius: 50% / 56%;

        background: linear-gradient(180deg, #d7ad84 0%, #c79468 100%);

        border: 3px solid rgba(80,80,80,0.16);

        overflow: hidden;

        box-shadow: 0 2px 6px rgba(0,0,0,0.12);

    }



    .voice-figure .hair-back{

        position: absolute;

        top: 0px;

        left: 50%;

        transform: translateX(-50%);

        width: 100px;

        height: 114px;

        border-radius: 50%;

        background: #d8a12f;

        clip-path: polygon(12% 4%, 28% 0%, 50% 0%, 72% 0%, 88% 4%, 98% 16%, 100% 34%, 100% 78%, 90% 98%, 70% 100%, 50% 98%, 30% 100%, 10% 98%, 0% 78%, 0% 34%, 2% 16%);

        z-index: 0;

    }



    .voice-figure .hair-front{

        position: absolute;

        top: -1px;

        left: 7px;

        width: 84px;

        height: 62px;

        border-radius: 50% 50% 42% 42%;

        background: linear-gradient(180deg, #f4c55f 0%, #d79a20 100%);

        clip-path: polygon(0 44%, 6% 14%, 18% 4%, 32% 0%, 48% 6%, 62% 2%, 76% 6%, 90% 18%, 100% 40%, 96% 54%, 84% 50%, 72% 58%, 60% 50%, 48% 60%, 36% 54%, 24% 62%, 12% 56%, 0 64%);

        transform: rotate(-4deg);

        z-index: 4;

    }



    .voice-figure .hair-lock-left{

        position: absolute;

        left: 0px;

        top: 44px;

        width: 12px;

        height: 52px;

        border-radius: 0 0 18px 18px;

        background: linear-gradient(180deg, #f3c55e 0%, #d79a20 100%);

        transform: rotate(10deg);

        clip-path: polygon(20% 0%, 100% 4%, 100% 88%, 78% 100%, 40% 96%, 0% 70%, 6% 20%);

        z-index: 3;

    }



    .voice-figure .hair-lock-right{

        position: absolute;

        right: 0px;

        top: 42px;

        width: 12px;

        height: 54px;

        border-radius: 0 0 18px 18px;

        background: linear-gradient(180deg, #efbf53 0%, #d2931d 100%);

        transform: rotate(-8deg);

        clip-path: polygon(0% 6%, 80% 0%, 100% 20%, 96% 74%, 68% 100%, 24% 96%, 4% 84%);

        z-index: 3;

    }



    .voice-figure .hair-strand{

        position: absolute;

        top: 10px;

        width: 12px;

        height: 70px;

        background: linear-gradient(180deg, #e7c04e 0%, #c68d22 100%);

        border-radius: 8px 8px 16px 16px;

        z-index: 3;

        opacity: 0.95;

    }



    .voice-figure .hair-strand.s1{ left: 2px; transform: rotate(-10deg); }

    .voice-figure .hair-strand.s2{ left: 12px; transform: rotate(3deg); }

    .voice-figure .hair-strand.s3{ right: 2px; transform: rotate(10deg); }

    .voice-figure .hair-strand.s4{ right: 12px; transform: rotate(-3deg); }



    .voice-figure .hair-highlight{

        position: absolute;

        top: 12px;

        width: 8px;

        height: 62px;

        background: linear-gradient(180deg, #7a4d25 0%, #a06b33 100%);

        border-radius: 8px;

        z-index: 3;

        opacity: 0.55;

    }



    .voice-figure .hair-highlight.h1{ left: 8px; transform: rotate(-7deg); }

    .voice-figure .hair-highlight.h2{ right: 8px; transform: rotate(7deg); }



    .voice-figure .eye{

        position: absolute;

        top: 56px;

        width: 20px;

        height: 11px;

        border-radius: 50% / 75%;

        background: radial-gradient(circle at 40% 40%, #1d4fbc 0%, #103c96 55%, #061f59 100%);

        border: 3px solid #202020;

        box-sizing: border-box;

        z-index: 3;

        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);

    }



    .voice-figure .eye::after{

        content: "";

        position: absolute;

        left: 4px;

        top: 2px;

        width: 4px;

        height: 4px;

        border-radius: 50%;

        background: #ffffff;

    }



    .voice-figure .eye.left{ left: 20px; }

    .voice-figure .eye.right{ right: 20px; }



    .voice-figure .eyebrow{

        position: absolute;

        top: 34px;

        width: 26px;

        height: 7px;

        border-top: 5px solid #6a3f12;

        border-radius: 30px 30px 0 0;

        z-index: 3;

    }



    .voice-figure .eyebrow.left{ left: 18px; transform: rotate(-6deg); }

    .voice-figure .eyebrow.right{ right: 18px; transform: rotate(6deg); }



    .voice-figure .nose{

        position: absolute;

        left: 50%;

        top: 68px;

        width: 10px;

        height: 14px;

        transform: translateX(-50%);

        border-left: 2px solid rgba(184,112,74,0.32);

        border-bottom: 2px solid rgba(184,112,74,0.18);

        border-radius: 0 0 10px 10px;

        z-index: 3;

    }



    .voice-figure .mouth{

        position: absolute;

        left: 50%;

        top: 90px;

        transform: translateX(-50%);

        width: 30px;

        height: 14px;

        border-radius: 0 0 20px 20px;

        background: linear-gradient(180deg, #8f2f2f 0%, #b94a4a 100%);

        z-index: 3;

        overflow: hidden;

        box-shadow: inset 0 2px 0 rgba(255,255,255,0.25);

    }



    .voice-figure .mouth::before{

        content: "";

        position: absolute;

        left: 4px;

        top: 2px;

        width: 22px;

        height: 6px;

        border-radius: 0 0 16px 16px;

        background: rgba(255,255,255,0.9);

    }



    .voice-figure.talking .mouth{

        animation: mouthMove 0.18s infinite alternate ease-in-out;

    }



    .voice-figure.talking .mouth::before{

        background: rgba(255,255,255,0.86);

        top: 3px;

        height: 5px;

    }



    @keyframes mouthMove{

        0% { transform: translateX(-50%) scaleY(0.72); }

        100% { transform: translateX(-50%) scaleY(1.38); }

    }



    .voice-figure .neck{

        position: absolute;

        top: 98px;

        width: 24px;

        height: 24px;

        background: linear-gradient(180deg, #c99669 0%, #b98259 100%);

        border-radius: 0 0 12px 12px;

        z-index: 2;

    }



    .voice-figure .dress{

        position: absolute;

        top: 118px;

        width: 126px;

        height: 116px;

        border-radius: 28px 28px 18px 18px;

        background: linear-gradient(180deg, #2f6f2b 0%, #255a24 100%);

        border: 3px solid rgba(70,70,70,0.18);

        clip-path: polygon(34% 0%, 66% 0%, 92% 18%, 84% 100%, 16% 100%, 8% 18%);

        box-shadow: 0 2px 6px rgba(0,0,0,0.08);

    }



    .voice-figure .dress-neckline{

        position: absolute;

        top: 116px;

        width: 92px;

        height: 34px;

        border-radius: 0 0 42px 42px;

        border-bottom: 3px solid rgba(255,255,255,0.22);

        z-index: 4;

        box-sizing: border-box;

    }



    .voice-figure .dress-belt{

        position: absolute;

        top: 160px;

        width: 116px;

        height: 12px;

        background: #6f5520;

        border-radius: 8px;

        z-index: 4;

        box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);

    }



    .voice-figure .dress-rose{

        position: absolute;

        top: 156px;

        left: 50%;

        transform: translateX(-50%);

        width: 18px;

        height: 18px;

        border-radius: 50%;

        background: radial-gradient(circle at 35% 35%, #ffd8df 0%, #d86a86 60%, #9d2e4c 100%);

        z-index: 5;

        box-shadow: 0 0 0 2px rgba(255,255,255,0.12);

    }



    .voice-figure .arm{

        position: absolute;

        top: 128px;

        width: 20px;

        height: 72px;

        border-radius: 18px;

        background: linear-gradient(180deg, #c99669 0%, #b98259 100%);

        z-index: 1;

    }



    .voice-figure .arm.left{

        left: 18px;

        transform: rotate(18deg);

    }



    .voice-figure .arm.right{

        right: 18px;

        transform: rotate(-16deg);

    }



    .voice-figure .hand{

        position: absolute;

        bottom: -8px;

        left: 50%;

        transform: translateX(-50%);

        width: 26px;

        height: 20px;

        border-radius: 50%;

        background: linear-gradient(180deg, #c99669 0%, #b98259 100%);

    }



    .voice-figure .leg{

        position: absolute;

        top: 194px;

        width: 18px;

        height: 38px;

        background: linear-gradient(180deg, #c99669 0%, #b98259 100%);

        z-index: 1;

    }



    .voice-figure .leg.left{

        left: 50px;

        border-radius: 0 0 12px 12px;

    }



    .voice-figure .leg.right{

        right: 50px;

        border-radius: 0 0 12px 12px;

    }



    .voice-figure .boot{

        position: absolute;

        bottom: -2px;

        width: 24px;

        height: 18px;

        background: #d8c6a2;

        border-radius: 10px 10px 6px 6px;

        border: 2px solid rgba(90,70,40,0.18);

    }



    .voice-figure .boot.left{

        left: 44px;

    }



    .voice-figure .boot.right{

        right: 44px;

    }



    .voice-figure .ring{

        position: absolute;

        right: 40px;

        top: 162px;

        width: 8px;

        height: 8px;

        border-radius: 50%;

        background: radial-gradient(circle at 35% 35%, #fff3a0 0%, #d4a52d 75%, #9c6f10 100%);

        box-shadow: 0 0 0 1px rgba(120,90,20,0.22);

        z-index: 5;

    }

</style>

</head>

<body>
<!-- reszta bez zmian -->
</body>

</html>
