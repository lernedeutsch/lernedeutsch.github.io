<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Deutsch lernen – Lektion 1</title>

<style>
    body{
        font-family: Arial, sans-serif;
        max-width:800px;
        margin:auto;
        padding:20px;
        line-height:1.6;
    }

    .chat-wrapper{
        display:flex;
        gap:15px;
        margin:20px 0;
    }

    .chat-panel{
        border:1px solid #ccc;
        height:350px;
        overflow-y:auto;
        padding:15px;
        background:#fafafa;
        position:relative;
        overflow:hidden;
    }

    #chatLeft{
        flex:1;
    }

    #chatRight{
        flex:3;
    }

    .bot{
        color:darkblue;
        margin:10px 0;
    }

    .user{
        color:green;
        margin:10px 0;
    }

    button{
        padding:10px 20px;
        font-size:16px;
        cursor:pointer;
        margin-right:10px;
    }

    #micButton{
        background-color: #4CAF50;
        color: white;
    }

    #micButton.waiting{
        background-color: #ff4444;
        color: white;
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.7; }
        100% { opacity: 1; }
    }

    #status{
        font-weight:bold;
    }

    .waves {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 140px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
    }

    #chatRight.listening .waves,
    #chatRight.speaking .waves{
        opacity: 1;
    }

    .wave-group{
        animation: moveForever 6s linear infinite;
        transform-origin: center;
    }

    .wave-group.wave2{ animation-duration: 9s; }
    .wave-group.wave3{ animation-duration: 12s; }

    @keyframes moveForever{
        0% { transform: translateX(-20px); }
        50% { transform: translateX(20px); }
        100% { transform: translateX(-20px); }
    }

    .wave-line{
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
    }

    .wave1{ stroke: rgba(76,175,80,0.65); }
    .wave2{ stroke: rgba(76,175,80,0.45); }
    .wave3{ stroke: rgba(76,175,80,0.28); }
</style>
</head>

<body>

<h1>Deutsch lernen von Anfang an</h1>

<h2>Lektion 1 – Guten Tag!</h2>

<p>Thema: Sich kennenlernen und ein kurzes Gespräch führen.</p>

<ul>
<li>Guten Tag</li>
<li>Hallo</li>
<li>Ich heiße ...</li>
<li>Mein Name ist ...</li>
<li>Wie geht es dir?</li>
<li>Gut, danke.</li>
<li>Ich komme aus ...</li>
<li>Tschüss</li>
</ul>

<h2>Nele</h2>

<div class="chat-wrapper">
    <div id="chatLeft" class="chat-panel"></div>
    <div id="chatRight" class="chat-panel">
        <svg class="waves" id="wavesSvg" viewBox="0 0 800 140" preserveAspectRatio="none">
            <g class="wave-group wave1">
                <path class="wave-line wave1" d="M0,70 C80,20 160,120 240,70 C320,20 400,120 480,70 C560,20 640,120 720,70 C760,45 780,35 800,70"></path>
            </g>
            <g class="wave-group wave2">
                <path class="wave-line wave2" d="M0,90 C80,40 160,140 240,90 C320,40 400,140 480,90 C560,40 640,140 720,90 C760,65 780,55 800,90"></path>
            </g>
            <g class="wave-group wave3">
                <path class="wave-line wave3" d="M0,50 C80,0 160,100 240,50 C320,0 400,100 480,50 C560,0 640,100 720,50 C760,25 780,15 800,50"></path>
            </g>
        </svg>
    </div>
</div>

<button onclick="startLesson()">
▶ Lektion starten
</button>

<button id="micButton" onclick="listenAnswer()">
🎤 Mit dem Mikrofon antworten
</button>

<p id="status">
Status: Bereit
</p>

<script>

const chatLeft = document.getElementById("chatLeft");
const chatRight = document.getElementById("chatRight");
const statusText = document.getElementById("status");
const micButton = document.getElementById("micButton");

let lessonStep = 0;
let isWaitingForAnswer = false;
let selectedVoice = null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if(SpeechRecognition){
    recognition = new SpeechRecognition();

    recognition.lang = "de-DE";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = function(event){

        const answer =
            event.results[0][0].transcript.trim();

        statusText.textContent =
            "Status: Antwort erkannt";

        micButton.classList.remove("waiting");
        isWaitingForAnswer = false;
        chatRight.classList.remove("listening");

        addUser(answer);

        evaluate(answer);
    };

    recognition.onerror = function(){

        statusText.textContent =
            "Status: Mikrofonfehler";

        micButton.classList.remove("waiting");
        isWaitingForAnswer = false;
        chatRight.classList.remove("listening");
    };
}

function addBot(text){

    chatLeft.innerHTML +=
        `<div class="bot"><b>🤖 Nele:</b> ${text}</div>`;

    chatLeft.scrollTop = chatLeft.scrollHeight;

    chatRight.classList.add("speaking");
    chatRight.classList.remove("listening");

    speak(text);

    micButton.classList.add("waiting");
    isWaitingForAnswer = true;
}

function addUser(text){

    chatLeft.innerHTML +=
        `<div class="user"><b>🧑 Du:</b> ${text}</div>`;

    chatLeft.scrollTop = chatLeft.scrollHeight;
}

function speak(text){

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    const voices =
        speechSynthesis.getVoices();

    selectedVoice = voices.find(voice =>
        voice.lang === "de-DE" &&
        voice.name.toLowerCase().includes("google") &&
        voice.name.toLowerCase().includes("female")
    );

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("helene")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("katja")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("google")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice => voice.lang === "de-DE");
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice => voice.lang.startsWith("de"));
    }

    if(selectedVoice){
        utterance.voice = selectedVoice;
    }

    utterance.lang = "de-DE";
    utterance.rate = 0.95;
    utterance.pitch = 1.05;
    utterance.volume = 1;

    utterance.onend = function(){
        chatRight.classList.remove("speaking");
    };

    speechSynthesis.speak(utterance);
}

function startLesson(){

    chatLeft.innerHTML = "";
    chatRight.classList.remove("listening");
    chatRight.classList.remove("speaking");

    lessonStep = 1;
    isWaitingForAnswer = false;
    micButton.classList.remove("waiting");

    if(!selectedVoice){
        const voices = speechSynthesis.getVoices();
        selectedVoice = voices.find(voice => voice.lang === "de-DE");
        if(!selectedVoice){
            selectedVoice = voices.find(voice => voice.lang.startsWith("de"));
        }
    }

    addBot(
        "Guten Tag! Ich heiße Nele. Wie heißt du?"
    );
}

function listenAnswer(){

    if(!recognition){

        statusText.textContent =
            "Status: Spracheingabe wird nicht unterstützt.";

        return;
    }

    if(!isWaitingForAnswer){

        statusText.textContent =
            "Status: Nele wartet noch nicht auf deine Antwort.";

        return;
    }

    statusText.textContent =
        "Status: Ich höre zu ...";

    chatRight.classList.add("listening");
    recognition.start();
}

function evaluate(answer){

    const text = answer.toLowerCase();

    if(lessonStep === 1){

        if(
            text.includes("ich heiße") ||
            text.includes("mein name ist")
        ){

            addBot(
                "Freut mich! Wie geht es dir?"
            );

            lessonStep = 2;

        }else{

            addBot(
                "Ich habe deinen Namen nicht verstanden. Du kannst sagen: Ich heiße Anna. Wie heißt du?"
            );
        }

        return;
    }

    if(lessonStep === 2){

        if(
            text.includes("gut") ||
            text.includes("sehr gut") ||
            text.includes("prima") ||
            text.includes("super") ||
            text.includes("es geht")
        ){

            addBot(
                "Schön! Woher kommst du?"
            );

            lessonStep = 3;

        }else{

            addBot(
                "Ich habe dich nicht ganz verstanden. Du kannst sagen: Gut, danke. Wie geht es dir?"
            );
        }

        return;
    }

    if(lessonStep === 3){

        if(
            text.includes("ich komme aus")
        ){

            addBot(
                "Interessant! Was machst du gern in deiner Freizeit?"
            );

            lessonStep = 4;

        }else{

            addBot(
                "Du kannst zum Beispiel sagen: Ich komme aus Polen. Woher kommst du?"
            );
        }

        return;
    }

    if(lessonStep === 4){

        if(
            text.length > 2
        ){

            addBot(
                "Das klingt interessant. Ich muss jetzt leider gehen."
            );

            lessonStep = 5;

        }else{

            addBot(
                "Erzähl mir etwas über deine Freizeit."
            );
        }

        return;
    }

    if(lessonStep === 5){

        if(
            text.includes("tschüss") ||
            text.includes("auf wiedersehen") ||
            text.includes("bis bald") ||
            text.includes("bis später")
        ){

            addBot(
                "Tschüss! Schön, mit dir Deutsch zu sprechen."
            );

            lessonStep = 6;

        }else{

            addBot(
                "Ich gehe jetzt. Was sagt man zum Abschied?"
            );
        }

        return;
    }

    if(lessonStep === 6){

        addBot(
            "Danke für das Gespräch! Starte die Lektion gern noch einmal."
        );
    }
}

speechSynthesis.onvoiceschanged = function() {
    const voices = speechSynthesis.getVoices();

    selectedVoice = voices.find(voice =>
        voice.lang === "de-DE" &&
        voice.name.toLowerCase().includes("google") &&
        voice.name.toLowerCase().includes("female")
    );

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("helene")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("katja")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice =>
            voice.lang === "de-DE" &&
            voice.name.toLowerCase().includes("google")
        );
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice => voice.lang === "de-DE");
    }

    if(!selectedVoice){
        selectedVoice = voices.find(voice => voice.lang.startsWith("de"));
    }
};

</script>

</body>
</html>
